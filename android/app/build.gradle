plugins {
    id 'com.android.application'
}

android {
    namespace 'com.innative.halkaarz'
    compileSdk 35

    defaultConfig {
        applicationId 'com.innative.halkaarz'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '2.0.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        stableDebug {
            storeFile file('halkaarz-debug.keystore')
            storePassword 'android'
            keyAlias 'halkaarz'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
