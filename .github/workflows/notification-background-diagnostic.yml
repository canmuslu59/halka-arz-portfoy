name: Notification Background Diagnostic

on:
  push:
    branches:
      - fix/code36-news-digests-20260924
    paths:
      - .github/workflows/notification-background-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read production health and cron schedules without modifying state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $health = Invoke-RestMethod -Uri 'https://halka-arz-portfoy-push.grass-airboat.workers.dev/api/health' -TimeoutSec 30
          $runtime = $health.push.runtime
          [ordered]@{
            ok = $health.ok
            now = $health.now
            fcmConfigured = $health.push.fcmConfigured
            newsNotificationsEnabled = $health.push.newsNotificationsEnabled
            installationCount = $health.push.installationCount
            runtimeStatus = $runtime.status
            runtimeStartedAt = $runtime.startedAt
            runtimeMarketSent = $runtime.result.sent
            runtimeMarketFailed = $runtime.result.failed
            runtimeMarketTotalTickers = $runtime.result.totalTickers
            runtimeMarketCheckedTickers = $runtime.result.checkedTickers
            runtimeIpoSent = $runtime.result.ipo.sent
            runtimeNewsStatus = $runtime.result.news.status
            runtimeNewsBreakingSent = $runtime.result.news.breakingSent
            runtimeNewsDigestSent = $runtime.result.news.digestSent
            runtimeError = $runtime.result.error
          } | ConvertTo-Json -Compress | Write-Host
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            throw 'Cloudflare diagnostic credentials unavailable'
          }
          $headers = @{ Authorization = "Bearer $env:CLOUDFLARE_API_TOKEN" }
          $account = $env:CLOUDFLARE_ACCOUNT_ID
          $schedules = Invoke-RestMethod -Uri "https://api.cloudflare.com/client/v4/accounts/$account/workers/scripts/halka-arz-portfoy-push/schedules" -Headers $headers -TimeoutSec 30
          if (-not $schedules.success) { throw 'Cloudflare schedules query failed' }
          $crons = @($schedules.result.schedules | ForEach-Object { $_.cron })
          Write-Host "cronCount=$($crons.Count) cronExpressions=$($crons -join ',')"
          $versions = Invoke-RestMethod -Uri "https://api.cloudflare.com/client/v4/accounts/$account/workers/scripts/halka-arz-portfoy-push/versions?per_page=12" -Headers $headers -TimeoutSec 30
          if (-not $versions.success) { throw 'Version inspection failed' }
          $versionsList = @($versions.result.items)
          if ($versionsList.Count -eq 0) { $versionsList = @($versions.result.versions) }
          Write-Host "versionResultFields=$($versions.result.PSObject.Properties.Name -join ',') count=$($versionsList.Count)"
          foreach ($version in $versionsList | Select-Object -First 12) {
            $id = $version.id
            if ([string]::IsNullOrWhiteSpace($id)) { throw 'Missing version ID' }
            $detail = Invoke-RestMethod -Uri "https://api.cloudflare.com/client/v4/accounts/$account/workers/scripts/halka-arz-portfoy-push/versions/$id" -Headers $headers -TimeoutSec 30
            if (-not $detail.success) { throw 'Version detail inspection failed' }
            $names = @($detail.result.resources.bindings | ForEach-Object { $_.name })
            Write-Host "version=$($version.number) id=$id created=$($version.metadata.created_on) newsFlag=$($names -contains 'NEWS_NOTIFICATIONS_ENABLED') newsFeed=$($names -contains 'NEWS_FEED_URL') firebase=$($names -contains 'FIREBASE_SERVICE_ACCOUNT_JSON')"
            if ($version.number -eq 6 -or $version.number -eq 7) {
              $bindings = @($detail.result.resources.bindings | ForEach-Object { "$($_.name):$($_.type)" })
              Write-Host "bindingNamesForVersion$($version.number)=$($bindings -join ',')"
              if ($version.number -eq 6) {
                $newsFlag = @($detail.result.resources.bindings | Where-Object { $_.name -eq 'NEWS_NOTIFICATIONS_ENABLED' })[0]
                $feed = @($detail.result.resources.bindings | Where-Object { $_.name -eq 'NEWS_FEED_URL' })[0]
                $feedUri = [Uri]$feed.text
                Write-Host "priorNewsFlag=$($newsFlag.text) priorFeedType=$($feed.type) priorFeedScheme=$($feedUri.Scheme) priorFeedHost=$($feedUri.Host) priorFeedPath=$($feedUri.AbsolutePath) priorFeedHasQuery=$(-not [string]::IsNullOrEmpty($feedUri.Query))"
              }
            }
          }
          $cutoff = [DateTimeOffset]::Parse('2026-09-25T07:40:05Z')
          $verified = $false
          for ($attempt = 0; $attempt -lt 18; $attempt++) {
            $latest = Invoke-RestMethod -Uri 'https://halka-arz-portfoy-push.grass-airboat.workers.dev/api/health' -TimeoutSec 30
            $runtime = $latest.push.runtime
            $started = [DateTimeOffset]::Parse([string]$runtime.startedAt)
            if ($started -gt $cutoff) {
              Write-Host "PostRestoreAlarmAt=$($runtime.startedAt) status=$($runtime.status) newsStatus=$($runtime.result.news.status) marketChecked=$($runtime.result.checkedTickers)"
              if ($latest.push.fcmConfigured -ne $true -or $latest.push.newsNotificationsEnabled -ne $true -or $runtime.result.news.status -ne 'checked') {
                throw 'Background news evaluation did not resume after deployment'
              }
              $verified = $true
              break
            }
            Start-Sleep -Seconds 10
          }
          if (-not $verified) { throw 'No new Durable Object background run was observed after restore' }
