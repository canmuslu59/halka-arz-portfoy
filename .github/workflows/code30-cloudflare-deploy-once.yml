name: Code30 Cloudflare Deploy Once

on:
  push:
    branches: [release/v2.4.7-code30]
    paths:
      - .github/workflows/code30-cloudflare-deploy-once.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'CLOUDFLARE_API_TOKEN=missing'; exit 2; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo 'CLOUDFLARE_ACCOUNT_ID=missing'; exit 2; }
          echo 'Cloudflare credentials present.'
      - name: Verify closed-app alert regression
        run: node --test test/background-closed-alert-regression.test.js test/verified-market-reference.test.js test/cloudflare-durable-store.test.js test/backend-alert-engine.test.js test/backend-service.test.js
      - name: Deploy production worker
        run: npx -y wrangler@4.131.1 deploy --config wrangler.jsonc
      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          URL='https://halka-arz-portfoy-push.grass-airboat.workers.dev/api/health'
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error "$URL" -o /tmp/health.json; then
              node -e "const h=require('/tmp/health.json'); if(!h.ok) process.exit(1); console.log(JSON.stringify(h));"
              exit 0
            fi
            sleep 2
          done
          exit 1
