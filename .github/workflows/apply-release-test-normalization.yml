name: Apply release identity test normalization

on:
  push:
    branches:
      - release/v2.4.0-code22
    paths:
      - .github/workflows/apply-release-test-normalization.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Normalize stale Phase 1 identity assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [
            'test/android-build-hardening.test.js',
            'test/android-contract.test.js',
            'test/android-notification-background-behavior.test.js',
            'test/data-cache-notification-behavior.test.js',
            'test/settings-contract.test.js',
            'test/ui-contract.test.js',
            'test/ui-market-notification-regression.test.js',
          ]
          changed = 0
          for name in files:
              path = Path(name)
              text = path.read_text()
              original = text
              text = text.replace('versionCode 21', 'versionCode 22')
              text = text.replace(r'2\.3\.9', r'2\.4\.0')
              text = text.replace('2.3.9', '2.4.0')
              text = text.replace('Build 21', 'Build 22')
              text = text.replace('Phase 1 keeps the last published Play identity until release phase', 'Release candidate advances the Play identity after Phase 1')
              text = text.replace('Play update identity advances to versionCode 21 / versionName 2.3.9', 'Play release identity is versionCode 22 / versionName 2.4.0')
              text = text.replace('IPO calendar cache uses the current schema while Phase 1 keeps the published Play identity', 'IPO calendar cache uses the current schema alongside the release identity')
              text = text.replace('Android shell and bundled UI follow the current published Play identity', 'Android shell and bundled UI follow the release candidate identity')
              if text == original:
                  raise SystemExit(f'expected stale identity was not found in {name}')
              path.write_text(text)
              changed += 1
          if changed != 7:
              raise SystemExit(f'expected 7 changed test files, got {changed}')
          PY
      - name: Full regression suite
        run: npm test
      - name: Verify release identity contract
        run: node --test test/release-identity.test.js
      - name: Commit normalized contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/android-build-hardening.test.js test/android-contract.test.js test/android-notification-background-behavior.test.js test/data-cache-notification-behavior.test.js test/settings-contract.test.js test/ui-contract.test.js test/ui-market-notification-regression.test.js
          git diff --cached --check
          git commit -m 'test: align contracts with v2.4.0 code22 release'
          git push origin HEAD:release/v2.4.0-code22
