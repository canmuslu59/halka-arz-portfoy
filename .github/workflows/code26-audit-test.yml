name: Code26 Audit Test APK
on:
  push:
    branches: [fix/code26-audit-test-20260911]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: |
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - run: gradle -p android --no-daemon assembleDebug
      - run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk halka-arz-portfoyum-code26-audit-test.apk
          sha256sum halka-arz-portfoyum-code26-audit-test.apk > apk-sha256.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: code26-audit-test-apk
          path: |
            halka-arz-portfoyum-code26-audit-test.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
