name: Portfolio Management Lab APK

on:
  push:
    branches:
      - feature/portfolio-management-lab-20261010
    paths:
      - "public/**"
      - "android/**"
      - "test/**"
      - "package*.json"
      - "scripts/sync-android-assets.mjs"
      - ".github/workflows/portfolio-management-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-management-lab-apk
  cancel-in-progress: true

jobs:
  build-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUSH_BACKEND_URL: ""
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: JavaScript regression tests
        run: |
          node --check public/lab.js
          node --check public/core/lab-ledger.js
          npm test
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true
      - name: Sync web assets
        run: npm run android:sync
      - name: Verify lab package isolation and no billing
        run: |
          grep -q "applicationIdSuffix '.lab'" android/app/build.gradle
          grep -q "versionCode 43" android/app/build.gradle
          grep -q "versionName '2.5.9'" android/app/build.gradle
          grep -q 'labOverlay' android/app/src/main/assets/www/index.html
          test -z "$PUSH_BACKEND_URL"
      - name: Build isolated lab APK
        run: gradle --project-dir android --no-daemon :app:assembleDebug
      - name: Verify output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/www/(index.html|lab.js|core/lab-ledger.js)'
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-yonetimi-lab-code43-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
