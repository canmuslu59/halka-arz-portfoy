name: Cleanup Obsolete Release Paths

on:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - '.github/workflows/cleanup-obsolete-release-paths.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard retained Phase1 verification paths
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/inspect-flatten-blockers.yml
          test -f .github/workflows/phase1-tdd.yml
          test -d UPLOAD_TO_GITHUB
          test -f KURULUM.txt
          test -f noop.tmp
          test -f .github/workflows/android-apk.yml
          test -f .github/workflows/android-code22.yml
          test -f .github/workflows/android-play-bootstrap.yml
          refs="$(git grep -nE 'UPLOAD_TO_GITHUB|noop\.tmp' -- ':!.github/workflows/cleanup-obsolete-release-paths.yml' ':!KURULUM.txt' || true)"
          if [ -n "$refs" ]; then
            echo 'Unexpected retained references to cleanup-only paths:'
            echo "$refs"
            exit 1
          fi

      - name: Remove obsolete artifact and duplicate-source paths
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf \
            UPLOAD_TO_GITHUB \
            KURULUM.txt \
            noop.tmp \
            .github/workflows/android-apk.yml \
            .github/workflows/android-code22.yml \
            .github/workflows/android-play-bootstrap.yml \
            .github/workflows/cleanup-obsolete-release-paths.yml

      - name: Verify historical transforms are no longer build inputs
        shell: bash
        run: |
          set -euo pipefail
          refs="$(git grep -nE '\.ci/(code17-launcher|code18-|code19-|code20-transform|code21-transform|code22-transform|code22-postfix|code22-regression)' -- .github/workflows test public android backend server.js package.json 2>/dev/null || true)"
          if [ -n "$refs" ]; then
            echo 'Historical reconstruction input still referenced by active source/test/build path:'
            echo "$refs"
            exit 1
          fi

      - run: npm ci

      - name: Full regression suite
        run: npm test

      - name: Verify Android assets remain exact
        shell: bash
        run: |
          set -euo pipefail
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --exit-code -- public android/app/src/main/assets/www

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: remove obsolete release and duplicate source paths"
          git push origin HEAD:refactor/code22-clean-source-work2
