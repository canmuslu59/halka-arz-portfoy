name: Cleanup Obsolete CI Payloads

on:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - '.github/workflows/cleanup-obsolete-ci-payloads.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard retained verification and migration evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f .ci/BackgroundRetryPolicyHarness.java
          test -f .ci/NativeHttpPolicyHarness.java
          test -d .ci/current-audit
          test -f .ci/code20-transform.py
          test -f .ci/code21-transform.py
          test -f .ci/code22-transform.py
          test -f .ci/code22-postfix.py
          test -f .ci/v233-transform.py
          test -f .ci/v233-refined-layout-transform.py
          test -f .ci/v235-release-transform.py
          test -f .ci/v236-transform.py

          refs="$(git grep -nE '\.ci/(code17-launcher|code18-(delta|full|full-source|overlay)|code19-delta|code22-regression|v233-icon|v233-small)' -- .github/workflows scripts package.json README.md android public backend server.js 2>/dev/null | grep -v 'cleanup-obsolete-ci-payloads.yml' || true)"
          if [ -n "$refs" ]; then
            echo 'Obsolete CI payload is still an active build/runtime input:'
            echo "$refs"
            exit 1
          fi

          refs="$(git grep -n 'IpoCalendarParserHarness' -- .github/workflows scripts package.json 2>/dev/null | grep -v 'cleanup-obsolete-ci-payloads.yml' || true)"
          if [ -n "$refs" ]; then
            echo 'IpoCalendarParserHarness is still active:'
            echo "$refs"
            exit 1
          fi

      - name: Remove unreferenced reconstruction payloads
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf \
            .ci/IpoCalendarParserHarness.java \
            .ci/code17-launcher.webp.b64 \
            .ci/code18-delta \
            .ci/code18-full-source \
            .ci/code18-full \
            .ci/code18-overlay \
            .ci/code19-delta \
            .ci/code22-regression.test.js \
            .ci/v233-icon.b64 \
            .ci/v233-icon.part00 \
            .ci/v233-icon.part01 \
            .ci/v233-icon.part02 \
            .ci/v233-icon.part03 \
            .ci/v233-icon.part04 \
            .ci/v233-small.part0 \
            .ci/v233-small.part1 \
            .ci/v233-small.part2 \
            .ci/v233-small.part3 \
            .github/workflows/cleanup-obsolete-ci-payloads.yml

      - name: Verify retained CI surface
        shell: bash
        run: |
          set -euo pipefail
          test -f .ci/BackgroundRetryPolicyHarness.java
          test -f .ci/NativeHttpPolicyHarness.java
          test -d .ci/current-audit
          test -f .ci/code20-transform.py
          test -f .ci/code21-transform.py
          test -f .ci/code22-transform.py
          test -f .ci/v236-transform.py

      - run: npm ci
      - name: Full regression suite
        run: npm test
      - name: Verify Android assets remain exact
        shell: bash
        run: |
          set -euo pipefail
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --exit-code -- public android/app/src/main/assets/www
      - name: Commit verified CI cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: remove obsolete CI reconstruction payloads"
          git push origin HEAD:refactor/code22-clean-source-work2
