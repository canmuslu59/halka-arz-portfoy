name: Apply notification semantic dedupe fix

on:
  push:
    branches:
      - audit/code25-notification-hardening-20260911
    paths:
      - .github/workflows/apply-notification-dedupe-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply semantic delivery identity fix
        run: python3 scripts/apply-notification-dedupe-fix.py
      - name: Synchronize Android assets
        run: node scripts/sync-android-assets.mjs
      - run: npm ci
      - name: Focused notification audit
        run: node --test test/notification-stability-audit.test.js
      - name: Full regression suite
        run: npm test
      - name: Validate diff
        run: git diff --check
      - name: Commit proven fix and remove one-time patcher
        run: |
          rm scripts/apply-notification-dedupe-fix.py
          rm .github/workflows/apply-notification-dedupe-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: dedupe portfolio alerts by threshold level"
          git push origin HEAD:audit/code25-notification-hardening-20260911
