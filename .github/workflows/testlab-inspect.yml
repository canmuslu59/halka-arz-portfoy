name: Inspect Test Lab Resilience Failure

on:
  push:
    branches:
      - ci/firebase-test-lab-next-20260926
    paths:
      - .github/workflows/testlab-inspect.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: auth
        name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: halka-arz-portfoyum
          workload_identity_provider: projects/968125285231/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-testlab@halka-arz-portfoyum.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 1800s

      - name: Download small Robo diagnostics
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          bucket='test-lab-89qf6bn70y7fq-nyx2qc6p82w70'
          prefix='results/github/37-single-resilience-1790353916800/MediumPhone_ps16k.arm-37-tr-portrait'
          mkdir -p testlab-inspect

          for name in actions.json crawlscript.json; do
            object="$prefix/$name"
            encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$object")"
            url="https://storage.googleapis.com/storage/v1/b/$bucket/o/$encoded?alt=media"
            curl --fail --silent --show-error --location \
              --max-time 45 \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "$url" -o "testlab-inspect/$name"
            echo "DOWNLOADED=$name bytes=$(wc -c < "testlab-inspect/$name")"
          done

      - name: Summarize Robo diagnostics
        run: |
          echo '--- actions.json ---'
          head -c 30000 testlab-inspect/actions.json || true
          echo
          echo '--- crawlscript.json ---'
          head -c 30000 testlab-inspect/crawlscript.json || true
          echo

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testlab-resilience-diagnostics-small
          path: testlab-inspect/
          if-no-files-found: error
          retention-days: 14
