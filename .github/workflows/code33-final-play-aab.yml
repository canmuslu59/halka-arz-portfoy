name: Code33 Final Play AAB

on:
  push:
    branches:
      - release/v2.5.0-code33
    paths:
      - .github/workflows/code33-final-play-aab.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code33-final-play-aab
  cancel-in-progress: true

env:
  PUSH_BACKEND_URL: https://halka-arz-portfoy-push.grass-airboat.workers.dev

jobs:
  build-code33:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        shell: powershell
        run: npm ci

      - name: Run complete regression suite
        shell: powershell
        run: |
          node --test --test-concurrency=1 test/*.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check public/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sync Android base assets
        shell: powershell
        run: |
          npm run android:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply all approved test experience
        shell: powershell
        run: |
          node scripts/apply-test-share-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-test-wallet-metrics-nav.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-test-portfolio-app-navigation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-performance-history-data-fix.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-fixed-bottom-dock-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check android/app/src/main/assets/www/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Code33 promoted UI, widget and edge-to-edge
        shell: powershell
        run: |
          $gradle = Get-Content -Raw android/app/build.gradle
          $index = Get-Content -Raw android/app/src/main/assets/www/index.html
          $app = Get-Content -Raw android/app/src/main/assets/www/app.js
          $activity = Get-Content -Raw android/app/src/main/java/com/innative/halkaarz/MainActivity.java
          $manifest = Get-Content -Raw android/app/src/main/AndroidManifest.xml
          $scheduler = Get-Content -Raw android/app/src/main/java/com/innative/halkaarz/NewsTestScheduler.java
          $preview = Get-Content -Raw android/app/src/main/java/com/innative/halkaarz/NewsTestPreviewWorker.java

          foreach ($needle in @(
            "applicationId 'com.innative.halkaarz'",
            'versionCode 33',
            "versionName '2.5.0'"
          )) {
            if (-not $gradle.Contains($needle)) { throw "Release identity missing: $needle" }
          }

          foreach ($needle in @(
            'id="walletHomeTab"',
            'id="weeklyMoversCard"',
            'historyFinite',
            'renderHistoryChartSummary',
            'Sermaye Girişi',
            'Değer Değişimi',
            'id="popularNewsRail"',
            'id="latestNewsList"',
            'GENERIC_FINANCE_NEWS_TITLES',
            'financeNewsIsArticle',
            'updateWalletWidget'
          )) {
            if (-not ($index.Contains($needle) -or $app.Contains($needle))) { throw "Promoted test behavior missing: $needle" }
          }

          foreach ($forbidden in @(
            'WindowCompat.enableEdgeToEdge',
            'setStatusBarColor',
            'setNavigationBarColor'
          )) {
            if ($activity.Contains($forbidden)) { throw "Deprecated edge-to-edge API path still present: $forbidden" }
          }
          if (-not $activity.Contains('Build.VERSION.SDK_INT >= 35')) { throw 'Android 15 inset branch missing' }
          if (-not $activity.Contains('requestPinAppWidget')) { throw 'Wallet widget pin request missing' }
          if (-not $manifest.Contains('WalletWidgetProvider')) { throw 'Wallet widget receiver missing' }

          if (-not $scheduler.Contains('"com.innative.halkaarz".equals(appId)')) { throw 'Production news fallback is not enabled' }
          if (-not $scheduler.Contains('static boolean previewEnabled()')) { throw 'Test preview gate missing' }
          if (-not $preview.Contains('NewsTestScheduler.previewEnabled()')) { throw 'Fake preview is not hard-gated to test' }

      - name: Verify live Code32 market notification core byte parity
        shell: powershell
        run: |
          $expected = @{
            'android/app/src/main/java/com/innative/halkaarz/BackgroundAlertScheduler.java' = '7d911722cdbd0f7fd1a96317752399c232a6e5e3'
            'android/app/src/main/java/com/innative/halkaarz/BackgroundAlertWorker.java' = '5474484163e63853e9b6639199cc92b9467f11ef'
            'android/app/src/main/java/com/innative/halkaarz/PushConfigSync.java' = '2636caca40f5eb5ed44bfb80bc2f9e8fe539f25b'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $bytes = [System.IO.File]::ReadAllBytes($entry.Key)
            $header = [System.Text.Encoding]::ASCII.GetBytes("blob $($bytes.Length)" + [char]0)
            $all = New-Object byte[] ($header.Length + $bytes.Length)
            [Array]::Copy($header, 0, $all, 0, $header.Length)
            [Array]::Copy($bytes, 0, $all, $header.Length, $bytes.Length)
            $sha1 = [System.Security.Cryptography.SHA1]::Create()
            try {
              $actual = ([BitConverter]::ToString($sha1.ComputeHash($all))).Replace('-', '').ToLowerInvariant()
            } finally {
              $sha1.Dispose()
            }
            if ($actual -ne $entry.Value) {
              throw "Live Code32 parity failed for $($entry.Key): expected $($entry.Value), got $actual"
            }
          }
          Write-Host 'Live Code32 market scheduler/worker/config are byte-identical.'

      - name: Configure production Firebase client
        shell: powershell
        run: |
          $firebaseJson = '{"project_info":{"project_number":"181104463772","project_id":"halka-arz-portfoyum-d86ff","storage_bucket":"halka-arz-portfoyum-d86ff.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:181104463772:android:0079989b9d3c4ef85fcb9d","android_client_info":{"package_name":"com.innative.halkaarz"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyByYlMz5g9cwzXUjfVFlLIM0A564z-fO88"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}'
          [System.IO.File]::WriteAllText('android/app/google-services.json', $firebaseJson, (New-Object System.Text.UTF8Encoding($false)))
          $config = Get-Content -Raw android/app/google-services.json
          if (-not $config.Contains('"package_name":"com.innative.halkaarz"')) { throw 'Production Firebase package mismatch' }
          if ($config.Contains('.graphtest') -or $config.Contains('.test"')) { throw 'Test Firebase identity leaked into production build' }

      - name: Configure Android SDK 36
        shell: powershell
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk -or -not (Test-Path $sdk)) {
            if (Test-Path 'C:\actions-runner\android-sdk') {
              $sdk = 'C:\actions-runner\android-sdk'
            } elseif ($env:ANDROID_HOME -and (Test-Path $env:ANDROID_HOME)) {
              $sdk = $env:ANDROID_HOME
            } else {
              throw 'Android SDK root not found'
            }
          }
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sdkmanager = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
          & $sdkmanager "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Compile production release
        shell: powershell
        run: |
          gradle -p android --no-daemon compileReleaseJavaWithJavac
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build production AAB
        shell: powershell
        run: |
          gradle -p android --no-daemon bundleRelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require and verify Play upload signing key
        shell: powershell
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          foreach ($name in @('PLAY_UPLOAD_KEYSTORE_BASE64','PLAY_UPLOAD_KEYSTORE_PASSWORD','PLAY_UPLOAD_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) { throw "Missing required signing secret: $name" }
          }
          $key = Join-Path $env:RUNNER_TEMP 'hisse-portfoyum-upload.jks'
          [System.IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:PLAY_UPLOAD_KEYSTORE_BASE64))
          $alias = if ([string]::IsNullOrWhiteSpace($env:PLAY_UPLOAD_KEY_ALIAS)) { 'halkaarz-upload' } else { $env:PLAY_UPLOAD_KEY_ALIAS }

          $certInfo = (& keytool -list -v -keystore $key -alias $alias '-storepass:env' PLAY_UPLOAD_KEYSTORE_PASSWORD 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read configured Play upload certificate' }
          $normalized = ($certInfo -replace '[^0-9A-Fa-f]','').ToLowerInvariant()
          $expected = '02d9f298a56b63ec9067b911fc898907b6fdfc4e059143d88f0b9df24022a272'
          if (-not $normalized.Contains($expected)) { throw 'Configured upload certificate does not match Code32 Play upload certificate' }

          "PLAY_UPLOAD_KEYSTORE_PATH=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PLAY_UPLOAD_KEY_ALIAS_RESOLVED=$alias" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign verify and package Code33
        shell: powershell
        env:
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          $unsigned = 'android/app/build/outputs/bundle/release/app-release.aab'
          if (-not (Test-Path $unsigned)) { throw 'Unsigned AAB not produced' }
          if ((Get-Item $unsigned).Length -lt 100000) { throw 'AAB unexpectedly small' }

          New-Item -ItemType Directory -Force dist | Out-Null
          $signed = 'dist/Hisse-Portfoyum-v2.5.0-Code33-Play.aab'

          & jarsigner -keystore $env:PLAY_UPLOAD_KEYSTORE_PATH '-storepass:env' PLAY_UPLOAD_KEYSTORE_PASSWORD '-keypass:env' PLAY_UPLOAD_KEY_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 -signedjar $signed $unsigned $env:PLAY_UPLOAD_KEY_ALIAS_RESOLVED
          if ($LASTEXITCODE -ne 0) { throw 'AAB signing failed' }

          & jarsigner -verify -verbose -certs $signed | Out-File -Encoding utf8 dist/jarsigner-verification.txt
          if ($LASTEXITCODE -ne 0) { throw 'Signed AAB verification failed' }

          $certInfo = (& keytool -printcert -jarfile $signed 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect signed AAB certificate' }
          $normalized = ($certInfo -replace '[^0-9A-Fa-f]','').ToLowerInvariant()
          $expected = '02d9f298a56b63ec9067b911fc898907b6fdfc4e059143d88f0b9df24022a272'
          if (-not $normalized.Contains($expected)) { throw 'Signed AAB certificate mismatch with Code32' }

          $sha = (Get-FileHash $signed -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Hisse-Portfoyum-v2.5.0-Code33-Play.aab" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          @(
            'package=com.innative.halkaarz',
            'appName=Hisse Portföyüm',
            'versionName=2.5.0',
            'versionCode=33',
            "sourceCommit=$env:GITHUB_SHA",
            "backend=$env:PUSH_BACKEND_URL",
            'firebase=production',
            'marketCore=Code32 byte-identical',
            'newsFallback=production enabled',
            'fakeNewsPreview=graph-test only',
            'walletWidget=true',
            'deprecatedEdgeToEdgeApiPath=false',
            'playUploadCertificateSha256=02d9f298a56b63ec9067b911fc898907b6fdfc4e059143d88f0b9df24022a272'
          ) | Set-Content -Encoding utf8 dist/BUILD-INFO.txt

          $out = 'C:\actions-runner\output'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item $signed (Join-Path $out 'Hisse-Portfoyum-v2.5.0-Code33-Play.aab') -Force
          Copy-Item 'dist/SHA256SUMS.txt' (Join-Path $out 'Hisse-Portfoyum-v2.5.0-Code33-Play.sha256.txt') -Force

      - uses: actions/upload-artifact@v4
        with:
          name: code33-final-play-aab
          path: |
            dist/Hisse-Portfoyum-v2.5.0-Code33-Play.aab
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
            dist/jarsigner-verification.txt
          if-no-files-found: error
          retention-days: 30
