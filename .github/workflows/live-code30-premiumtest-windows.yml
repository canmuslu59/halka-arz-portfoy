name: Live Code30 Premium Test Baseline

on:
  push:
    branches:
      - integration/live-code30-premiumtest-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-premiumtest:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    env:
      PUSH_BACKEND_URL: https://halka-arz-portfoy-push.grass-airboat.workers.dev
      AOSP_BUILD_COMMIT: 897e2ff8232b9f7a96493855e57f7a01f999109e

    steps:
      - uses: actions/checkout@v4

      - name: Checkout live Code30 reference
        uses: actions/checkout@v4
        with:
          ref: release/v2.4.7-code30
          path: _livebaseline

      - name: Protect live notification and pricing core
        shell: powershell
        run: |
          $protected = @(
            'public/core/market-reference.js',
            'public/core/parsers.js',
            'public/core/data-sources.js',
            'public/core/portfolio-service.js',
            'public/core/notification-rules.js',
            'public/notification-recovery.js',
            'android/app/src/main/java/com/innative/halkaarz/BackgroundAlertWorker.java',
            'android/app/src/main/java/com/innative/halkaarz/NotificationHelper.java',
            'android/app/src/main/java/com/innative/halkaarz/PushConfigSync.java',
            'backend/alert-engine.js',
            'backend/service.js'
          )
          foreach ($file in $protected) {
            $currentFile = Join-Path $env:GITHUB_WORKSPACE $file
            $baselineFile = Join-Path (Join-Path $env:GITHUB_WORKSPACE '_livebaseline') $file
            if (!(Test-Path $currentFile) -or !(Test-Path $baselineFile)) {
              throw "Protected file missing: $file"
            }
            $a = (Get-FileHash $currentFile -Algorithm SHA256).Hash
            $b = (Get-FileHash $baselineFile -Algorithm SHA256).Hash
            if ($a -ne $b) { throw "Protected live file changed: $file" }
          }
          Remove-Item -Recurse -Force (Join-Path $env:GITHUB_WORKSPACE '_livebaseline')
          Write-Host 'LIVE_PROTECTED_CORE_OK'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK on self-hosted Windows
        shell: powershell
        run: |
          $sdkRoot = 'C:\actions-runner\android-sdk'
          $sdkmanager = Join-Path $sdkRoot 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (!(Test-Path $sdkmanager)) {
            New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP 'commandlinetools-win.zip'
            $extract = Join-Path $env:RUNNER_TEMP 'android-cmdline-extract'
            Remove-Item -Recurse -Force $extract -ErrorAction SilentlyContinue
            Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
            $latest = Join-Path $sdkRoot 'cmdline-tools\latest'
            Remove-Item -Recurse -Force $latest -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $latest | Out-Null
            Copy-Item -Path (Join-Path $extract 'cmdline-tools\*') -Destination $latest -Recurse -Force
          }
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $sdkRoot 'cmdline-tools\latest\bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $sdkRoot 'platform-tools') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          & $sdkmanager --sdk_root=$sdkRoot 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          $required = @(
            (Join-Path $sdkRoot 'platform-tools'),
            (Join-Path $sdkRoot 'platforms\android-36'),
            (Join-Path $sdkRoot 'build-tools\36.0.0')
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) {
              throw 'Android SDK 36 packages are not installed. Accept Android SDK licenses once on the runner, then rerun.'
            }
          }

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Run complete regression suite
        shell: powershell
        run: node --test --test-force-exit --test-timeout=120000 "test/*.test.js"

      - name: Verify Premium random fake notification harness
        shell: powershell
        run: node --test test/premium-test-random-notifications.test.js

      - name: Sync Android assets
        shell: powershell
        run: |
          npm run android:sync
          node --check public/app.js
          node --check android/app/src/main/assets/www/app.js

      - name: Configure isolated Halka Arz Premium Test identity
        shell: powershell
        run: |
          $versionCode = 40000 + $env:GITHUB_RUN_NUMBER
          "TEST_VERSION_CODE=$versionCode" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $path = 'android/app/build.gradle'
          $text = Get-Content $path -Raw
          $text = [regex]::Replace($text, 'versionCode\s+\d+', "versionCode $versionCode", 1)
          $pattern = "release\s*\{\s*minifyEnabled false"
          $replacement = @"
          release {
              applicationIdSuffix '.premiumtest'
              versionNameSuffix '-premium-test'
              resValue 'string', 'app_name', 'Halka Arz Premium Test'
              minifyEnabled false
          "@
          $updated = [regex]::Replace($text, $pattern, $replacement, 1)
          if ($updated -eq $text) { throw 'release identity replacement failed' }
          Set-Content -Path $path -Value $updated -Encoding utf8
          Select-String -Path $path -SimpleMatch "applicationIdSuffix '.premiumtest'"
          Select-String -Path $path -SimpleMatch "versionNameSuffix '-premium-test'"
          Select-String -Path $path -SimpleMatch "Halka Arz Premium Test"
          Select-String -Path $path -SimpleMatch "versionCode $versionCode"


      - name: Setup Gradle 8.11.1 on self-hosted Windows
        shell: powershell
        run: |
          $root = 'C:\actions-runner\gradle'
          $home = Join-Path $root 'gradle-8.11.1'
          $bin = Join-Path $home 'bin\gradle.bat'
          if (!(Test-Path $bin)) {
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP 'gradle-8.11.1-bin.zip'
            Invoke-WebRequest -Uri 'https://services.gradle.org/distributions/gradle-8.11.1-bin.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          }
          if (!(Test-Path $bin)) { throw 'Gradle 8.11.1 bootstrap failed' }
          "GRADLE_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $bin --version
          if ($LASTEXITCODE -ne 0) { throw 'Gradle version check failed' }

      - name: Build Premium Test APK
        shell: powershell
        run: |
          & $env:GRADLE_BIN -p android --no-daemon compileReleaseJavaWithJavac
          if ($LASTEXITCODE -ne 0) { throw 'Java compile failed' }
          & $env:GRADLE_BIN -p android --no-daemon assembleRelease
          if ($LASTEXITCODE -ne 0) { throw 'APK build failed' }

      - name: Sign Premium Test APK
        shell: powershell
        run: |
          $base = "https://raw.githubusercontent.com/aosp-mirror/platform_build/$env:AOSP_BUILD_COMMIT/target/product/security"
          $key = Join-Path $env:RUNNER_TEMP 'aosp-testkey.pk8'
          $cert = Join-Path $env:RUNNER_TEMP 'aosp-testkey.x509.pem'
          Invoke-WebRequest -Uri "$base/testkey.pk8" -OutFile $key
          Invoke-WebRequest -Uri "$base/testkey.x509.pem" -OutFile $cert

          $buildTools = Join-Path $env:ANDROID_HOME 'build-tools\36.0.0'
          $unsigned = 'android/app/build/outputs/apk/release/app-release-unsigned.apk'
          $aligned = Join-Path $env:RUNNER_TEMP 'premiumtest-aligned.apk'
          $signed = Join-Path $env:RUNNER_TEMP 'premiumtest-signed.apk'
          if (!(Test-Path $unsigned)) { throw 'Unsigned APK not found' }

          & (Join-Path $buildTools 'zipalign.exe') -p -f 4 $unsigned $aligned
          if ($LASTEXITCODE -ne 0) { throw 'zipalign failed' }

          & (Join-Path $buildTools 'apksigner.bat') sign --key $key --cert $cert --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out $signed $aligned
          if ($LASTEXITCODE -ne 0) { throw 'APK signing failed' }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $signed 'dist/halka-arz-premium-test-baseline.apk'

      - name: Verify Premium Test APK
        shell: powershell
        run: |
          $apk = 'dist/halka-arz-premium-test-baseline.apk'
          $buildTools = Join-Path $env:ANDROID_HOME 'build-tools\36.0.0'
          & (Join-Path $buildTools 'apksigner.bat') verify --verbose --print-certs $apk | Tee-Object -FilePath 'dist/apk-signature.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Signature verification failed' }

          & (Join-Path $buildTools 'aapt.exe') dump badging $apk | Tee-Object -FilePath 'dist/apk-badging.txt'
          if ($LASTEXITCODE -ne 0) { throw 'aapt verification failed' }

          $badging = Get-Content 'dist/apk-badging.txt' -Raw
          if ($badging -notmatch "package: name='com\.innative\.halkaarz\.premiumtest'") { throw 'Wrong Premium Test package' }
          if ($badging -notmatch "application-label:'Halka Arz Premium Test'") { throw 'Wrong Premium Test label' }

          Get-FileHash $apk -Algorithm SHA256 | Format-List | Out-File 'dist/SHA256SUMS.txt'
          @(
            'base=release/v2.4.7-code30',
            'package=com.innative.halkaarz.premiumtest',
            'appName=Halka Arz Premium Test',
            "sourceCommit=$env:GITHUB_SHA",
            "versionCode=$env:TEST_VERSION_CODE",
            'liveNotificationCore=protected',
            'livePricingCore=protected',
            'fakeNotifications=premiumtest-only; four randomized notifications per rolling hour',
            'removeFakeNotificationsBeforeMain=true'
          ) | Set-Content 'dist/BUILD-INFO.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: live-code30-premiumtest-baseline
          path: |
            dist/halka-arz-premium-test-baseline.apk
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
            dist/apk-signature.txt
            dist/apk-badging.txt
          if-no-files-found: error
          retention-days: 14
