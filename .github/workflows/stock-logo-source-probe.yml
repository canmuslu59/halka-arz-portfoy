name: Stock Logo Source Probe

on:
  push:
    branches:
      - feature/test-liked-rollback-20260917
  workflow_dispatch:

jobs:
  verify-stock-logos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify direct BIST company logo assets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const symbols = ['GARAN', 'THYAO', 'ASELS', 'BIMAS'];
          const base = 'https://cdn.jsdelivr.net/gh/ahmeterenodaci/Istanbul-Stock-Exchange--BIST--including-symbols-and-logos';
          const headers = {
            'User-Agent': 'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/151 Mobile Safari/537.36',
            'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
          };

          const listResponse = await fetch(`${base}/without_logo.json`, { redirect: 'follow' });
          if (!listResponse.ok) throw new Error(`BIST symbol list HTTP ${listResponse.status}`);
          const list = await listResponse.json();
          const known = new Set((Array.isArray(list) ? list : []).map(item => String(item?.symbol || '').toUpperCase()));

          for (const symbol of symbols) {
            if (!known.has(symbol)) throw new Error(`${symbol}: symbol missing from source list`);
            const logo = `${base}/logos/${encodeURIComponent(symbol)}.png`;
            const imageResponse = await fetch(logo, { headers, redirect: 'follow' });
            const contentType = imageResponse.headers.get('content-type') || '';
            if (!imageResponse.ok) throw new Error(`${symbol}: logo HTTP ${imageResponse.status}`);
            if (!contentType.toLowerCase().startsWith('image/')) throw new Error(`${symbol}: unexpected logo content-type ${contentType}`);
            const bytes = Buffer.from(await imageResponse.arrayBuffer()).length;
            if (bytes < 100) throw new Error(`${symbol}: logo payload too small (${bytes} bytes)`);
            console.log(`${symbol}: ${imageResponse.status} ${contentType} ${bytes} bytes`);
          }
          NODE
