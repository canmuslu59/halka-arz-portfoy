name: Apply Code23 Fixes

on:
  push:
    branches:
      - release/v2.4.1-code23

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.event.head_commit.message == 'chore: run code23 fix applicator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: release/v2.4.1-code23
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: node apply-code23-fixes.mjs
      - run: npm run android:sync
      - run: npm test
      - run: git diff --check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply code23 release fixes"
          git push origin HEAD:release/v2.4.1-code23
