name: Apply Phase1 Clean Source Patch

on:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - '.ci/phase1-cleanup/ready'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/code22-clean-source-work2
          fetch-depth: 0

      - name: Recover and verify staged patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/phase1-recovery.txt
          import base64
          import hashlib
          import itertools
          from pathlib import Path

          root = Path('.ci/phase1-cleanup')
          target = '74962f5ff60321e618469cb1492d23fbe3547cc40119d6b78cc697432948d9ac'

          raw0 = ''.join((root / 'part00').read_text(encoding='ascii').split())
          invalid = next((i for i, ch in enumerate(raw0) if ch not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='), None)
          if invalid is None:
              raise SystemExit('part00 unexpectedly has no invalid marker')
          prefix_text = raw0[:invalid]
          prefix_text = prefix_text[:len(prefix_text) - (len(prefix_text) % 4)]
          prefix = base64.b64decode(prefix_text, validate=True)
          if not prefix.startswith(bytes.fromhex('1f8b')):
              raise SystemExit('recovered part00 prefix is not gzip data')

          chunks = {'p0': prefix}
          for name in ('part00a', 'part00b', 'part01'):
              text = ''.join((root / name).read_text(encoding='ascii').split())
              chunks[name] = base64.b64decode(text, validate=True)

          print('part00 invalid index:', invalid)
          print('part00 marker tail:', repr(raw0[invalid:]))
          for name, data in chunks.items():
              print(name, 'bytes=', len(data), 'sha256=', hashlib.sha256(data).hexdigest())

          def overlaps(left, right):
              max_n = min(len(left), len(right))
              vals = [0]
              for n in range(1, max_n + 1):
                  if left[-n:] == right[:n]:
                      vals.append(n)
              return vals

          names = list(chunks)
          print('pairwise maximum overlaps:')
          for a in names:
              for b in names:
                  if a == b:
                      continue
                  vals = overlaps(chunks[a], chunks[b])
                  if vals[-1]:
                      print(f'  {a} -> {b}: {vals[-1]} bytes')

          def assemble(seq):
              states = [(chunks[seq[0]], [])]
              for nxt in seq[1:]:
                  new_states = []
                  for current, used in states:
                      for n in overlaps(current, chunks[nxt]):
                          new_states.append((current + chunks[nxt][n:], used + [n]))
                  states = new_states
              return states

          candidate_sequences = []
          middle = ['part00a', 'part00b']
          for r in range(0, len(middle) + 1):
              for mid in itertools.permutations(middle, r):
                  candidate_sequences.append(('p0',) + mid + ('part01',))
          # Also test the natural sequence without forcing part01 last, for diagnosis.
          for perm in itertools.permutations(['part00a', 'part00b', 'part01']):
              seq = ('p0',) + perm
              if seq not in candidate_sequences:
                  candidate_sequences.append(seq)

          tested = 0
          for seq in candidate_sequences:
              for payload, used_overlaps in assemble(seq):
                  tested += 1
                  digest = hashlib.sha256(payload).hexdigest()
                  if digest == target:
                      Path('/tmp/phase1.tar.gz').write_bytes(payload)
                      print('RECOVERED expected archive')
                      print('sequence:', ' -> '.join(seq))
                      print('boundary overlaps:', used_overlaps)
                      print('bytes:', len(payload))
                      print('sha256:', digest)
                      raise SystemExit(0)

          # Text-stream candidate: valid p0 base64 prefix followed by staged text chunks.
          texts = {
              'part00a': ''.join((root / 'part00a').read_text(encoding='ascii').split()),
              'part00b': ''.join((root / 'part00b').read_text(encoding='ascii').split()),
              'part01': ''.join((root / 'part01').read_text(encoding='ascii').split()),
          }
          for perm in itertools.permutations(['part00a', 'part00b', 'part01']):
              text = prefix_text + ''.join(texts[x] for x in perm)
              try:
                  payload = base64.b64decode(text, validate=True)
              except Exception:
                  continue
              tested += 1
              if hashlib.sha256(payload).hexdigest() == target:
                  Path('/tmp/phase1.tar.gz').write_bytes(payload)
                  print('RECOVERED expected archive as joined base64 stream')
                  print('sequence: p0text ->', ' -> '.join(perm))
                  raise SystemExit(0)

          raise SystemExit(f'Expected archive could not be recovered after {tested} hash-gated candidates')
          PY
          echo "74962f5ff60321e618469cb1492d23fbe3547cc40119d6b78cc697432948d9ac  /tmp/phase1.tar.gz" | sha256sum -c -
          tar -tzf /tmp/phase1.tar.gz >/tmp/phase1-files.txt
          echo "Patch archive entries: $(wc -l </tmp/phase1-files.txt)"
          tar -xzf /tmp/phase1.tar.gz -C .

      - name: Persist recovery diagnostic on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/phase1-recovery.txt .ci/phase1-cleanup/recovery-final.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/phase1-cleanup/recovery-final.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: capture final phase1 staging recovery diagnostic"
            git push origin HEAD:refactor/code22-clean-source-work2
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install JS dependencies
        run: npm ci

      - name: Run complete test suite
        run: npm test

      - name: Synchronize and verify Android assets
        shell: bash
        run: |
          npm run android:sync
          diff -qr public android/app/src/main/assets/www

      - name: Re-run complete tests after asset sync
        run: npm test

      - name: Compile Android Java
        run: gradle -p android --no-daemon compileDebugJavaWithJavac

      - name: Assemble debug application
        run: gradle -p android --no-daemon assembleDebug

      - name: Commit verified clean source and remove staging machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf .ci/phase1-cleanup
          git rm .github/workflows/apply-phase1-cleanup.yml
          git add -A
          git commit -m "refactor: harden clean Code22 source"
          git push origin HEAD:refactor/code22-clean-source-work2
