name: Diagnose Code21 Runtime Paths

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v2.3.9-code21

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Code21 source
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/code18-delta/part* > /tmp/code18.b64
          base64 -d /tmp/code18.b64 > /tmp/code18.tar.gz
          tar -xzf /tmp/code18.tar.gz -C .
          cat .ci/code19-delta/part* > /tmp/code19.b64
          base64 -d /tmp/code19.b64 > /tmp/code19.tar.gz
          tar -xzf /tmp/code19.tar.gz -C .
          python .ci/code20-transform.py
          python .ci/code21-transform.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test live Ahlatci parsing
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -A 'Mozilla/5.0' 'https://www.ahlatciyatirim.com.tr/halka-arz?sayfa=1' -o /tmp/calendar.html
          curl -fsSL --retry 2 -A 'Mozilla/5.0' 'https://www.ahlatciyatirim.com.tr/halka-arz/net-global-endustriyel-yatirimlar' -o /tmp/netgl.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseAhlatciCalendar, parseAhlatciDetail } from './public/core/parsers.js';
          const calendar = parseAhlatciCalendar(fs.readFileSync('/tmp/calendar.html','utf8'));
          const item = calendar.find(x => x.ticker === 'NETGL') || {ticker:'NETGL'};
          console.log('CALENDAR_NETGL=' + JSON.stringify(item));
          const detail = parseAhlatciDetail(fs.readFileSync('/tmp/netgl.html','utf8'), item);
          console.log('DETAIL_NETGL=' + JSON.stringify({ticker:detail.ticker,company:detail.company,consortiumLeaders:detail.consortiumLeaders,offerDates:detail.offerDates,ipoPrice:detail.ipoPrice}));
          NODE
      - name: Inspect notification and back paths
        shell: bash
        run: |
          set -euo pipefail
          echo '--- PUSH BACKEND BUILD FIELD ---'
          grep -n 'PUSH_BACKEND_URL' android/app/build.gradle
          echo '--- BACK HANDLING ---'
          grep -n -A16 -B2 'void onBackPressed' android/app/src/main/java/com/innative/halkaarz/MainActivity.java
          echo '--- IPO BACKGROUND LOGIC ---'
          grep -RniE 'ipo|halka-arz' android/app/src/main/java/com/innative/halkaarz/BackgroundAlert*.java || true
          echo '--- SCHEDULER ENABLE RULE ---'
          cat android/app/src/main/java/com/innative/halkaarz/BackgroundAlertScheduler.java
