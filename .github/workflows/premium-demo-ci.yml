name: Premium Demo CI

on:
  push:
    branches: [feature/premium-demo-20260915]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium-test:
    strategy:
      fail-fast: false
      matrix:
        file:
          - premium-alerts.test.js
          - premium-analytics.test.js
          - premium-asset-parity.test.js
          - premium-backup.test.js
          - premium-charts.test.js
          - premium-demo-ui-contract.test.js
          - premium-entitlement.test.js
          - premium-fullscreen-shell.test.js
          - premium-logo-resolver.test.js
          - premium-overlay-ui.test.js
          - premium-watchlist.test.js
    name: ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply isolated Premium fullscreen transform
        run: node scripts/apply-premium-fullscreen-demo.mjs
      - name: Sync transformed Premium assets to Android WebView
        run: npm run android:sync
      - name: Run isolated Premium test
        run: node --test "test/${{ matrix.file }}"
