name: Apply Premium Overlay V2 Once

on:
  push:
    branches: [feature/premium-demo-20260915]
    paths: [.github/workflows/apply-premium-overlay-v2-once.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Apply isolated Premium overlay patch
        run: python3 scripts/apply-premium-overlay-v2.py
      - name: Verify focused Premium overlay test
        run: node --test test/premium-overlay-ui.test.js
      - name: Verify full regression suite
        run: npm test
      - name: Mirror web assets into Android bundle
        run: |
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --check
      - name: Commit Premium-only UI changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'Premium Demo Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/app.js public/index.html public/premium-demo.css android/app/src/main/assets/www/app.js android/app/src/main/assets/www/index.html android/app/src/main/assets/www/premium-demo.css
          test -z "$(git diff --name-only --cached | grep -Ev '^(public/(app.js|index.html|premium-demo.css)|android/app/src/main/assets/www/(app.js|index.html|premium-demo.css))$' || true)"
          git commit -m 'feat: move premium into spacious full-screen overlay'
          git push origin HEAD:feature/premium-demo-20260915
