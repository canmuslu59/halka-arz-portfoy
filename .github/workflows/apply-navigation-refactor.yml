name: Cleanup Obsolete Phase1 Staging

on:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - '.github/workflows/apply-navigation-refactor.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify cleanup targets are not referenced by retained workflows
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            apply-ipo-outage-cache.py \
            apply-lifecycle.py \
            apply-refresh-coordinator.py \
            apply-server-http-hardening.py \
            apply-server-persistence.py \
            apply-worker-retry.py; do
            refs="$(grep -RIl --exclude='apply-navigation-refactor.yml' --exclude='apply-phase1-cleanup.yml' "$name" .github/workflows || true)"
            if [ -n "$refs" ]; then
              echo "Retained workflow still references $name:"
              echo "$refs"
              exit 1
            fi
          done
          refs="$(grep -RIl --exclude='apply-phase1-cleanup.yml' 'phase1-cleanup' .github/workflows || true)"
          if [ -n "$refs" ]; then
            echo "Retained workflow still references .ci/phase1-cleanup:"
            echo "$refs"
            exit 1
          fi
      - name: Remove obsolete staging and one-shot applicators
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf \
            .ci/phase1-cleanup \
            .ci/apply-ipo-outage-cache.py \
            .ci/apply-lifecycle.py \
            .ci/apply-refresh-coordinator.py \
            .ci/apply-server-http-hardening.py \
            .ci/apply-server-persistence.py \
            .ci/apply-worker-retry.py \
            .github/workflows/apply-phase1-cleanup.yml \
            .github/workflows/apply-navigation-refactor.yml
      - run: npm ci
      - name: Full regression suite
        run: npm test
      - name: Verify Android assets remain exact
        shell: bash
        run: |
          set -euo pipefail
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --exit-code -- android/app/src/main/assets/www
      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: remove obsolete Phase1 staging machinery"
          git push
