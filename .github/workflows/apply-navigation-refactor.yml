name: Apply IPO Outage Cache Fix

on:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - '.github/workflows/apply-navigation-refactor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch IPO outage cache handling with exact guards
        run: python .ci/apply-ipo-outage-cache.py
      - run: npm ci
      - name: Server syntax check
        run: node --check server.js
      - name: IPO outage cache contract
        run: node --test test/server-ipo-cache.test.js
      - name: Server HTTP security regression
        run: node --test test/server-security.test.js
      - name: Server persistence regression
        run: node --test test/server-persistence.test.js
      - name: Full regression suite
        run: npm test
      - name: Commit verified IPO outage cache fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --check
          git commit -m "fix: avoid caching transient IPO source outages"
          git push
