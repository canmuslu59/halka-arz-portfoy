name: Apply Background Worker Retry Hardening

on:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - '.github/workflows/apply-navigation-refactor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch worker retry and IPO-only scheduling with exact guards
        run: python .ci/apply-worker-retry.py
      - run: npm ci
      - name: Worker retry source contract
        run: node --test test/android-worker-retry-policy.test.js
      - name: Worker retry behavioral policy
        run: |
          rm -rf /tmp/background-retry-policy-test
          mkdir -p /tmp/background-retry-policy-test
          javac -d /tmp/background-retry-policy-test android/app/src/main/java/com/innative/halkaarz/BackgroundRetryPolicy.java .ci/BackgroundRetryPolicyHarness.java
          java -cp /tmp/background-retry-policy-test com.innative.halkaarz.BackgroundRetryPolicyHarness
      - name: Push config no-op regression
        run: node --test test/android-push-config-noop.test.js
      - name: Native notification regression
        run: node --test test/android-notification-hardening.test.js
      - name: Full regression suite
        run: npm test
      - name: Commit verified worker hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/innative/halkaarz/BackgroundAlertWorker.java android/app/src/main/java/com/innative/halkaarz/PushConfigSync.java android/app/src/main/java/com/innative/halkaarz/BackgroundAlertScheduler.java
          git diff --cached --check
          git commit -m "fix: classify background retries and preserve IPO-only alerts"
          git push
