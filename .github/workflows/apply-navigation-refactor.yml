name: Apply Server Persistence Hardening

on:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - '.github/workflows/apply-navigation-refactor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch server persistence with exact guards
        run: python .ci/apply-server-persistence.py
      - run: npm ci
      - name: Server syntax check
        run: node --check server.js
      - name: Durable persistence contract
        run: node --test test/server-persistence.test.js
      - name: Existing server security regressions
        run: node --test test/server-security.test.js
      - name: Full regression suite
        run: npm test
      - name: Commit verified server persistence integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --check
          git commit -m "fix: serialize and durably persist portfolio mutations"
          git push
