name: Apply Refresh Coordination

on:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - '.github/workflows/apply-navigation-refactor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch refresh coordination with exact guards
        run: python .ci/apply-refresh-coordinator.py
      - run: npm ci
      - name: Refresh coordination contract
        run: node --test test/refresh-coordinator.test.js
      - name: Portfolio service regression
        run: node --test test/portfolio-service.test.js
      - name: Synchronize Android assets
        run: |
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
      - name: Full regression suite
        run: npm test
      - name: Commit verified refresh coordination
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/core/refresh-coordinator.js public/app.js android/app/src/main/assets/www
          git diff --cached --check
          git commit -m "fix: preserve forced refresh intent and coalesce refreshes"
          git push
