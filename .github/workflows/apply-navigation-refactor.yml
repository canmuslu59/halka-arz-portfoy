name: Apply Android Lifecycle Hardening

on:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - '.github/workflows/apply-navigation-refactor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch MainActivity lifecycle with exact guards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/java/com/innative/halkaarz/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''    private static final ExecutorService NETWORK_EXECUTOR = new ThreadPoolExecutor(
            4,
            4,
            0L,
            TimeUnit.MILLISECONDS,
            new ArrayBlockingQueue<>(128),
            new ThreadPoolExecutor.AbortPolicy()
    );''',
                  '''    private final ExecutorService networkExecutor = new ThreadPoolExecutor(
            4,
            4,
            0L,
            TimeUnit.MILLISECONDS,
            new ArrayBlockingQueue<>(128),
            new ThreadPoolExecutor.AbortPolicy()
    );
    private final Runnable startupPermissionRequest = this::requestStartupNotificationPermission;''',
              ),
              (
                  '        webView.postDelayed(this::requestStartupNotificationPermission, 700L);',
                  '        webView.postDelayed(startupPermissionRequest, 700L);',
              ),
              (
                  '                NETWORK_EXECUTOR.execute(() -> {',
                  '                networkExecutor.execute(() -> {',
              ),
              (
                  '''    @Override
    protected void onNewIntent(Intent intent) {''',
                  '''    @Override
    protected void onDestroy() {
        WebView currentWebView = webView;
        webView = null;
        networkExecutor.shutdownNow();
        if (currentWebView != null) {
            currentWebView.removeCallbacks(startupPermissionRequest);
            currentWebView.removeJavascriptInterface("AndroidBridge");
            currentWebView.stopLoading();
            currentWebView.destroy();
        }
        super.onDestroy();
    }

    @Override
    protected void onNewIntent(Intent intent) {''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guard failed: expected exactly one source match, got {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - name: Android lifecycle contract
        run: node --test test/android-lifecycle-hardening.test.js
      - name: Android bridge contract
        run: node --test test/android-contract.test.js
      - name: Navigation contract
        run: node --test test/navigation-contract.test.js
      - name: Full regression suite
        run: npm test
      - name: Commit verified lifecycle hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/innative/halkaarz/MainActivity.java
          git diff --cached --check
          git commit -m "fix: bind native network work to Activity lifecycle"
          git push
