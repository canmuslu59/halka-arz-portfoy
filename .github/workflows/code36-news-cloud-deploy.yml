name: Code36 News Cloud Deploy

on:
  push:
    branches:
      - fix/code36-news-digests-20260924
    paths:
      - cloudflare/deploy-code36-approved.txt

permissions:
  contents: read

concurrency:
  group: code36-news-cloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Require explicit approval marker and unchanged market transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat cloudflare/deploy-code36-approved.txt)" = 'APPROVE_CODE36_NEWS_DEPLOY'
          test "$(git hash-object cloudflare/worker.js)" = 'a2bda1e178d7804626f98ce4e84667293113632d'
          test "$(git hash-object cloudflare/durable-store.js)" = '308e9f23c32858ef992c34a0fa715e3323243f91'
          test "$(git hash-object cloudflare/fcm-sender.js)" = 'b2ee9cdac98fdf0787257d8cab92ba48381d5ea6'
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo 'News deploy approval and unchanged market transport verified'
      - name: Run regression tests
        run: |
          npm ci
          npm test
      - name: Deploy existing production worker with updated news rules
        run: npx -y wrangler@4.131.1 deploy --config wrangler.jsonc
      - name: Verify production health
        run: |
          curl --fail --silent --show-error https://halka-arz-portfoy-push.grass-airboat.workers.dev/api/health -o health.json
          node -e "if(!require('./health.json').ok) process.exit(1)"
