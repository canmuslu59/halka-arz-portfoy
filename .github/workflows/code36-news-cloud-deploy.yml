name: Code36 News Cloud Deploy

on:
  push:
    branches:
      - fix/code36-news-digests-20260924
    paths:
      - cloudflare/deploy-code36-approved.txt

permissions:
  contents: read

concurrency:
  group: code36-news-cloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Require explicit approval marker and unchanged market transport
        shell: powershell
        env:
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $approval = (Get-Content cloudflare/deploy-code36-approved.txt -TotalCount 1).Trim()
          if ($approval -cne 'APPROVE_CODE36_NEWS_DEPLOY') { throw 'News deployment approval marker missing' }
          $market = @{
            'cloudflare/worker.js' = 'a2bda1e178d7804626f98ce4e84667293113632d'
            'cloudflare/durable-store.js' = '308e9f23c32858ef992c34a0fa715e3323243f91'
            'cloudflare/fcm-sender.js' = 'b2ee9cdac98fdf0787257d8cab92ba48381d5ea6'
          }
          $headers = @{ Authorization = "Bearer $env:GH_READ_TOKEN"; Accept = 'application/vnd.github+json' }
          foreach ($path in $market.Keys) {
            $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/${path}?ref=$env:GITHUB_SHA"
            $actual = (Invoke-RestMethod -Uri $url -Headers $headers).sha
            if ($actual -cne $market[$path]) { throw "Market transport changed: $path" }
          }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) { throw 'Cloudflare API token secret unavailable' }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) { throw 'Cloudflare account ID secret unavailable' }
          Write-Host 'Approval, market transport and deployment credentials verified'
      - name: Run regression tests
        shell: powershell
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 test/*.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Deploy existing production worker with updated news rules
        shell: powershell
        run: |
          npx -y wrangler@4.131.1 deploy --config wrangler.jsonc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify production health
        shell: powershell
        run: |
          $health = Invoke-RestMethod -Uri 'https://halka-arz-portfoy-push.grass-airboat.workers.dev/api/health' -TimeoutSec 30
          if ($health.ok -ne $true) { throw 'Production health endpoint did not confirm ok' }
          Write-Host 'Production news worker is healthy'
