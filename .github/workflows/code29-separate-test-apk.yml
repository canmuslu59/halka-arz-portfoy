name: Code29 Separate Test APK

on:
  push:
    branches: [test/code29-separate-apk-20260915, feature/test-hero-card-image-share-20260916, feature/test-wallet-comparison-home-20260916, feature/test-wallet-metrics-center-nav-20260916, feature/test-portfolio-app-navigation-20260916]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PUSH_BACKEND_URL: https://halka-arz-portfoy-push.grass-airboat.workers.dev
      AOSP_BUILD_COMMIT: 897e2ff8232b9f7a96493855e57f7a01f999109e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: Verify focused regressions
        run: node --test test/stock-add-flow-regression.test.js test/background-closed-alert-regression.test.js test/verified-market-reference.test.js test/portfolio-app-navigation-overlay.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Sync Android assets
        shell: bash
        run: |
          set -euo pipefail
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --exit-code -- android/app/src/main/assets/www
          git diff --check

      - name: Apply isolated portfolio app overlays
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-test-share-ui.mjs
          node scripts/apply-test-wallet-metrics-nav.mjs
          node scripts/apply-test-portfolio-app-navigation.mjs
          node --check android/app/src/main/assets/www/app.js
          test -s android/app/src/main/assets/www/launcher-icon.webp
          cmp android/app/src/main/res/drawable-nodpi/ic_launcher.webp android/app/src/main/assets/www/launcher-icon.webp
          grep -F 'src="./launcher-icon.webp"' android/app/src/main/assets/www/index.html
          grep -F 'id="portfolioHeroCard"' android/app/src/main/assets/www/index.html
          grep -F '>Cüzdan</span>' android/app/src/main/assets/www/index.html
          grep -F 'wallet-metric-today' android/app/src/main/assets/www/index.html
          grep -F 'Günlük Değişim' android/app/src/main/assets/www/index.html
          grep -F 'wallet-metric-invested' android/app/src/main/assets/www/index.html
          grep -F 'wallet-metric-hidden' android/app/src/main/assets/www/index.html
          grep -F 'id="walletHomeTab"' android/app/src/main/assets/www/index.html
          grep -F 'wallet-center-icon' android/app/src/main/assets/www/index.html
          grep -F 'id="performanceView"' android/app/src/main/assets/www/index.html
          grep -F 'data-view="performance"' android/app/src/main/assets/www/index.html
          grep -F '>Performans</b>' android/app/src/main/assets/www/index.html
          grep -F 'id="marketsView"' android/app/src/main/assets/www/index.html
          grep -F 'data-view="markets"' android/app/src/main/assets/www/index.html
          grep -F '>Piyasalar</b>' android/app/src/main/assets/www/index.html
          ! grep -F 'id="calendarView"' android/app/src/main/assets/www/index.html
          grep -F 'id="calendarRefreshBtn"' android/app/src/main/assets/www/index.html
          grep -F 'id="calendarStatus"' android/app/src/main/assets/www/index.html
          grep -F 'id="calendarFilter"' android/app/src/main/assets/www/index.html
          grep -F 'id="calendarList"' android/app/src/main/assets/www/index.html
          grep -F 'id="marketSummary"' android/app/src/main/assets/www/index.html
          grep -F 'id="marketSummaryBist"' android/app/src/main/assets/www/index.html
          grep -F 'id="marketSummaryGold"' android/app/src/main/assets/www/index.html
          grep -F 'id="marketSummaryUsd"' android/app/src/main/assets/www/index.html
          grep -F 'id="comparisonCard"' android/app/src/main/assets/www/index.html
          grep -F 'id="comparisonRangeDaily"' android/app/src/main/assets/www/index.html
          grep -F 'id="comparisonRangeWeekly"' android/app/src/main/assets/www/index.html
          grep -F 'id="comparisonRangeMonthly"' android/app/src/main/assets/www/index.html
          grep -F 'Altın (TL)' android/app/src/main/assets/www/index.html
          grep -F 'BIST 100' android/app/src/main/assets/www/index.html
          grep -F '>Dolar</span>' android/app/src/main/assets/www/index.html
          ! grep -F 'id="comparisonSummary"' android/app/src/main/assets/www/index.html
          ! grep -F 'id="comparisonStatus"' android/app/src/main/assets/www/index.html
          grep -F 'id="sharePortfolioBtn"' android/app/src/main/assets/www/index.html
          ! grep -F 'Toplam portföy büyüklüğü' android/app/src/main/assets/www/index.html
          ! grep -F 'id="lastUpdated"' android/app/src/main/assets/www/index.html
          grep -F 'wallet-home-card' android/app/src/main/assets/www/styles.css
          grep -F 'wallet-metrics-grid' android/app/src/main/assets/www/styles.css
          grep -F 'wallet-center-tab' android/app/src/main/assets/www/styles.css
          grep -F 'portfolio-comparison-card' android/app/src/main/assets/www/styles.css
          grep -F 'market-summary' android/app/src/main/assets/www/styles.css
          ! grep -F '100dvh' android/app/src/main/assets/www/styles.css
          grep -F 'const comparisonRangeSessions = { daily: 1, weekly: 5, monthly: 22 };' android/app/src/main/assets/www/app.js
          grep -F "fetchComparisonSeries('GC=F')" android/app/src/main/assets/www/app.js
          grep -F "fetchComparisonSeries('XU100.IS')" android/app/src/main/assets/www/app.js
          grep -F "fetchComparisonSeries('TRY=X')" android/app/src/main/assets/www/app.js
          grep -F "if (next === 'performance') requestAnimationFrame(drawChart);" android/app/src/main/assets/www/app.js
          grep -F "if (next === 'markets') { loadIpoCalendar(); loadHomeComparison(); }" android/app/src/main/assets/www/app.js
          grep -F 'window.AndroidBridge.shareCardImage' android/app/src/main/assets/www/app.js
          ! grep -F 'shareText(' android/app/src/main/assets/www/app.js
          grep -F 'Bitmap.createBitmap' android/app/src/main/java/com/innative/halkaarz/MainActivity.java
          grep -F 'FileProvider' android/app/src/main/java/com/innative/halkaarz/MainActivity.java
          grep -F 'portfolio-card.png' android/app/src/main/java/com/innative/halkaarz/MainActivity.java
          grep -F 'Intent.ACTION_SEND' android/app/src/main/java/com/innative/halkaarz/MainActivity.java
          grep -F 'androidx.core.content.FileProvider' android/app/src/main/AndroidManifest.xml
          grep -F '<cache-path' android/app/src/main/res/xml/share_file_paths.xml

      - name: Configure isolated test release identity
        shell: bash
        run: |
          set -euo pipefail
          TEST_VERSION_CODE=$((29000 + GITHUB_RUN_NUMBER))
          echo "TEST_VERSION_CODE=$TEST_VERSION_CODE" >> "$GITHUB_ENV"
          python3 - "$TEST_VERSION_CODE" <<'PY'
          from pathlib import Path
          import re
          import sys

          version_code = sys.argv[1]
          path = Path('android/app/build.gradle')
          text = path.read_text()
          text, n = re.subn(r'versionCode\s+\d+', f'versionCode {version_code}', text, count=1)
          if n != 1:
              raise SystemExit('versionCode replacement failed')
          needle = """        release {\n            minifyEnabled false\n"""
          replacement = """        release {\n            applicationIdSuffix '.test'\n            versionNameSuffix '-test'\n            resValue 'string', 'app_name', 'Halka Arz Portföyüm Test'\n            minifyEnabled false\n"""
          if needle not in text:
              raise SystemExit('release block shape changed')
          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
          grep -F "applicationIdSuffix '.test'" android/app/build.gradle
          grep -F "versionNameSuffix '-test'" android/app/build.gradle
          grep -F "versionCode $TEST_VERSION_CODE" android/app/build.gradle

      - name: Install Android SDK 36 on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Compile and build isolated release APK
        run: |
          gradle -p android --no-daemon compileReleaseJavaWithJavac
          gradle -p android --no-daemon assembleRelease

      - name: Sign with pinned AOSP public test key
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/aosp-mirror/platform_build/${AOSP_BUILD_COMMIT}/target/product/security"
          curl -fsSL "$BASE/testkey.pk8" -o /tmp/aosp-testkey.pk8
          curl -fsSL "$BASE/testkey.x509.pem" -o /tmp/aosp-testkey.x509.pem
          test -s /tmp/aosp-testkey.pk8
          test -s /tmp/aosp-testkey.x509.pem

          BUILD_TOOLS=/usr/local/lib/android/sdk/build-tools/36.0.0
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=/tmp/halka-test-aligned.apk
          SIGNED=/tmp/halka-test-signed.apk
          test -s "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --key /tmp/aosp-testkey.pk8 \
            --cert /tmp/aosp-testkey.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$ALIGNED"

          mkdir -p dist
          cp "$SIGNED" dist/halka-arz-portfoyum-test.apk

      - name: Verify APK identity, signature and backend
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/halka-arz-portfoyum-test.apk
          BUILD_TOOLS=/usr/local/lib/android/sdk/build-tools/36.0.0
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/apk-signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee dist/apk-badging.txt
          grep -F "package: name='com.innative.halkaarz.test' versionCode='${TEST_VERSION_CODE}' versionName='2.4.6-test'" dist/apk-badging.txt
          grep -F "application-label:'Halka Arz Portföyüm Test'" dist/apk-badging.txt
          grep -F 'Signer #1 certificate SHA-256 digest: a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc' dist/apk-signature.txt
          found_backend=0
          while IFS= read -r dex; do
            if unzip -p "$APK" "$dex" | strings | grep -Fq "$PUSH_BACKEND_URL"; then
              found_backend=1
              break
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')
          test "$found_backend" -eq 1
          unzip -p "$APK" assets/www/index.html | grep -F 'id="portfolioHeroCard"'
          unzip -p "$APK" assets/www/index.html | grep -F '>Cüzdan</span>'
          unzip -p "$APK" assets/www/index.html | grep -F 'wallet-metric-today'
          unzip -p "$APK" assets/www/index.html | grep -F 'Günlük Değişim'
          unzip -p "$APK" assets/www/index.html | grep -F 'wallet-metric-invested'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="walletHomeTab"'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="performanceView"'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="marketsView"'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="marketSummary"'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="calendarList"'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="comparisonCard"'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="comparisonRangeDaily"'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="comparisonRangeWeekly"'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="comparisonRangeMonthly"'
          ! unzip -p "$APK" assets/www/index.html | grep -F 'id="comparisonSummary"'
          ! unzip -p "$APK" assets/www/index.html | grep -F 'id="comparisonStatus"'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="sharePortfolioBtn"'
          unzip -p "$APK" assets/www/index.html | grep -F 'src="./launcher-icon.webp"'
          ! unzip -p "$APK" assets/www/index.html | grep -F 'Toplam portföy büyüklüğü'
          ! unzip -p "$APK" assets/www/index.html | grep -F 'id="lastUpdated"'
          unzip -p "$APK" assets/www/styles.css | grep -F 'wallet-home-card'
          unzip -p "$APK" assets/www/styles.css | grep -F 'wallet-metrics-grid'
          unzip -p "$APK" assets/www/styles.css | grep -F 'wallet-center-tab'
          unzip -p "$APK" assets/www/styles.css | grep -F 'portfolio-comparison-card'
          unzip -p "$APK" assets/www/styles.css | grep -F 'market-summary'
          ! unzip -p "$APK" assets/www/styles.css | grep -F '100dvh'
          unzip -p "$APK" assets/www/app.js | grep -F 'const comparisonRangeSessions = { daily: 1, weekly: 5, monthly: 22 };'
          unzip -p "$APK" assets/www/app.js | grep -F "fetchComparisonSeries('GC=F')"
          unzip -p "$APK" assets/www/app.js | grep -F "fetchComparisonSeries('XU100.IS')"
          unzip -p "$APK" assets/www/app.js | grep -F "fetchComparisonSeries('TRY=X')"
          unzip -p "$APK" assets/www/app.js | grep -F 'window.AndroidBridge.shareCardImage'
          sha256sum "$APK" | tee dist/SHA256SUMS.txt
          {
            echo "package=com.innative.halkaarz.test"
            echo "versionName=2.4.6-test"
            echo "versionCode=${TEST_VERSION_CODE}"
            echo "sourceCommit=${GITHUB_SHA}"
            echo "backend=${PUSH_BACKEND_URL}"
            echo "signing=AOSP public testkey pinned at ${AOSP_BUILD_COMMIT}"
            echo "firebase=not configured for separate test package"
            echo "portfolioNavigationOverlay=enabled"
          } > dist/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: code29-separate-test-apk
          path: |
            dist/halka-arz-portfoyum-test.apk
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
            dist/apk-signature.txt
            dist/apk-badging.txt
          if-no-files-found: error
          retention-days: 14
