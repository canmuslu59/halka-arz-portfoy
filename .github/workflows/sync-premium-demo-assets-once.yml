name: Sync Premium Demo Assets Once

on:
  push:
    branches: [feature/premium-demo-20260915]
    paths: [.github/workflows/sync-premium-demo-assets-once.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync public assets into Android bundle
        run: npm run android:sync
      - name: Verify sync is confined to Android web assets
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          outside="$(git status --porcelain | awk '{print $2}' | grep -v '^android/app/src/main/assets/www/' || true)"
          test -z "$outside"
      - name: Verify parity after sync
        run: node --test test/premium-asset-parity.test.js
      - name: Commit mirrored assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Premium Demo Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add android/app/src/main/assets/www
          git commit -m 'chore: mirror premium demo Android assets'
          git push origin HEAD:feature/premium-demo-20260915
