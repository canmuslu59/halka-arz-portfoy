name: Apply Native Notification Hardening

on:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - 'scripts/apply-phase1-native-hardening.mjs'
      - '.github/workflows/apply-native-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/code22-clean-source-work2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: npm ci
      - name: Apply deterministic source edits
        run: node scripts/apply-phase1-native-hardening.mjs
      - name: Focused contracts
        run: |
          node --test test/android-build-hardening.test.js
          node --test test/backend-service.test.js
          node --test test/android-notification-hardening.test.js
          node --test test/code22-regression.test.js
      - name: Compile Android Java
        run: gradle -p android --no-daemon compileDebugJavaWithJavac
      - name: Commit verified source and remove temporary applicator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/innative/halkaarz/NotificationHelper.java android/app/src/main/java/com/innative/halkaarz/BackgroundAlertWorker.java
          git rm scripts/apply-phase1-native-hardening.mjs .github/workflows/apply-native-hardening.yml
          git commit -m 'fix: harden native notification delivery dedupe'
          git push origin HEAD:refactor/code22-clean-source-work2
