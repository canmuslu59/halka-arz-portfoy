name: Flatten Code22 Clean Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/code22-clean-source-work2
          fetch-depth: 0

      - name: Reconstruct exact latest production source once
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/code18-delta/part* > /tmp/code18.b64
          base64 -d /tmp/code18.b64 > /tmp/code18.tar.gz
          echo "fc7d28e1880c7872f3883d12b1352f7800d2f2c88963e26c66a7e862e73e5a42  /tmp/code18.tar.gz" | sha256sum -c -
          tar -xzf /tmp/code18.tar.gz -C .

          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 -d .ci/code17-launcher.webp.b64 > android/app/src/main/res/drawable-nodpi/ic_launcher.webp
          echo "517298c9cecd73ee52262f826c13c96f877bfd5322b9b3ef7c98779ea733aa48  android/app/src/main/res/drawable-nodpi/ic_launcher.webp" | sha256sum -c -
          rm -f android/app/src/main/res/drawable/ic_launcher.xml

          cat .ci/code19-delta/part* > /tmp/code19.b64
          base64 -d /tmp/code19.b64 > /tmp/code19.tar.gz
          echo "56ac37a08fdb112a4a39689f5e10e3e7468dc4bf8d4999b3e52f39dcfb38cf27  /tmp/code19.tar.gz" | sha256sum -c -
          tar -xzf /tmp/code19.tar.gz -C .

          python .ci/code20-transform.py
          python .ci/code21-transform.py
          python .ci/code22-transform.py
          python .ci/code22-postfix.py
          cp .ci/code22-regression.test.js test/code22-regression.test.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Synchronize Android web assets before baseline
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run android:sync
          diff -qr public android/app/src/main/assets/www

      - name: Baseline tests on synchronized reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          node --test test/*.test.js | tee /tmp/baseline-tests.txt

      - name: Commit flattened source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public android/app/src/main android/app/build.gradle test
          if git diff --cached --quiet; then
            echo "Flattened source already committed."
            exit 0
          fi
          git commit -m "refactor: flatten Code22 production source"
          git push origin HEAD:refactor/code22-clean-source-work2
