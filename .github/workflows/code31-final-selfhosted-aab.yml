name: Code31 Final Production AAB

on:
  push:
    branches:
      - release/v2.4.8-code31-final
    paths:
      - .github/workflows/code31-final-selfhosted-aab.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PUSH_BACKEND_URL: https://halka-arz-portfoy-push.grass-airboat.workers.dev

jobs:
  build-code31:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        shell: powershell
        run: npm ci

      - name: Run complete regression suite
        shell: powershell
        run: npm test

      - name: Sync Android base assets
        shell: powershell
        run: |
          npm run android:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply approved test experience onto production identity
        shell: powershell
        run: |
          node scripts/apply-test-share-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-test-wallet-metrics-nav.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-test-portfolio-app-navigation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check android/app/src/main/assets/www/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify preserved live market core and promoted UI
        shell: powershell
        run: |
          $worker = Get-Content -Raw android/app/src/main/java/com/innative/halkaarz/BackgroundAlertWorker.java
          $push = Get-Content -Raw android/app/src/main/java/com/innative/halkaarz/PushConfigSync.java
          $helper = Get-Content -Raw android/app/src/main/java/com/innative/halkaarz/NotificationHelper.java
          $index = Get-Content -Raw android/app/src/main/assets/www/index.html
          $app = Get-Content -Raw android/app/src/main/assets/www/app.js

          foreach ($needle in @(
            'query1.finance.yahoo.com/v8/finance/chart/',
            'https://webservice.foreks.com/foreks-web-widget/singlepage/',
            'https://www.oyakyatirim.com.tr/hisse-detay/',
            'reference.ceilingPrice',
            'reference.floorPrice',
            'PortfolioAlertRules.sampledPercentages'
          )) {
            if (-not $worker.Contains($needle)) { throw "Live market core missing: $needle" }
          }

          if (-not $push.Contains('marketReferenceProtocol')) { throw 'Push protocol marker missing' }
          if (-not $helper.Contains('news_breaking_v1')) { throw 'Breaking news channel missing' }
          if (-not $helper.Contains('news_digest_v1')) { throw 'Digest news channel missing' }

          foreach ($needle in @(
            'id="portfolioHeroCard"',
            '>Haberler</b>',
            'id="popularNewsRail"',
            'id="latestNewsList"',
            'id="walletHomeTab"',
            'id="weeklyMoversCard"',
            'id="sharePortfolioBtn"'
          )) {
            if (-not $index.Contains($needle)) { throw "Promoted UI marker missing: $needle" }
          }

          foreach ($needle in @(
            'purchasePrice',
            'purchaseDate',
            'loadPopularFinanceNews',
            'window.AndroidBridge.shareCardImage'
          )) {
            if (-not $app.Contains($needle)) { throw "Promoted behavior marker missing: $needle" }
          }

      - name: Configure production Firebase client
        shell: powershell
        run: |
          $firebaseJson = '{"project_info":{"project_number":"181104463772","project_id":"halka-arz-portfoyum-d86ff","storage_bucket":"halka-arz-portfoyum-d86ff.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:181104463772:android:0079989b9d3c4ef85fcb9d","android_client_info":{"package_name":"com.innative.halkaarz"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyByYlMz5g9cwzXUjfVFlLIM0A564z-fO88"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}'
          Set-Content -Path android/app/google-services.json -Value $firebaseJson -Encoding UTF8

          $config = Get-Content -Raw android/app/google-services.json
          if (-not $config.Contains('"package_name":"com.innative.halkaarz"')) { throw 'Production Firebase package mismatch' }
          if ($config.Contains('.test')) { throw 'Test Firebase identity leaked into production build' }

      - name: Configure Android SDK 36
        shell: powershell
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk -or -not (Test-Path $sdk)) {
            if (Test-Path 'C:\actions-runner\android-sdk') {
              $sdk = 'C:\actions-runner\android-sdk'
            } elseif ($env:ANDROID_HOME -and (Test-Path $env:ANDROID_HOME)) {
              $sdk = $env:ANDROID_HOME
            } else {
              throw 'Android SDK root not found'
            }
          }
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sdkmanager = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (-not (Test-Path $sdkmanager)) { throw "sdkmanager not found: $sdkmanager" }
          & $sdkmanager "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Compile production release
        shell: powershell
        run: |
          gradle -p android --no-daemon compileReleaseJavaWithJavac
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build production AAB
        shell: powershell
        run: |
          gradle -p android --no-daemon bundleRelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and package unsigned production AAB
        shell: powershell
        run: |
          $aab = 'android/app/build/outputs/bundle/release/app-release.aab'
          if (-not (Test-Path $aab)) { throw 'AAB not produced' }
          if ((Get-Item $aab).Length -lt 100000) { throw 'AAB unexpectedly small' }

          $gradle = Get-Content -Raw android/app/build.gradle
          if (-not $gradle.Contains("applicationId 'com.innative.halkaarz'")) { throw 'Production applicationId missing' }
          if (-not $gradle.Contains('versionCode 31')) { throw 'versionCode 31 missing' }
          if (-not $gradle.Contains("versionName '2.4.8'")) { throw 'versionName 2.4.8 missing' }

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $aab dist/halka-arz-portfoyum-v2.4.8-code31-unsigned.aab
          $hash = (Get-FileHash dist/halka-arz-portfoyum-v2.4.8-code31-unsigned.aab -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  halka-arz-portfoyum-v2.4.8-code31-unsigned.aab" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          @(
            'package=com.innative.halkaarz',
            'versionName=2.4.8',
            'versionCode=31',
            "sourceCommit=$env:GITHUB_SHA",
            "backend=$env:PUSH_BACKEND_URL",
            'firebase=production',
            'testExperiencePromoted=true',
            'liveMarketCorePreserved=true',
            'newsChannelsIncluded=true'
          ) | Set-Content -Encoding utf8 dist/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: code31-production-aab-unsigned
          path: |
            dist/halka-arz-portfoyum-v2.4.8-code31-unsigned.aab
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
