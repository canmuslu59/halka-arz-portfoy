name: Apply Phase1 Contract Asset Sync

on:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - 'scripts/apply-phase1-contract-asset-sync.mjs'
      - '.github/workflows/apply-phase1-contract-asset-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/code22-clean-source-work2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: npm ci
      - name: Apply current Phase1 contracts
        run: node scripts/apply-phase1-contract-asset-sync.mjs
      - name: Synchronize Android web assets
        run: |
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
      - name: Full tests
        run: npm test
      - name: Compile Android Java
        run: gradle -p android --no-daemon compileDebugJavaWithJavac
      - name: Assemble debug
        run: gradle -p android --no-daemon assembleDebug
      - name: Commit verified source and synced assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html test/v236-code18.test.js test/ui-contract.test.js android/app/src/main/assets/www
          git rm scripts/apply-phase1-contract-asset-sync.mjs .github/workflows/apply-phase1-contract-asset-sync.yml
          git commit -m 'fix: align Phase1 identity contracts and Android assets'
          git push origin HEAD:refactor/code22-clean-source-work2
