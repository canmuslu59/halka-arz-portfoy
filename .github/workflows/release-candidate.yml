name: Build v2.4.1 Release Candidate

on:
  push:
    branches:
      - release/v2.4.1-code23
      - audit/code23-bughunt-20260911
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify release identity
        run: node --test test/release-identity.test.js
      - name: Full regression suite
        run: npm test
      - name: Synchronize Android assets
        run: |
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --exit-code -- android/app/src/main/assets/www
          git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Compile release Java with deprecation lint
        run: |
          cat >/tmp/deprecation.init.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile
          allprojects {
            tasks.withType(JavaCompile).configureEach {
              options.compilerArgs += ['-Xlint:deprecation']
            }
          }
          EOF
          gradle -p android --no-daemon --rerun-tasks --init-script /tmp/deprecation.init.gradle compileReleaseJavaWithJavac 2>&1 | tee /tmp/deprecation.log
          if grep -E 'android/app/src/main/java/.*\[deprecation\]' /tmp/deprecation.log; then
            echo 'Release source still contains deprecated Android API usage.' >&2
            exit 1
          fi
      - name: Build unsigned release candidate AAB
        run: gradle -p android --no-daemon bundleRelease
      - name: Verify unsigned AAB
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab halka-arz-portfoyum-v2.4.1-code23-unsigned.aab
          sha256sum halka-arz-portfoyum-v2.4.1-code23-unsigned.aab > v2.4.1-code23-aab-sha256.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: v2.4.1-code23-unsigned-aab
          path: |
            halka-arz-portfoyum-v2.4.1-code23-unsigned.aab
            v2.4.1-code23-aab-sha256.txt
          if-no-files-found: error
          retention-days: 30
