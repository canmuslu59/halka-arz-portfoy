name: Build v2.3.0 from exact code11 source

on:
  push:
    branches:
      - feature/v2.3.0-real-code11
    paths:
      - '.ci/READY'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/reconstructed exact-source
          cat .ci/android.part* > .ci/reconstructed/android.b64
          base64 --decode .ci/reconstructed/android.b64 > .ci/reconstructed/android.tar.xz
          actual="$(sha256sum .ci/reconstructed/android.tar.xz | awk '{print $1}')"
          test "$actual" = "ac522f12db863f536390c82265be62cb9121ecc611c8af66700d4d0686d21ee8"
          tar -xJf .ci/reconstructed/android.tar.xz -C exact-source
          test -f exact-source/android/app/build.gradle
          grep -q "versionCode 12" exact-source/android/app/build.gradle
          grep -q "versionName '2.3.0'" exact-source/android/app/build.gradle
          grep -q "applicationId 'com.innative.halkaarz'" exact-source/android/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile APK and AAB
        working-directory: exact-source
        run: gradle -p android --no-daemon clean assembleDebug assembleRelease bundleRelease

      - name: Collect build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output
          cp exact-source/android/app/build/outputs/apk/debug/app-debug.apk ci-output/halka-arz-portfoyum-v2.3.0-code12-debug.apk
          RELEASE_APK="$(find exact-source/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          RELEASE_AAB="$(find exact-source/android/app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$RELEASE_APK"
          test -n "$RELEASE_AAB"
          cp "$RELEASE_APK" ci-output/halka-arz-portfoyum-v2.3.0-code12-unsigned.apk
          cp "$RELEASE_AAB" ci-output/halka-arz-portfoyum-v2.3.0-code12-unsigned.aab
          sha256sum ci-output/* | tee ci-output/SHA256SUMS.txt

      - name: Upload compiled outputs
        uses: actions/upload-artifact@v4
        with:
          name: v230-code12-compiled
          path: ci-output/
          if-no-files-found: error
          retention-days: 14
