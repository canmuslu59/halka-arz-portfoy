name: Code28 Notification Fixes
on:
  push:
    branches: [fix/code28-signed-portfolio-alerts-20260914]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Run Node tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: code28-test-diagnostics
          path: npm-test.log
          if-no-files-found: error
          retention-days: 7
      - run: |
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --exit-code -- android/app/src/main/assets/www
          git diff --check
      - uses: android-actions/setup-android@v4.0.1
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Compile Android release sources
        run: gradle -p android --no-daemon compileReleaseJavaWithJavac
      - name: Require live Firebase and push backend configuration
        if: github.event_name == 'workflow_dispatch'
        env:
          PUSH_BACKEND_URL: ${{ secrets.PUSH_BACKEND_URL }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          case "${PUSH_BACKEND_URL:-}" in
            https://*) ;;
            *) echo "PUSH_BACKEND_URL must be a non-empty HTTPS URL" >&2; exit 1 ;;
          esac
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 is required for a Play release" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('android/app/google-services.json','utf8')); if(!j.project_info?.project_id) process.exit(1);"
      - name: Build configured release bundle
        if: github.event_name == 'workflow_dispatch'
        run: gradle -p android --no-daemon bundleRelease
        env:
          PUSH_BACKEND_URL: ${{ secrets.PUSH_BACKEND_URL }}
      - name: Prepare and verify release signing when configured
        if: github.event_name == 'workflow_dispatch'
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: python3 scripts/prepare-code28-release.py
      - uses: actions/upload-artifact@v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          name: code28-notification-release
          path: |
            dist/*.aab
            dist/BUILD_STATUS.json
            docs/CODE28-HANDOFF.md
          if-no-files-found: error
          retention-days: 30
