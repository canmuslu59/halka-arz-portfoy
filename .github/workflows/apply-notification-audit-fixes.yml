name: Apply notification audit fixes

on:
  push:
    branches:
      - audit/code25-notification-hardening-20260911
    paths:
      - .github/workflows/apply-notification-audit-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact notification fixes
        run: python3 scripts/apply-notification-audit-fixes.py
      - name: Synchronize Android assets
        run: node scripts/sync-android-assets.mjs
      - run: npm ci
      - name: Focused notification regression
        run: node --test test/notification-stability-audit.test.js
      - name: Full regression suite
        run: npm test
      - name: Validate diff
        run: git diff --check
      - name: Commit proven fixes and remove one-time patcher
        run: |
          rm scripts/apply-notification-audit-fixes.py
          rm .github/workflows/apply-notification-audit-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden notification delivery paths"
          git push origin HEAD:audit/code25-notification-hardening-20260911
# retry after structural test correction
