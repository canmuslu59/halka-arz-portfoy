name: Code28 Configured Artifact

on:
  push:
    branches: [fix/code28-signed-portfolio-alerts-20260914]
    paths:
      - .github/workflows/code28-configured-artifact.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUSH_BACKEND_URL: https://halka-arz-portfoy-push.grass-airboat.workers.dev
      GOOGLE_SERVICES_JSON_BASE64: 
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Verify Node regressions
        run: npm test
      - name: Sync Android web assets
        run: |
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --exit-code -- android/app/src/main/assets/www
          git diff --check
      - name: Inject Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('android/app/google-services.json','utf8'));
          if (config?.project_info?.project_id !== 'halka-arz-portfoyum') throw new Error('Unexpected Firebase project.');
          const packages = (config.client || []).map(x => x?.client_info?.android_client_info?.package_name);
          if (!packages.includes('com.innative.halkaarz')) throw new Error('Unexpected Android package.');
          NODE
      - uses: android-actions/setup-android@v4.0.1
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Build configured Code28 AAB
        run: gradle -p android --no-daemon bundleRelease
      - name: Verify configured bundle inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/bundle/release/app-release.aab
          unzip -p android/app/build/outputs/bundle/release/app-release.aab base/dex/classes.dex | strings | grep -F "$PUSH_BACKEND_URL"
          unzip -l android/app/build/outputs/bundle/release/app-release.aab | grep -E 'base/resources.pb|base/manifest/AndroidManifest.xml'
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab dist/halka-arz-portfoyum-v2.4.6-code28-configured-unsigned.aab
          sha256sum dist/halka-arz-portfoyum-v2.4.6-code28-configured-unsigned.aab > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: code28-configured-unsigned
          path: dist/*
          if-no-files-found: error
          retention-days: 7
