name: Probe production background alert health

on:
  push:
    branches:
      - fix/background-market-alert-20260915
    paths:
      - .github/workflows/background-health-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read production health
        shell: bash
        run: |
          set -euo pipefail
          URL='https://halka-arz-portfoy-push.grass-airboat.workers.dev/api/health'
          curl --fail --silent --show-error "$URL" -o /tmp/health.json
          node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          console.log(JSON.stringify({
            ok:h.ok,
            now:h.now,
            pollIntervalMs:h.push?.pollIntervalMs,
            androidFallbackMinutes:h.push?.androidFallbackMinutes,
            fcmConfigured:h.push?.fcmConfigured,
            installationCount:h.push?.installationCount,
            runtime:h.push?.runtime,
          }, null, 2));
          if (!h.ok) process.exit(1);
          NODE
