name: Apply final parser and PWA fix

on:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - .github/workflows/apply-final-parser-pwa-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch parser card scope and service worker cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          parser = Path('public/core/parsers.js')
          text = parser.read_text()
          old = """    const windowEnd = cardLinks[cardIndex + 1]?.start ?? activeScope.length;
              const cardHtml = activeScope.slice(start, windowEnd);"""
          new = """    const provisionalEnd = cardLinks[cardIndex + 1]?.start ?? activeScope.length;
              const cardWindow = activeScope.slice(start, provisionalEnd);
              const articleClose = cardWindow.match(/<\\/article\\s*>/i);
              const sectionHeading = cardWindow.search(/<h2\\b/i);
              const relativeEnd = articleClose?.index >= 0
                ? articleClose.index + articleClose[0].length
                : sectionHeading > link[0].length ? sectionHeading : cardWindow.length;
              const cardHtml = cardWindow.slice(0, relativeEnd);"""
          if text.count(old) != 1:
              raise SystemExit('parser card scope target did not match exactly once')
          parser.write_text(text.replace(old, new))

          Path('public/sw.js').write_text("""const CACHE='arz-portfoy-v3';
          const ASSETS=[
            './','./styles.css','./app.js','./manifest.webmanifest','./icon.svg',
            './core/analytics.js','./core/data-sources.js','./core/domain.js','./core/http.js',
            './core/ipo-analytics.js','./core/ipo-service.js','./core/market-calendar.js','./core/navigation.js',
            './core/notification-rules.js','./core/parsers.js','./core/portfolio-service.js','./core/pro-access.js',
            './core/refresh-coordinator.js','./core/repository.js','./core/theme.js'
          ];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS))));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))));
          self.addEventListener('fetch',e=>{
            e.respondWith(fetch(e.request).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return r}).catch(()=>caches.match(e.request)));
          });
          """)
          PY
      - run: npm ci
      - name: Completion contracts
        run: node --test test/ipo-parser-fixtures.test.js test/android-storage-recovery.test.js test/service-worker-cache.test.js
      - name: Full regression
        run: npm test
      - name: Sync Android assets
        run: |
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --check
      - name: Commit verified production fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/core/parsers.js public/sw.js android/app/src/main/assets/www/core/parsers.js android/app/src/main/assets/www/sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: scope IPO cards and refresh PWA cache'
          git push origin HEAD:refactor/code22-clean-source-work2
