name: Code28 Final Review

on:
  push:
    branches: [fix/code28-final-review-20260914]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Run regression suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: code28-final-review-diagnostics
          path: npm-test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Sync Android web assets
        run: |
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --exit-code -- android/app/src/main/assets/www
          git diff --check
      - name: Inject release configuration
        env:
          PUSH_BACKEND_URL: ${{ secrets.PUSH_BACKEND_URL }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          case "${PUSH_BACKEND_URL:-}" in https://*) ;; *) echo "Missing HTTPS PUSH_BACKEND_URL" >&2; exit 1;; esac
          test -n "${GOOGLE_SERVICES_JSON_BASE64:-}"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('android/app/google-services.json','utf8'));
          const packages=(j.client||[]).map(x=>x?.client_info?.android_client_info?.package_name);
          if(j?.project_info?.project_id!=='halka-arz-portfoyum' || !packages.includes('com.innative.halkaarz')) process.exit(1);
          NODE
      - uses: android-actions/setup-android@v4.0.1
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Compile and build release bundle
        env:
          PUSH_BACKEND_URL: ${{ secrets.PUSH_BACKEND_URL }}
        run: |
          gradle -p android --no-daemon compileReleaseJavaWithJavac
          gradle -p android --no-daemon bundleRelease
      - name: Sign and verify Play bundle
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 scripts/prepare-code28-release.py
          test -s dist/halka-arz-portfoyum-v2.4.6-code28-play.aab
          jarsigner -verify -verbose -certs dist/halka-arz-portfoyum-v2.4.6-code28-play.aab >/tmp/jarsigner.txt
          sha256sum dist/halka-arz-portfoyum-v2.4.6-code28-play.aab > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: code28-final-play-aab
          path: |
            dist/halka-arz-portfoyum-v2.4.6-code28-play.aab
            dist/BUILD_STATUS.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
