name: Inspect Code21 Sources for Code22

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v2.3.9-code21

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Code21 source
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/code18-delta/part* > /tmp/code18.b64
          base64 -d /tmp/code18.b64 > /tmp/code18.tar.gz
          echo "fc7d28e1880c7872f3883d12b1352f7800d2f2c88963e26c66a7e862e73e5a42  /tmp/code18.tar.gz" | sha256sum -c -
          tar -xzf /tmp/code18.tar.gz -C .
          cat .ci/code19-delta/part* > /tmp/code19.b64
          base64 -d /tmp/code19.b64 > /tmp/code19.tar.gz
          echo "56ac37a08fdb112a4a39689f5e10e3e7468dc4bf8d4999b3e52f39dcfb38cf27  /tmp/code19.tar.gz" | sha256sum -c -
          tar -xzf /tmp/code19.tar.gz -C .
          python .ci/code20-transform.py
          python .ci/code21-transform.py
      - name: Collect relevant sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/code22-inspect/java /tmp/code22-inspect/public/core /tmp/code22-inspect/test
          cp android/app/src/main/java/com/innative/halkaarz/*.java /tmp/code22-inspect/java/
          cp android/app/src/main/AndroidManifest.xml /tmp/code22-inspect/
          cp android/app/build.gradle /tmp/code22-inspect/app-build.gradle
          cp public/app.js public/index.html /tmp/code22-inspect/
          cp public/core/*.js /tmp/code22-inspect/public/core/
          cp test/*.test.js /tmp/code22-inspect/test/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: code22-inspect-code21-sources
          path: /tmp/code22-inspect
          if-no-files-found: error
          retention-days: 2
