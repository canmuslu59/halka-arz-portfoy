name: Apply Null Market Fix

on:
  push:
    branches:
      - release/v2.4.0-code22
    paths:
      - .github/workflows/apply-null-market-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply exact guarded patch
        run: python3 .ci/apply-null-market-fix.py
      - name: Verify focused null-market behavior
        run: node --test test/null-market-data.test.js
      - name: Full regression suite
        run: npm test
      - name: Synchronize Android assets
        run: |
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --check
      - name: Commit verified production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/core/domain.js public/core/portfolio-service.js android/app/src/main/assets/www/core/domain.js android/app/src/main/assets/www/core/portfolio-service.js
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix: preserve missing market values as null"
          git push origin HEAD:release/v2.4.0-code22
