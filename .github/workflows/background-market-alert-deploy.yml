name: Deploy background market alert fix

on:
  push:
    branches:
      - fix/background-market-alert-20260915
    paths:
      - .github/workflows/background-market-alert-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'CLOUDFLARE_API_TOKEN=missing'; exit 2; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo 'CLOUDFLARE_ACCOUNT_ID=missing'; exit 2; }
      - name: Verify before production deploy
        run: npm test
      - name: Deploy production worker
        run: npx -y wrangler@4.131.1 deploy --config wrangler.jsonc
      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          URL='https://halka-arz-portfoy-push.grass-airboat.workers.dev/api/health'
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error "$URL" -o /tmp/health.json; then
              node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if (!h.ok) process.exit(1);
          console.log(JSON.stringify({
            ok:h.ok,
            now:h.now,
            fcmConfigured:h.push?.fcmConfigured,
            installationCount:h.push?.installationCount,
            runtimeStatus:h.push?.runtime?.status,
            runtimeStartedAt:h.push?.runtime?.startedAt,
            runtimeFinishedAt:h.push?.runtime?.finishedAt,
          }, null, 2));
          if (!h.push?.fcmConfigured) process.exit(2);
          NODE
              exit 0
            fi
            sleep 2
          done
          exit 1
