name: Apply Android Deprecation Cleanup

on:
  push:
    branches:
      - release/v2.4.0-code22

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[run-deprecation-cleanup]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded source patch
        run: python3 .ci/apply-deprecation-cleanup.py
      - name: Verify full regression suite
        run: npm test
      - name: Verify Android web assets remain exact
        run: |
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --exit-code -- android/app/src/main/assets/www
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Compile release Java with deprecation diagnostics
        run: gradle -p android --no-daemon compileReleaseJavaWithJavac --warning-mode all
      - name: Remove one-shot tooling and commit verified patch
        run: |
          rm -f .ci/apply-deprecation-cleanup.py .github/workflows/apply-deprecation-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/innative/halkaarz/MainActivity.java test/android-notification-background-behavior.test.js .ci/apply-deprecation-cleanup.py .github/workflows/apply-deprecation-cleanup.yml
          git diff --cached --check
          git commit -m "fix: replace deprecated Android shell APIs"
          git push origin HEAD:release/v2.4.0-code22
