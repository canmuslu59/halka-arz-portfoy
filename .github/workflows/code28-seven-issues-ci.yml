name: Code28 Seven Issues CI

on:
  push:
    branches: [fix/code28-seven-issues-20260914]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-code:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run regression suite
        run: npm test
      - name: Verify packaged web assets are synchronized
        run: diff -qr public android/app/src/main/assets/www
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Compile release Java only
        run: gradle -p android --no-daemon compileReleaseJavaWithJavac
