name: Firebase Test Lab Matrix

on:
  push:
    branches:
      - ci/firebase-test-lab-20260925
    paths:
      - .github/workflows/firebase-test-lab.yml
      - testlab/*.json
      - android/app/build.gradle
      - android/app/src/androidTest/**
  workflow_dispatch:
    inputs:
      profile:
        description: Test matrix profile
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - physical
          - full
      scenario:
        description: Test scenario
        required: true
        default: crawl
        type: choice
        options:
          - crawl
          - resilience
          - permissions
          - instrumentation
      timeout:
        description: Robo test timeout per device
        required: true
        default: 2m
        type: choice
        options:
          - 1m
          - 2m
          - 3m
          - 5m
      locale:
        description: Android locale
        required: true
        default: tr
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-test-lab-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  FIREBASE_PROJECT_ID: halka-arz-portfoyum
  GCP_TESTLAB_RESULTS_BUCKET: gs://halka-arz-testlab-results-968125285231

jobs:
  robo-matrix:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Prepare safe test APK
        shell: powershell
        run: |
          Remove-Item 'android/app/google-services.json' -Force -ErrorAction SilentlyContinue

          npm run android:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node scripts/apply-test-share-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-test-wallet-metrics-nav.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-test-portfolio-app-navigation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-performance-history-data-fix.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-fixed-bottom-dock-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk -or -not (Test-Path $sdk)) {
            if (Test-Path 'C:\actions-runner\android-sdk') { $sdk = 'C:\actions-runner\android-sdk' }
            elseif ($env:ANDROID_HOME -and (Test-Path $env:ANDROID_HOME)) { $sdk = $env:ANDROID_HOME }
            else { throw 'Android SDK root not found' }
          }
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $sdkmanager = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
          & $sdkmanager "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Build isolated debug APK
        shell: powershell
        env:
          PUSH_BACKEND_URL: ''
        run: |
          gradle -p android --no-daemon assembleDebug assembleDebugAndroidTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $apk = 'android/app/build/outputs/apk/debug/app-debug.apk'
          if (-not (Test-Path $apk)) { throw 'Debug APK not produced' }
          if ((Get-Item $apk).Length -lt 100000) { throw 'Debug APK unexpectedly small' }

          $aapt = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\36.0.0\aapt.exe'
          $badging = (& $aapt dump badging $apk | Out-String)
          if (-not $badging.Contains("package: name='com.innative.halkaarz.test'")) {
            throw 'Test Lab APK must use isolated com.innative.halkaarz.test package'
          }
          if (-not $badging.Contains("application-label:'Hisse Portföyüm Test'")) {
            Write-Host 'Warning: localized app label differs from expected base label'
          }
          $testApk = Get-ChildItem 'android/app/build/outputs/apk/androidTest' -Recurse -Filter '*androidTest.apk' |
            Select-Object -First 1
          if ($null -eq $testApk) { throw 'Instrumentation test APK not produced' }
          "ANDROID_TEST_APK=$($testApk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ISOLATED_TEST_APK=PASS testApk=$($testApk.FullName)"

      - name: Resolve test profile
        id: profile
        shell: powershell
        run: |
          $profile = 'smoke'
          $scenario = 'crawl'
          $timeout = '2m'
          $locale = 'tr'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.profile }}')) { $profile = '${{ inputs.profile }}' }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.scenario }}')) { $scenario = '${{ inputs.scenario }}' }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.timeout }}')) { $timeout = '${{ inputs.timeout }}' }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.locale }}')) { $locale = '${{ inputs.locale }}' }
          }
          "profile=$profile" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "scenario=$scenario" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "timeout=$timeout" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "locale=$locale" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "profile=$profile scenario=$scenario timeout=$timeout locale=$locale"

      - name: Validate Robo scripts
        shell: powershell
        run: |
          node -e "JSON.parse(require('fs').readFileSync('testlab/robo-resilience.json','utf8')); JSON.parse(require('fs').readFileSync('testlab/robo-permissions.json','utf8')); console.log('ROBO_SCRIPTS_JSON=PASS')"

      - name: Check Google OIDC configuration
        id: gcp-config
        shell: powershell
        run: |
          'configured=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'GOOGLE_TESTLAB_OIDC=CONFIGURED'

      - id: auth
        name: Authenticate to Google Cloud with OIDC
        if: steps.gcp-config.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: halka-arz-portfoyum
          workload_identity_provider: projects/968125285231/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-testlab@halka-arz-portfoyum.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        if: steps.gcp-config.outputs.configured == 'true'
        shell: powershell
        run: |
          $version = '586.0.0'
          $root = Join-Path $env:RUNNER_TOOL_CACHE "google-cloud-sdk-$version"
          $sdkDir = Join-Path $root 'google-cloud-sdk'
          $gcloud = Join-Path $sdkDir 'bin\gcloud.cmd'

          if (-not (Test-Path $gcloud)) {
            New-Item -ItemType Directory -Force $root | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP "google-cloud-sdk-$version-windows-x86_64-bundled-python.zip"
            $url = "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-sdk-$version-windows-x86_64-bundled-python.zip"
            $expected = '5fecb9af0f178331b2333c167e57a2676ac286029fb16e328aef911f9d2df2a8'
            $validZip = $false
            if (Test-Path $zip) {
              $existing = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
              $validZip = $existing -ceq $expected
              if (-not $validZip) { Remove-Item $zip -Force }
            }

            if (-not $validZip) {
              & curl.exe -L --fail --retry 3 --retry-delay 2 --max-time 240 --output $zip $url
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

            $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
            if ($actual -cne $expected) {
              throw "Google Cloud CLI SHA256 mismatch expected=$expected actual=$actual"
            }

            & tar.exe -xf $zip -C $root
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item $zip -Force
          }

          if (-not (Test-Path $gcloud)) { throw 'gcloud.cmd not found after extraction' }

          $pythonVersion = '3.12.10'
          $pythonRoot = Join-Path $env:RUNNER_TOOL_CACHE "python-embed-$pythonVersion"
          $python = Join-Path $pythonRoot 'python.exe'

          if (-not (Test-Path $python)) {
            New-Item -ItemType Directory -Force $pythonRoot | Out-Null
            $pythonZip = Join-Path $env:RUNNER_TEMP "python-$pythonVersion-embed-amd64.zip"
            $pythonUrl = "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip"

            & curl.exe -L --fail --retry 3 --retry-delay 2 --max-time 120 --output $pythonZip $pythonUrl
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & tar.exe -xf $pythonZip -C $pythonRoot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item $pythonZip -Force
          }

          if (-not (Test-Path $python)) { throw 'Portable Python not found after extraction' }
          & $python --version
          if ($LASTEXITCODE -ne 0) { throw 'Portable Python exists but cannot execute' }

          $env:CLOUDSDK_PYTHON = $python
          "CLOUDSDK_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $sdkDir 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          & $gcloud --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Test Lab APIs and catalog
        if: steps.gcp-config.outputs.configured == 'true'
        shell: powershell
        run: |
          gcloud config set project $env:FIREBASE_PROJECT_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $enabled = @(gcloud services list --enabled --project $env:FIREBASE_PROJECT_ID --format='value(config.name)')
          foreach ($api in @('testing.googleapis.com','toolresults.googleapis.com')) {
            if ($enabled -notcontains $api) {
              throw "Required Google Cloud API is not enabled: $api"
            }
          }

          New-Item -ItemType Directory -Force testlab | Out-Null
          gcloud firebase test android models list --project $env:FIREBASE_PROJECT_ID | Tee-Object -FilePath testlab/device-catalog.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Select current device matrix
        if: steps.gcp-config.outputs.configured == 'true'
        id: devices
        shell: powershell
        env:
          PROFILE: ${{ steps.profile.outputs.profile }}
        run: |
          function Get-Models([string]$filter, [int]$limit) {
            $items = @(
              gcloud firebase test android models list --project $env:FIREBASE_PROJECT_ID --filter=$filter --format='value(id)' |
                ForEach-Object { $_.Trim() } |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )
            return @($items | Select-Object -Unique | Select-Object -First $limit)
          }

          $virtual = @('NexusLowRes')
          $virtual += @(Get-Models 'virtual' 10)
          $virtual = @($virtual | Select-Object -Unique | Select-Object -First 5)

          $samsungPhysical = @(Get-Models 'Samsung AND physical' 3)
          $googlePhysical = @(Get-Models 'Google AND physical' 5)
          $physical = @($samsungPhysical + $googlePhysical | Select-Object -Unique | Select-Object -First 5)

          switch ($env:PROFILE) {
            'smoke' {
              $selected = @($virtual | Select-Object -First 3)
            }
            'physical' {
              if ($physical.Count -lt 1) { throw 'No physical device was resolved from the current Test Lab catalog' }
              $selected = @($physical)
            }
            'full' {
              if ($physical.Count -lt 1) { throw 'No physical device was resolved from the current Test Lab catalog' }
              $selected = @($physical + $virtual | Select-Object -Unique | Select-Object -First 10)
            }
            default {
              throw "Unknown profile: $env:PROFILE"
            }
          }

          if ($selected.Count -lt 1) { throw 'No Test Lab devices selected' }

          $selected | Set-Content -Encoding utf8 testlab/selected-devices.txt
          Write-Host "Selected profile=$env:PROFILE devices=$($selected -join ',')"
          "device_count=$($selected.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run Firebase Robo matrix
        if: steps.gcp-config.outputs.configured == 'true'
        shell: powershell
        env:
          TEST_TIMEOUT: ${{ steps.profile.outputs.timeout }}
          TEST_LOCALE: ${{ steps.profile.outputs.locale }}
          PROFILE: ${{ steps.profile.outputs.profile }}
          SCENARIO: ${{ steps.profile.outputs.scenario }}
        run: |
          $apk = 'android/app/build/outputs/apk/debug/app-debug.apk'
          $models = @(Get-Content testlab/selected-devices.txt | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })

          $args = @(
            'firebase','test','android','run',
            '--project', $env:FIREBASE_PROJECT_ID,
            '--app', $apk,
            '--timeout', $env:TEST_TIMEOUT,
            '--results-history-name','Hisse Portfoyum CI',
            '--results-bucket', $env:GCP_TESTLAB_RESULTS_BUCKET,
            '--client-details', "matrixLabel=Hisse-Portfoyum-$env:PROFILE-$env:SCENARIO-$env:GITHUB_RUN_NUMBER"
          )

          switch ($env:SCENARIO) {
            'crawl' {
              $args += '--type'
              $args += 'robo'
              Write-Host 'TEST_SCENARIO=CRAWL'
            }
            'resilience' {
              $args += '--type'
              $args += 'robo'
              $args += '--robo-script'
              $args += 'testlab/robo-resilience.json'
              Write-Host 'TEST_SCENARIO=RESILIENCE'
            }
            'permissions' {
              $args += '--type'
              $args += 'robo'
              $args += '--robo-script'
              $args += 'testlab/robo-permissions.json'
              Write-Host 'TEST_SCENARIO=PERMISSIONS'
            }
            'instrumentation' {
              if ([string]::IsNullOrWhiteSpace($env:ANDROID_TEST_APK) -or -not (Test-Path $env:ANDROID_TEST_APK)) {
                throw 'Instrumentation APK path missing'
              }
              $args += '--type'
              $args += 'instrumentation'
              $args += '--test'
              $args += $env:ANDROID_TEST_APK
              Write-Host 'TEST_SCENARIO=INSTRUMENTATION'
            }
            default {
              throw "Unknown scenario: $env:SCENARIO"
            }
          }

          foreach ($model in $models) {
            $args += '--device'
            $args += "model=$model,locale=$env:TEST_LOCALE,orientation=portrait"
          }

          & gcloud @args 2>&1 | Tee-Object -FilePath testlab/test-run.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Test Lab run metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-lab-${{ steps.profile.outputs.profile }}-${{ steps.profile.outputs.scenario }}-${{ github.run_number }}
          path: |
            testlab/device-catalog.txt
            testlab/selected-devices.txt
            testlab/test-run.txt
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/**/*.apk
          if-no-files-found: warn
          retention-days: 14
