name: Firebase Test Lab Matrix

on:
  push:
    branches:
      - ci/firebase-test-lab-20260925
    paths:
      - .github/workflows/firebase-test-lab.yml
      - testlab/*.json
      - android/app/build.gradle
      - android/app/src/androidTest/**
  workflow_dispatch:
    inputs:
      profile:
        description: Test matrix profile
        required: true
        default: smoke
        type: choice
        options: [smoke, physical, full]
      scenario:
        description: Test scenario
        required: true
        default: crawl
        type: choice
        options: [crawl, resilience, permissions, instrumentation]
      timeout:
        description: Test timeout per device
        required: true
        default: 2m
        type: choice
        options: [1m, 2m, 3m, 5m]
      locale:
        description: Android locale
        required: true
        default: tr
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-test-lab-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  FIREBASE_PROJECT_ID: halka-arz-portfoyum

jobs:
  testlab:
    name: Build and run Firebase Test Lab
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Prepare isolated test build
        shell: powershell
        run: |
          Remove-Item 'android/app/google-services.json' -Force -ErrorAction SilentlyContinue
          npm run android:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node scripts/apply-test-share-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-test-wallet-metrics-nav.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-test-portfolio-app-navigation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-performance-history-data-fix.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-fixed-bottom-dock-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk -or -not (Test-Path $sdk)) {
            if (Test-Path 'C:\actions-runner\android-sdk') { $sdk = 'C:\actions-runner\android-sdk' }
            elseif ($env:ANDROID_HOME -and (Test-Path $env:ANDROID_HOME)) { $sdk = $env:ANDROID_HOME }
            else { throw 'Android SDK root not found' }
          }
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $sdkmanager = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
          & $sdkmanager "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Build app and instrumentation APKs
        shell: powershell
        env:
          PUSH_BACKEND_URL: ''
        run: |
          gradle -p android --no-daemon assembleDebug assembleDebugAndroidTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $apk = 'android/app/build/outputs/apk/debug/app-debug.apk'
          if (-not (Test-Path $apk)) { throw 'Debug APK not produced' }
          if ((Get-Item $apk).Length -lt 100000) { throw 'Debug APK unexpectedly small' }

          $testApk = Get-ChildItem 'android/app/build/outputs/apk/androidTest' -Recurse -Filter '*androidTest.apk' |
            Select-Object -First 1
          if ($null -eq $testApk) { throw 'Instrumentation test APK not produced' }

          $aapt = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\36.0.0\aapt.exe'
          $badging = (& $aapt dump badging $apk | Out-String)
          if (-not $badging.Contains("package: name='com.innative.halkaarz.test'")) {
            throw 'Test Lab APK must use isolated com.innative.halkaarz.test package'
          }

          Write-Host 'ISOLATED_TEST_BUILD=PASS'

      - name: Resolve test inputs
        id: inputs
        shell: powershell
        run: |
          $profile = 'smoke'
          $scenario = 'crawl'
          $timeout = '2m'
          $locale = 'tr'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.profile }}')) { $profile = '${{ inputs.profile }}' }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.scenario }}')) { $scenario = '${{ inputs.scenario }}' }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.timeout }}')) { $timeout = '${{ inputs.timeout }}' }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.locale }}')) { $locale = '${{ inputs.locale }}' }
          }
          "profile=$profile" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "scenario=$scenario" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "timeout=$timeout" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "locale=$locale" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "profile=$profile scenario=$scenario timeout=$timeout locale=$locale"

      - name: Validate test assets
        shell: powershell
        run: |
          node -e "JSON.parse(require('fs').readFileSync('testlab/robo-resilience.json','utf8')); JSON.parse(require('fs').readFileSync('testlab/robo-permissions.json','utf8')); console.log('ROBO_SCRIPTS_JSON=PASS')"

      - id: auth
        name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: halka-arz-portfoyum
          workload_identity_provider: projects/968125285231/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-testlab@halka-arz-portfoyum.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up portable Google Cloud CLI
        shell: powershell
        run: |
          $version = '586.0.0'
          $root = Join-Path $env:RUNNER_TOOL_CACHE "google-cloud-sdk-$version"
          $sdkDir = Join-Path $root 'google-cloud-sdk'
          $gcloud = Join-Path $sdkDir 'bin\gcloud.cmd'

          if (-not (Test-Path $gcloud)) {
            New-Item -ItemType Directory -Force $root | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP "google-cloud-sdk-$version.zip"
            $url = "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-sdk-$version-windows-x86_64.zip"
            & curl.exe -L --fail --retry 3 --retry-delay 2 --max-time 240 --output $zip $url
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & tar.exe -xf $zip -C $root
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item $zip -Force
          }

          if (-not (Test-Path $gcloud)) { throw 'gcloud.cmd not found' }

          $pythonVersion = '3.12.10'
          $pythonRoot = Join-Path $env:RUNNER_TOOL_CACHE "python-embed-$pythonVersion"
          $python = Join-Path $pythonRoot 'python.exe'
          if (-not (Test-Path $python)) {
            New-Item -ItemType Directory -Force $pythonRoot | Out-Null
            $pythonZip = Join-Path $env:RUNNER_TEMP "python-$pythonVersion-embed-amd64.zip"
            $pythonUrl = "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip"
            & curl.exe -L --fail --retry 3 --retry-delay 2 --max-time 120 --output $pythonZip $pythonUrl
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & tar.exe -xf $pythonZip -C $pythonRoot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item $pythonZip -Force
          }

          if (-not (Test-Path $python)) { throw 'Portable Python not found' }

          $pth = Join-Path $pythonRoot 'python312._pth'
          @(
            'python312.zip',
            '.',
            (Join-Path $sdkDir 'lib'),
            (Join-Path $sdkDir 'lib\third_party'),
            'import site'
          ) | Set-Content -Path $pth -Encoding ascii

          $env:CLOUDSDK_PYTHON = $python
          $env:CLOUDSDK_PYTHON_SITEPACKAGES = '1'
          "CLOUDSDK_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CLOUDSDK_PYTHON_SITEPACKAGES=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $sdkDir 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          & $python -c "import six, dateutil; print('PYTHON_DEPS=PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Cloud SDK Python dependency check failed' }

          & $gcloud --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Test Lab catalog
        shell: powershell
        run: |
          gcloud config set project $env:FIREBASE_PROJECT_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gcloud firebase test android models list --project $env:FIREBASE_PROJECT_ID --limit 5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'TESTLAB_CATALOG=PASS'

      - name: Run Firebase Test Lab
        shell: powershell
        env:
          PROFILE: ${{ steps.inputs.outputs.profile }}
          SCENARIO: ${{ steps.inputs.outputs.scenario }}
          TEST_TIMEOUT: ${{ steps.inputs.outputs.timeout }}
          TEST_LOCALE: ${{ steps.inputs.outputs.locale }}
        run: |
          New-Item -ItemType Directory -Force testlab-output | Out-Null

          $appApk = (Resolve-Path 'android/app/build/outputs/apk/debug/app-debug.apk').Path
          $testApk = (Get-ChildItem 'android/app/build/outputs/apk/androidTest' -Recurse -Filter '*androidTest.apk' | Select-Object -First 1).FullName

          $args = @(
            'firebase','test','android','run',
            '--project', $env:FIREBASE_PROJECT_ID,
            '--app', $appApk,
            '--timeout', $env:TEST_TIMEOUT,
            '--results-history-name', 'Hisse Portfoyum CI',
            '--client-details', "matrixLabel=Hisse-Portfoyum-$env:PROFILE-$env:SCENARIO-$env:GITHUB_RUN_NUMBER",
            '--quiet'
          )

          if ($env:PROFILE -eq 'smoke') {
            foreach ($model in @('MediumPhone_ps16k.arm','MediumPhone.arm','MediumPhone_ps16k_backcompat.arm')) {
              $args += '--device'
              $args += "model=$model,locale=$env:TEST_LOCALE,orientation=portrait"
            }
          } else {
            $physical = @(
              gcloud firebase test android models list --project $env:FIREBASE_PROJECT_ID --filter='form=PHYSICAL' --format='value(id)' |
                ForEach-Object { $_.Trim() } |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
                Select-Object -First 5
            )
            if ($physical.Count -lt 1) { throw 'No physical Test Lab models resolved' }
            foreach ($model in $physical) {
              $args += '--device'
              $args += "model=$model,locale=$env:TEST_LOCALE,orientation=portrait"
            }
            if ($env:PROFILE -eq 'full') {
              foreach ($model in @('MediumPhone_ps16k.arm','MediumPhone.arm','MediumPhone_ps16k_backcompat.arm')) {
                $args += '--device'
                $args += "model=$model,locale=$env:TEST_LOCALE,orientation=portrait"
              }
            } elseif ($env:PROFILE -ne 'physical') {
              throw "Unknown profile: $env:PROFILE"
            }
          }

          switch ($env:SCENARIO) {
            'crawl' {
              $args += '--type'
              $args += 'robo'
            }
            'resilience' {
              $args += '--type'
              $args += 'robo'
              $args += '--robo-script'
              $args += (Resolve-Path 'testlab/robo-resilience.json').Path
            }
            'permissions' {
              $args += '--type'
              $args += 'robo'
              $args += '--robo-script'
              $args += (Resolve-Path 'testlab/robo-permissions.json').Path
            }
            'instrumentation' {
              $args += '--type'
              $args += 'instrumentation'
              $args += '--test'
              $args += $testApk
            }
            default { throw "Unknown scenario: $env:SCENARIO" }
          }

          & gcloud @args 2>&1 | Tee-Object -FilePath testlab-output/test-run.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Test Lab run metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-lab-${{ steps.inputs.outputs.profile }}-${{ steps.inputs.outputs.scenario }}-${{ github.run_number }}
          path: |
            testlab-output/test-run.txt
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/**/*.apk
          if-no-files-found: warn
          retention-days: 14
