name: Firebase Test Lab Matrix

on:
  push:
    branches:
      - ci/firebase-test-lab-20260925
    paths:
      - .github/workflows/firebase-test-lab.yml
      - testlab/*.json
      - android/app/build.gradle
      - android/app/src/androidTest/**
  workflow_dispatch:
    inputs:
      profile:
        description: Test matrix profile
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - physical
          - full
      scenario:
        description: Test scenario
        required: true
        default: crawl
        type: choice
        options:
          - crawl
          - resilience
          - permissions
          - instrumentation
      timeout:
        description: Test timeout per device
        required: true
        default: 2m
        type: choice
        options:
          - 1m
          - 2m
          - 3m
          - 5m
      locale:
        description: Android locale
        required: true
        default: tr
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-test-lab-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  FIREBASE_PROJECT_ID: halka-arz-portfoyum

jobs:
  build-test-apks:
    name: Build isolated test APKs
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Prepare isolated test build
        shell: powershell
        run: |
          Remove-Item 'android/app/google-services.json' -Force -ErrorAction SilentlyContinue

          npm run android:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node scripts/apply-test-share-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-test-wallet-metrics-nav.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-test-portfolio-app-navigation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-performance-history-data-fix.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-fixed-bottom-dock-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk -or -not (Test-Path $sdk)) {
            if (Test-Path 'C:\actions-runner\android-sdk') { $sdk = 'C:\actions-runner\android-sdk' }
            elseif ($env:ANDROID_HOME -and (Test-Path $env:ANDROID_HOME)) { $sdk = $env:ANDROID_HOME }
            else { throw 'Android SDK root not found' }
          }

          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $sdkmanager = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
          & $sdkmanager "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Build app and instrumentation APKs
        shell: powershell
        env:
          PUSH_BACKEND_URL: ''
        run: |
          gradle -p android --no-daemon assembleDebug assembleDebugAndroidTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $apk = 'android/app/build/outputs/apk/debug/app-debug.apk'
          if (-not (Test-Path $apk)) { throw 'Debug APK not produced' }
          if ((Get-Item $apk).Length -lt 100000) { throw 'Debug APK unexpectedly small' }

          $testApk = Get-ChildItem 'android/app/build/outputs/apk/androidTest' -Recurse -Filter '*androidTest.apk' |
            Select-Object -First 1
          if ($null -eq $testApk) { throw 'Instrumentation test APK not produced' }

          $aapt = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\36.0.0\aapt.exe'
          $badging = (& $aapt dump badging $apk | Out-String)
          if (-not $badging.Contains("package: name='com.innative.halkaarz.test'")) {
            throw 'Test Lab APK must use isolated com.innative.halkaarz.test package'
          }

          Write-Host "APP_APK=$apk"
          Write-Host "TEST_APK=$($testApk.FullName)"
          Write-Host 'ISOLATED_TEST_BUILD=PASS'

      - name: Upload Test Lab build
        uses: actions/upload-artifact@v4
        with:
          name: testlab-build-${{ github.run_id }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/**/*.apk
            testlab/robo-resilience.json
            testlab/robo-permissions.json
          if-no-files-found: error
          retention-days: 3

  run-testlab:
    name: Run Firebase Test Lab
    needs: build-test-apks
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: testlab-build-${{ github.run_id }}
          path: testlab-build

      - id: auth
        name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: halka-arz-portfoyum
          workload_identity_provider: projects/968125285231/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-testlab@halka-arz-portfoyum.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 516.0.0'
          project_id: halka-arz-portfoyum

      - name: Resolve test inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          profile="${{ inputs.profile }}"
          scenario="${{ inputs.scenario }}"
          timeout="${{ inputs.timeout }}"
          locale="${{ inputs.locale }}"

          [[ -n "$profile" ]] || profile="smoke"
          [[ -n "$scenario" ]] || scenario="crawl"
          [[ -n "$timeout" ]] || timeout="2m"
          [[ -n "$locale" ]] || locale="tr"

          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "scenario=$scenario" >> "$GITHUB_OUTPUT"
          echo "timeout=$timeout" >> "$GITHUB_OUTPUT"
          echo "locale=$locale" >> "$GITHUB_OUTPUT"

          echo "profile=$profile scenario=$scenario timeout=$timeout locale=$locale"

      - name: Verify Test Lab access
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$FIREBASE_PROJECT_ID"
          gcloud firebase test android models list --project "$FIREBASE_PROJECT_ID" --limit=5
          echo "TESTLAB_CATALOG=PASS"

      - name: Run test matrix
        shell: bash
        env:
          PROFILE: ${{ steps.inputs.outputs.profile }}
          SCENARIO: ${{ steps.inputs.outputs.scenario }}
          TEST_TIMEOUT: ${{ steps.inputs.outputs.timeout }}
          TEST_LOCALE: ${{ steps.inputs.outputs.locale }}
        run: |
          set -euo pipefail
          mkdir -p testlab-output

          APP_APK="$(find testlab-build -type f -name 'app-debug.apk' | head -n1)"
          TEST_APK="$(find testlab-build -type f -name '*androidTest.apk' | head -n1)"
          RESILIENCE="$(find testlab-build -type f -name 'robo-resilience.json' | head -n1)"
          PERMISSIONS="$(find testlab-build -type f -name 'robo-permissions.json' | head -n1)"

          [[ -f "$APP_APK" ]] || { echo "App APK missing"; exit 20; }
          [[ -f "$TEST_APK" ]] || { echo "Instrumentation APK missing"; exit 21; }

          DEVICE_ARGS=()

          if [[ "$PROFILE" == "smoke" ]]; then
            DEVICE_ARGS+=("--device=model=MediumPhone_ps16k.arm,locale=$TEST_LOCALE,orientation=portrait")
            DEVICE_ARGS+=("--device=model=MediumPhone.arm,locale=$TEST_LOCALE,orientation=portrait")
            DEVICE_ARGS+=("--device=model=MediumPhone_ps16k_backcompat.arm,locale=$TEST_LOCALE,orientation=portrait")
          else
            mapfile -t PHYSICAL_MODELS < <(
              gcloud firebase test android models list \
                --project "$FIREBASE_PROJECT_ID" \
                --filter="form=PHYSICAL" \
                --format="value(id)" | head -n5
            )

            if [[ ${#PHYSICAL_MODELS[@]} -eq 0 ]]; then
              echo "No physical Test Lab models resolved"
              exit 22
            fi

            if [[ "$PROFILE" == "physical" ]]; then
              for model in "${PHYSICAL_MODELS[@]}"; do
                DEVICE_ARGS+=("--device=model=$model,locale=$TEST_LOCALE,orientation=portrait")
              done
            elif [[ "$PROFILE" == "full" ]]; then
              for model in "${PHYSICAL_MODELS[@]:0:5}"; do
                DEVICE_ARGS+=("--device=model=$model,locale=$TEST_LOCALE,orientation=portrait")
              done
              DEVICE_ARGS+=("--device=model=MediumPhone_ps16k.arm,locale=$TEST_LOCALE,orientation=portrait")
              DEVICE_ARGS+=("--device=model=MediumPhone.arm,locale=$TEST_LOCALE,orientation=portrait")
              DEVICE_ARGS+=("--device=model=MediumPhone_ps16k_backcompat.arm,locale=$TEST_LOCALE,orientation=portrait")
            else
              echo "Unknown profile: $PROFILE"
              exit 23
            fi
          fi

          COMMON_ARGS=(
            firebase test android run
            --project "$FIREBASE_PROJECT_ID"
            --app "$APP_APK"
            --timeout "$TEST_TIMEOUT"
            --results-history-name "Hisse Portfoyum CI"
            --client-details "matrixLabel=Hisse-Portfoyum-$PROFILE-$SCENARIO-${GITHUB_RUN_NUMBER}"
            --quiet
          )

          echo "TEST_PROFILE=$PROFILE TEST_SCENARIO=$SCENARIO DEVICES=${#DEVICE_ARGS[@]}"

          case "$SCENARIO" in
            crawl)
              gcloud "${COMMON_ARGS[@]}" --type robo "${DEVICE_ARGS[@]}" 2>&1 | tee testlab-output/test-run.txt
              ;;
            resilience)
              [[ -f "$RESILIENCE" ]] || { echo "Resilience Robo script missing"; exit 24; }
              gcloud "${COMMON_ARGS[@]}" --type robo --robo-script "$RESILIENCE" "${DEVICE_ARGS[@]}" 2>&1 | tee testlab-output/test-run.txt
              ;;
            permissions)
              [[ -f "$PERMISSIONS" ]] || { echo "Permissions Robo script missing"; exit 25; }
              gcloud "${COMMON_ARGS[@]}" --type robo --robo-script "$PERMISSIONS" "${DEVICE_ARGS[@]}" 2>&1 | tee testlab-output/test-run.txt
              ;;
            instrumentation)
              gcloud "${COMMON_ARGS[@]}" --type instrumentation --test "$TEST_APK" "${DEVICE_ARGS[@]}" 2>&1 | tee testlab-output/test-run.txt
              ;;
            *)
              echo "Unknown scenario: $SCENARIO"
              exit 26
              ;;
          esac

      - name: Upload Test Lab summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testlab-results-${{ github.run_id }}
          path: testlab-output/
          if-no-files-found: warn
          retention-days: 14
