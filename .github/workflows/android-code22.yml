name: Build Code22 Google Play AAB

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v2.4.0-code22

permissions:
  contents: read

jobs:
  build-code22-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Code21 and apply Code22
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/code18-delta/part* > /tmp/code18.b64
          base64 -d /tmp/code18.b64 > /tmp/code18.tar.gz
          echo "fc7d28e1880c7872f3883d12b1352f7800d2f2c88963e26c66a7e862e73e5a42  /tmp/code18.tar.gz" | sha256sum -c -
          tar -xzf /tmp/code18.tar.gz -C .
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 -d .ci/code17-launcher.webp.b64 > android/app/src/main/res/drawable-nodpi/ic_launcher.webp
          echo "517298c9cecd73ee52262f826c13c96f877bfd5322b9b3ef7c98779ea733aa48  android/app/src/main/res/drawable-nodpi/ic_launcher.webp" | sha256sum -c -
          rm -f android/app/src/main/res/drawable/ic_launcher.xml
          cat .ci/code19-delta/part* > /tmp/code19.b64
          base64 -d /tmp/code19.b64 > /tmp/code19.tar.gz
          echo "56ac37a08fdb112a4a39689f5e10e3e7468dc4bf8d4999b3e52f39dcfb38cf27  /tmp/code19.tar.gz" | sha256sum -c -
          tar -xzf /tmp/code19.tar.gz -C .
          python .ci/code20-transform.py
          python .ci/code21-transform.py
          python .ci/code22-transform.py
          cp .ci/code22-regression.test.js test/code22-regression.test.js
          python - <<'PY'
          from pathlib import Path
          for p in Path('test').glob('*.test.js'):
              s=p.read_text(encoding='utf-8')
              s=s.replace('versionCode 21','versionCode 22').replace('versionName 2.3.9','versionName 2.4.0')
              s=s.replace("versionName ['\\\"]2\\.3\\.9['\\\"]", "versionName ['\\\"]2\\.4\\.0['\\\"]")
              s=s.replace('v2\\.3\\.9','v2\\.4\\.0').replace('Build 21','Build 22')
              p.write_text(s,encoding='utf-8')
          PY

      - name: Verify Code22 source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.innative.halkaarz'" android/app/build.gradle
          grep -q "versionCode 22" android/app/build.gradle
          grep -q "versionName '2.4.0'" android/app/build.gradle
          grep -q "targetSdk 36" android/app/build.gradle
          grep -q "v2.4.0 • Build 22" public/index.html
          grep -q "__handleAndroidBack" android/app/src/main/java/com/innative/halkaarz/MainActivity.java
          ! grep -q "webView.canGoBack()" android/app/src/main/java/com/innative/halkaarz/MainActivity.java
          grep -q "OneTimeWorkRequest" android/app/src/main/java/com/innative/halkaarz/BackgroundAlertScheduler.java
          grep -q "IPO_CALENDAR_URL" android/app/src/main/java/com/innative/halkaarz/BackgroundAlertWorker.java
          grep -q "ipoEnabled" android/app/src/main/java/com/innative/halkaarz/PushConfigSync.java
          grep -q "market_ceiling_coin_v1" android/app/src/main/java/com/innative/halkaarz/NotificationHelper.java
          test -s android/app/src/main/res/raw/notification_rise.wav
          test -s android/app/src/main/res/raw/notification_ceiling_coin.wav
          test -s android/app/src/main/res/raw/notification_floor.wav

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install JS dependencies
        run: npm ci

      - name: Full regression pass 1
        run: node --test test/*.test.js

      - name: Live NETGL calendar/detail verification 1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -A 'Mozilla/5.0' 'https://www.ahlatciyatirim.com.tr/halka-arz?sayfa=1' -o /tmp/calendar1.html
          curl -fsSL --retry 2 -A 'Mozilla/5.0' 'https://www.ahlatciyatirim.com.tr/halka-arz/net-global-endustriyel-yatirimlar' -o /tmp/netgl1.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          import {parseAhlatciCalendar,parseAhlatciDetail} from './public/core/parsers.js';
          const cal=parseAhlatciCalendar(fs.readFileSync('/tmp/calendar1.html','utf8'));
          const base=cal.find(x=>x.ticker==='NETGL'); assert.ok(base,'NETGL calendar missing');
          assert.deepEqual(base.consortiumLeaders,['Tacirler Yatırım']);
          const detail=parseAhlatciDetail(fs.readFileSync('/tmp/netgl1.html','utf8'),base);
          assert.deepEqual(detail.consortiumLeaders,['Tacirler Yatırım']);
          console.log('NETGL OK', detail.offerDates, detail.consortiumLeaders.join(','));
          NODE

      - name: Sync web assets into Android
        run: npm run android:sync

      - name: Full regression pass 2 after sync
        run: node --test test/*.test.js

      - name: Live NETGL calendar/detail verification 2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -A 'Mozilla/5.0' 'https://www.ahlatciyatirim.com.tr/halka-arz?sayfa=1' -o /tmp/calendar2.html
          curl -fsSL --retry 2 -A 'Mozilla/5.0' 'https://www.ahlatciyatirim.com.tr/halka-arz/net-global-endustriyel-yatirimlar' -o /tmp/netgl2.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          import {parseAhlatciCalendar,parseAhlatciDetail} from './public/core/parsers.js';
          const cal=parseAhlatciCalendar(fs.readFileSync('/tmp/calendar2.html','utf8'));
          const base=cal.find(x=>x.ticker==='NETGL'); assert.ok(base,'NETGL calendar missing');
          assert.deepEqual(base.consortiumLeaders,['Tacirler Yatırım']);
          const detail=parseAhlatciDetail(fs.readFileSync('/tmp/netgl2.html','utf8'),base);
          assert.deepEqual(detail.consortiumLeaders,['Tacirler Yatırım']);
          console.log('NETGL OK pass2', detail.offerDates, detail.consortiumLeaders.join(','));
          NODE

      - name: Verify synced Android production assets
        shell: bash
        run: |
          set -euo pipefail
          grep -q "v2.4.0 • Build 22" android/app/src/main/assets/www/index.html
          grep -q "__handleAndroidBack" android/app/src/main/assets/www/app.js
          grep -q "cardLinks" android/app/src/main/assets/www/core/parsers.js

      - name: Build unsigned Play AAB
        run: gradle -p android --no-daemon bundleRelease

      - name: Collect AAB
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab halka-arz-portfoyum-v2.4.0-code22-unsigned.aab
          sha256sum halka-arz-portfoyum-v2.4.0-code22-unsigned.aab > code22-aab-sha256.txt
          cat code22-aab-sha256.txt
      - name: Upload Code22 AAB
        uses: actions/upload-artifact@v4
        with:
          name: code22-play-aab-unsigned
          path: |
            halka-arz-portfoyum-v2.4.0-code22-unsigned.aab
            code22-aab-sha256.txt
          if-no-files-found: error
          retention-days: 30
