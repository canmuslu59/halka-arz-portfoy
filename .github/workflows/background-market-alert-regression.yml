name: Background market alert regression

on:
  push:
    branches:
      - fix/background-market-alert-20260915

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node --test test/background-closed-alert-regression.test.js
