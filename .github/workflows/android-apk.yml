name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main, feature/android-apk ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync web assets into Android
        run: npm run android:sync

      - name: Build APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk halka-arz-portfoy.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: halka-arz-portfoy-apk
          path: halka-arz-portfoy.apk
          if-no-files-found: error
          retention-days: 30
