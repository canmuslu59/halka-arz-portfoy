name: Build Code20 Google Play AAB

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v2.3.8-code20

permissions:
  contents: read

jobs:
  build-code20-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified Code18 source delta
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/code18-delta/part* > /tmp/code18-delta.b64
          base64 -d /tmp/code18-delta.b64 > /tmp/code18-delta.tar.gz
          echo "fc7d28e1880c7872f3883d12b1352f7800d2f2c88963e26c66a7e862e73e5a42  /tmp/code18-delta.tar.gz" | sha256sum -c -
          tar -xzf /tmp/code18-delta.tar.gz -C .

      - name: Restore exact Code17 launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 -d .ci/code17-launcher.webp.b64 > android/app/src/main/res/drawable-nodpi/ic_launcher.webp
          echo "517298c9cecd73ee52262f826c13c96f877bfd5322b9b3ef7c98779ea733aa48  android/app/src/main/res/drawable-nodpi/ic_launcher.webp" | sha256sum -c -
          rm -f android/app/src/main/res/drawable/ic_launcher.xml

      - name: Apply verified Code19 delta
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/code19-delta/part* > /tmp/code19-delta.b64
          base64 -d /tmp/code19-delta.b64 > /tmp/code19-delta.tar.gz
          echo "56ac37a08fdb112a4a39689f5e10e3e7468dc4bf8d4999b3e52f39dcfb38cf27  /tmp/code19-delta.tar.gz" | sha256sum -c -
          tar -xzf /tmp/code19-delta.tar.gz -C .

      - name: Apply Code20 startup notification permission fix
        shell: bash
        run: |
          set -euo pipefail
          python .ci/code20-transform.py

      - name: Verify Play release identity and startup permission contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.innative.halkaarz'" android/app/build.gradle
          grep -q "versionCode 20" android/app/build.gradle
          grep -q "versionName '2.3.8'" android/app/build.gradle
          grep -q "compileSdk 36" android/app/build.gradle
          grep -q "targetSdk 36" android/app/build.gradle
          grep -q "androidx.work:work-runtime:2.10.1" android/app/build.gradle
          grep -q "v2.3.8 • Build 20" public/index.html
          grep -q "requestStartupNotificationPermission" android/app/src/main/java/com/innative/halkaarz/MainActivity.java
          grep -q "postDelayed(this::requestStartupNotificationPermission, 700L)" android/app/src/main/java/com/innative/halkaarz/MainActivity.java
          ! grep -q "setTimeout(maybeRequestNotificationPermissionOnce" public/app.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run Code20 focused regression contracts
        run: node --test test/code19-behavior.test.js test/android-contract.test.js test/settings-contract.test.js

      - name: Sync web assets into Android
        run: npm run android:sync

      - name: Re-run Code20 focused contracts after sync
        run: node --test test/code19-behavior.test.js test/android-contract.test.js test/settings-contract.test.js

      - name: Build unsigned Google Play AAB
        run: gradle -p android --no-daemon bundleRelease

      - name: Collect AAB
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab halka-arz-portfoyum-v2.3.8-code20-unsigned.aab
          sha256sum halka-arz-portfoyum-v2.3.8-code20-unsigned.aab > code20-aab-sha256.txt
          cat code20-aab-sha256.txt

      - name: Upload Code20 AAB
        uses: actions/upload-artifact@v4
        with:
          name: code20-play-aab-unsigned
          path: |
            halka-arz-portfoyum-v2.3.8-code20-unsigned.aab
            code20-aab-sha256.txt
          if-no-files-found: error
          retention-days: 30
