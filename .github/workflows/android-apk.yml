name: Build Code21 Google Play AAB

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v2.3.9-code21

permissions:
  contents: read

jobs:
  build-code21-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified Code18 source delta
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/code18-delta/part* > /tmp/code18-delta.b64
          base64 -d /tmp/code18-delta.b64 > /tmp/code18-delta.tar.gz
          echo "fc7d28e1880c7872f3883d12b1352f7800d2f2c88963e26c66a7e862e73e5a42  /tmp/code18-delta.tar.gz" | sha256sum -c -
          tar -xzf /tmp/code18-delta.tar.gz -C .

      - name: Restore exact Code17 launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 -d .ci/code17-launcher.webp.b64 > android/app/src/main/res/drawable-nodpi/ic_launcher.webp
          echo "517298c9cecd73ee52262f826c13c96f877bfd5322b9b3ef7c98779ea733aa48  android/app/src/main/res/drawable-nodpi/ic_launcher.webp" | sha256sum -c -
          rm -f android/app/src/main/res/drawable/ic_launcher.xml

      - name: Apply verified Code19 delta
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/code19-delta/part* > /tmp/code19-delta.b64
          base64 -d /tmp/code19-delta.b64 > /tmp/code19-delta.tar.gz
          echo "56ac37a08fdb112a4a39689f5e10e3e7468dc4bf8d4999b3e52f39dcfb38cf27  /tmp/code19-delta.tar.gz" | sha256sum -c -
          tar -xzf /tmp/code19-delta.tar.gz -C .

      - name: Apply Code20 startup notification permission fix
        run: python .ci/code20-transform.py

      - name: Apply Code21 calendar and notification sound fixes
        run: python .ci/code21-transform.py

      - name: Verify Code21 release contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.innative.halkaarz'" android/app/build.gradle
          grep -q "versionCode 21" android/app/build.gradle
          grep -q "versionName '2.3.9'" android/app/build.gradle
          grep -q "targetSdk 36" android/app/build.gradle
          grep -q "v2.3.9 • Build 21" public/index.html
          grep -q "halka_arz_calendar_cache_v2" public/core/ipo-service.js
          grep -q "activeScope" public/core/parsers.js
          grep -q "market_rise_v1" android/app/src/main/java/com/innative/halkaarz/NotificationHelper.java
          grep -q "market_ceiling_coin_v1" android/app/src/main/java/com/innative/halkaarz/NotificationHelper.java
          grep -q "market_floor_v1" android/app/src/main/java/com/innative/halkaarz/NotificationHelper.java
          test -s android/app/src/main/res/raw/notification_rise.wav
          test -s android/app/src/main/res/raw/notification_ceiling_coin.wav
          test -s android/app/src/main/res/raw/notification_floor.wav
          python - <<'PY'
          import wave
          expected = {
              'notification_rise.wav': (0.50, 0.70),
              'notification_ceiling_coin.wav': (0.40, 0.56),
              'notification_floor.wav': (0.54, 0.72),
          }
          for name, (lo, hi) in expected.items():
              path = 'android/app/src/main/res/raw/' + name
              with wave.open(path, 'rb') as w:
                  duration = w.getnframes() / w.getframerate()
                  assert w.getnchannels() == 1 and w.getsampwidth() == 2 and lo <= duration <= hi, (name, duration)
                  print(name, round(duration, 3), 'sec')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run Code21 regression suite
        run: node --test test/parsers.test.js test/data-sources.test.js test/notification-rules.test.js test/code19-behavior.test.js test/settings-contract.test.js test/android-contract.test.js test/code21-behavior.test.js

      - name: Sync web assets into Android
        run: npm run android:sync

      - name: Re-run Code21 regression suite after sync
        run: node --test test/parsers.test.js test/data-sources.test.js test/notification-rules.test.js test/code19-behavior.test.js test/settings-contract.test.js test/android-contract.test.js test/code21-behavior.test.js

      - name: Verify synced Code21 assets
        shell: bash
        run: |
          set -euo pipefail
          grep -q "v2.3.9 • Build 21" android/app/src/main/assets/www/index.html
          grep -q "activeScope" android/app/src/main/assets/www/core/parsers.js
          grep -q "halka_arz_calendar_cache_v2" android/app/src/main/assets/www/core/ipo-service.js

      - name: Build unsigned Google Play AAB
        run: gradle -p android --no-daemon bundleRelease

      - name: Collect AAB
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab halka-arz-portfoyum-v2.3.9-code21-unsigned.aab
          sha256sum halka-arz-portfoyum-v2.3.9-code21-unsigned.aab > code21-aab-sha256.txt
          cat code21-aab-sha256.txt

      - name: Upload Code21 AAB
        uses: actions/upload-artifact@v4
        with:
          name: code21-play-aab-unsigned
          path: |
            halka-arz-portfoyum-v2.3.9-code21-unsigned.aab
            code21-aab-sha256.txt
          if-no-files-found: error
          retention-days: 30
