name: Build Code18 Android Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v2.3.6-code18

permissions:
  contents: read

jobs:
  build-code18:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified Code18 source delta
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/code18-delta/part* > /tmp/code18-delta.b64
          base64 -d /tmp/code18-delta.b64 > /tmp/code18-delta.tar.gz
          echo "fc7d28e1880c7872f3883d12b1352f7800d2f2c88963e26c66a7e862e73e5a42  /tmp/code18-delta.tar.gz" | sha256sum -c -
          tar -xzf /tmp/code18-delta.tar.gz -C .

      - name: Restore exact Code17 launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 -d .ci/code17-launcher.webp.b64 > android/app/src/main/res/drawable-nodpi/ic_launcher.webp
          echo "517298c9cecd73ee52262f826c13c96f877bfd5322b9b3ef7c98779ea733aa48  android/app/src/main/res/drawable-nodpi/ic_launcher.webp" | sha256sum -c -
          rm -f android/app/src/main/res/drawable/ic_launcher.xml

      - name: Verify release identity before build
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.innative.halkaarz'" android/app/build.gradle
          grep -q "versionCode 18" android/app/build.gradle
          grep -q "versionName '2.3.6'" android/app/build.gradle
          grep -q "compileSdk 36" android/app/build.gradle
          grep -q "targetSdk 36" android/app/build.gradle
          grep -q "applicationIdSuffix '.test'" android/app/build.gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run Code18 tests before sync
        run: npm test

      - name: Sync web assets into Android
        run: npm run android:sync

      - name: Run Code18 tests after sync
        run: npm test

      - name: Build test APK and unsigned Play AAB
        run: gradle -p android --no-daemon assembleDebug bundleRelease

      - name: Collect and validate outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/apk/debug/app-debug.apk halka-arz-portfoyum-v2.3.6-code18-test.apk
          cp android/app/build/outputs/bundle/release/app-release.aab halka-arz-portfoyum-v2.3.6-code18-unsigned.aab
          sha256sum halka-arz-portfoyum-v2.3.6-code18-test.apk halka-arz-portfoyum-v2.3.6-code18-unsigned.aab > code18-build-sha256.txt
          cat code18-build-sha256.txt

      - name: Upload Code18 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code18-android-artifacts
          path: |
            halka-arz-portfoyum-v2.3.6-code18-test.apk
            halka-arz-portfoyum-v2.3.6-code18-unsigned.aab
            code18-build-sha256.txt
          if-no-files-found: error
          retention-days: 30
