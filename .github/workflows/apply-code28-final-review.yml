name: Apply Code28 Final Review Patch

on:
  push:
    branches: [fix/code28-final-review-20260914]
    paths:
      - scripts/apply-code28-final-review.py
      - .github/workflows/apply-code28-final-review.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/code28-final-review-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Apply source patch and sync Android assets
        run: |
          python3 scripts/apply-code28-final-review.py
          npm run android:sync
          git diff --check
      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public android test
          git commit -m "fix: complete Code28 final review parity changes"
          git push origin HEAD:fix/code28-final-review-20260914
