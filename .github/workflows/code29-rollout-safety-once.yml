name: Code29 Rollout Safety Once

on:
  push:
    branches: [fix/code28-seven-issues-20260914]
    paths:
      - .github/workflows/code29-rollout-safety-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/code28-seven-issues-20260914
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Apply rollout safety
        run: node scripts/apply-code29-rollout-safety.mjs
      - name: Run regressions
        run: npm test
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Compile release Java
        run: gradle -p android --no-daemon compileReleaseJavaWithJavac
      - name: Commit rollout safety
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "canmuslu59"
          git config user.email "301077922+canmuslu59@users.noreply.github.com"
          git add android/app/src/main/java/com/innative/halkaarz/PushConfigSync.java backend/service.js
          git diff --cached --quiet && { echo 'No rollout changes'; exit 1; }
          git commit -m "fix: suppress legacy cloud market alerts on Code29"
          git push origin HEAD:fix/code28-seven-issues-20260914
