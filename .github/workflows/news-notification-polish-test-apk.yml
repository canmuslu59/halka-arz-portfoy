name: News Notification Polish Test APK

on:
  push:
    branches:
      - feature/news-notification-polish-20260921
    paths:
      - .github/workflows/news-notification-polish-test-apk.yml

permissions:
  contents: read

concurrency:
  group: news-notification-polish-test-apk
  cancel-in-progress: true

env:
  PUSH_BACKEND_URL: https://halka-arz-portfoy-push.grass-airboat.workers.dev

jobs:
  build-test-apk:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        shell: powershell
        run: npm ci

      - name: Run focused news and graph tests
        shell: powershell
        run: |
          node --test --test-concurrency=1 test/news-local-test-worker.test.js test/news-notifications.test.js test/news-notification-source-metadata.test.js test/news-notification-integration.test.js test/popular-finance-news-overlay.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete regression suite
        shell: powershell
        run: |
          node --test --test-concurrency=1 test/*.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check public/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sync Android base assets
        shell: powershell
        run: |
          npm run android:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply exact live Code32 experience
        shell: powershell
        run: |
          node scripts/apply-test-share-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-test-wallet-metrics-nav.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-test-portfolio-app-navigation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep fixed graph data and bottom dock behavior
        shell: powershell
        run: |
          node scripts/apply-performance-history-data-fix.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-fixed-bottom-dock-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check android/app/src/main/assets/www/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify generated test experience
        shell: powershell
        run: |
          $index = Get-Content -Raw android/app/src/main/assets/www/index.html
          $styles = Get-Content -Raw android/app/src/main/assets/www/styles.css
          $app = Get-Content -Raw android/app/src/main/assets/www/app.js
          $service = Get-Content -Raw android/app/src/main/assets/www/core/portfolio-service.js
          $helper = Get-Content -Raw android/app/src/main/java/com/innative/halkaarz/NotificationHelper.java
          $newsTestScheduler = Get-Content -Raw android/app/src/main/java/com/innative/halkaarz/NewsTestScheduler.java
          $newsTestWorker = Get-Content -Raw android/app/src/main/java/com/innative/halkaarz/NewsTestWorker.java
          $marketScheduler = Get-Content -Raw android/app/src/main/java/com/innative/halkaarz/BackgroundAlertScheduler.java
          $marketWorker = Get-Content -Raw android/app/src/main/java/com/innative/halkaarz/BackgroundAlertWorker.java
          $pushSync = Get-Content -Raw android/app/src/main/java/com/innative/halkaarz/PushConfigSync.java
          $pushMessaging = Get-Content -Raw android/app/src/main/java/com/innative/halkaarz/PushMessagingService.java

          foreach ($needle in @('id="holdingsTab"','id="performanceTab"','id="walletHomeTab"','id="marketsTab"','id="settingsTab"')) {
            if (-not $index.Contains($needle)) { throw "Navigation missing: $needle" }
          }
          foreach ($needle in @('Sermaye Girişi','Değer Değişimi','history-chart-legend')) {
            if (-not $index.Contains($needle)) { throw "Graph label missing: $needle" }
          }
          foreach ($needle in @('function historyFinite','function renderHistoryChartSummary','function historyRoundedRect','refreshBackgroundHistory({ force:true })')) {
            if (-not $app.Contains($needle)) { throw "Graph behavior missing: $needle" }
          }
          foreach ($needle in @('GENERIC_FINANCE_NEWS_TITLES','financeNewsIsArticle','financeNewsCleanTitle','loadPopularFinanceNews')) {
            if (-not $app.Contains($needle)) { throw "News UI quality behavior missing: $needle" }
          }
          foreach ($needle in @('downloadedHistory.length ? downloadedHistory : quoteHistory','Tam geçmiş fiyat kaynağı boş döndü')) {
            if (-not $service.Contains($needle)) { throw "History fallback missing: $needle" }
          }
          foreach ($needle in @('news_breaking_v1','news_digest_v1','Günde iki kez öne çıkan finans haberleri özeti')) {
            if (-not $helper.Contains($needle)) { throw "Native news notification support missing: $needle" }
          }
          foreach ($needle in @('BuildConfig.DEBUG','BuildConfig.APPLICATION_ID','endsWith(".graphtest")','PeriodicWorkRequest.Builder(NewsTestWorker.class, 15','MORNING_WORK','EVENING_WORK','delayUntil(now, 10, 0)','delayUntil(now, 19, 0)','setInitialDelay','ExistingWorkPolicy.REPLACE')) {
            if (-not $newsTestScheduler.Contains($needle)) { throw "Local news test scheduler missing: $needle" }
          }
          foreach ($needle in @('BREAKING_MAX_AGE_MINUTES = 90L','article:published_time','body.append("\n\n")','news_digest','news_breaking','LAST_RUN_AT','LAST_DIGEST_ATTEMPT_AT','LAST_DIGEST_DELIVERED','scheduleDailyTargets(app)')) {
            if (-not $newsTestWorker.Contains($needle)) { throw "Local news test worker behavior missing: $needle" }
          }
          foreach ($needle in @('newsTest','nextMorningTargetAt','nextEveningTargetAt')) {
            if (-not $helper.Contains($needle)) { throw "News diagnostic field missing: $needle" }
          }

          # Market notification path must remain identical to the proven live Code32 implementation.
          foreach ($needle in @('background_market_alerts_v2','background_alert_immediate_v2','ExistingWorkPolicy.REPLACE','ExistingPeriodicWorkPolicy.UPDATE')) {
            if (-not $marketScheduler.Contains($needle)) { throw "Live market scheduler behavior missing: $needle" }
          }
          foreach ($needle in @('query1.finance.yahoo.com/v8/finance/chart/','https://webservice.foreks.com/foreks-web-widget/singlepage/','https://www.oyakyatirim.com.tr/hisse-detay/','reference.ceilingPrice','reference.floorPrice','PortfolioAlertRules.sampledPercentages')) {
            if (-not $marketWorker.Contains($needle)) { throw "Live market worker behavior missing: $needle" }
          }
          foreach ($needle in @('marketReferenceProtocol','trustedMarketEnabled','/v1/installations','ensureSynced(context)')) {
            if (-not $pushSync.Contains($needle)) { throw "Live push registration behavior missing: $needle" }
          }
          if (-not $pushMessaging.Contains('NotificationHelper.show(this, message.getData())')) {
            throw 'FCM delivery path missing'
          }
          foreach ($forbidden in @('isolatedNewsTest','news_breaking".equals(kind)','news_digest".equals(kind)')) {
            if ($pushMessaging.Contains($forbidden)) { throw "News FCM suppression still present: $forbidden" }
          }
          if (-not $styles.Contains('grid-template-columns:repeat(5')) { throw 'Fixed five-column dock missing' }

      - name: Verify live Code32 market notification parity
        shell: powershell
        run: |
          $expected = @{
            'android/app/src/main/java/com/innative/halkaarz/BackgroundAlertScheduler.java' = '7d911722cdbd0f7fd1a96317752399c232a6e5e3'
            'android/app/src/main/java/com/innative/halkaarz/BackgroundAlertWorker.java' = '5474484163e63853e9b6639199cc92b9467f11ef'
            'android/app/src/main/java/com/innative/halkaarz/PushConfigSync.java' = '2636caca40f5eb5ed44bfb80bc2f9e8fe539f25b'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $bytes = [System.IO.File]::ReadAllBytes($entry.Key)
            $header = [System.Text.Encoding]::ASCII.GetBytes("blob $($bytes.Length)" + [char]0)
            $all = New-Object byte[] ($header.Length + $bytes.Length)
            [Array]::Copy($header, 0, $all, 0, $header.Length)
            [Array]::Copy($bytes, 0, $all, $header.Length, $bytes.Length)
            $sha1 = [System.Security.Cryptography.SHA1]::Create()
            try {
              $actual = ([BitConverter]::ToString($sha1.ComputeHash($all))).Replace('-', '').ToLowerInvariant()
            } finally {
              $sha1.Dispose()
            }
            if ($actual -ne $entry.Value) {
              throw "Live Code32 parity failed for $($entry.Key): expected $($entry.Value), got $actual"
            }
          }
          $manifest = Get-Content -Raw 'android/app/src/main/AndroidManifest.xml'
          foreach ($needle in @('android.permission.INTERNET','android.permission.ACCESS_NETWORK_STATE','android.permission.POST_NOTIFICATIONS','com.innative.halkaarz.PushMessagingService','com.google.firebase.MESSAGING_EVENT')) {
            if (-not $manifest.Contains($needle)) { throw "Required live manifest behavior missing after Android sync: $needle" }
          }
          $gradle = Get-Content -Raw 'android/app/build.gradle'
          foreach ($needle in @("applicationId 'com.innative.halkaarz'","targetSdk 36","implementation 'androidx.work:work-runtime:2.10.1'","implementation 'com.google.firebase:firebase-messaging:24.1.1'")) {
            if (-not $gradle.Contains($needle)) { throw "Required live Gradle behavior missing: $needle" }
          }
          if ($env:PUSH_BACKEND_URL -ne 'https://halka-arz-portfoy-push.grass-airboat.workers.dev') {
            throw "Test APK market push backend is not the proven live backend"
          }
          Write-Host 'Live Code32 market notification core and production push backend verified.'

      - name: Configure test build identity
        shell: powershell
        run: |
          $path = 'android/app/build.gradle'
          $text = Get-Content -Raw $path
          $versionCode = 33000 + [int]$env:GITHUB_RUN_NUMBER
          $text = [regex]::Replace($text, 'versionCode\s+\d+', "versionCode $versionCode", 1)
          $text = $text.Replace("applicationIdSuffix '.test'", "applicationIdSuffix '.graphtest'")
          $text = $text.Replace("versionNameSuffix '-test'", "versionNameSuffix '-news-graph-test'")
          $text = $text.Replace("resValue 'string', 'app_name', 'Hisse Portföyüm Test'", "resValue 'string', 'app_name', 'Hisse Portföyüm Haber Grafik Test'")
          [System.IO.File]::WriteAllText($path, $text, (New-Object System.Text.UTF8Encoding($false)))
          "TEST_VERSION_CODE=$versionCode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure verified graph-test Firebase client
        shell: powershell
        run: |
          $firebaseJson = '{"project_info":{"project_number":"181104463772","project_id":"halka-arz-portfoyum-d86ff","storage_bucket":"halka-arz-portfoyum-d86ff.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:181104463772:android:0079989b9d3c4ef85fcb9d","android_client_info":{"package_name":"com.innative.halkaarz.graphtest"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyByYlMz5g9cwzXUjfVFlLIM0A564z-fO88"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}'
          [System.IO.File]::WriteAllText('android/app/google-services.json', $firebaseJson, (New-Object System.Text.UTF8Encoding($false)))
          $config = Get-Content -Raw 'android/app/google-services.json' | ConvertFrom-Json
          $client = @($config.client) | Where-Object { $_.client_info.android_client_info.package_name -eq 'com.innative.halkaarz.graphtest' } | Select-Object -First 1
          if (-not $client) { throw 'Verified graph-test Firebase client missing' }

      - name: Configure Android SDK 36
        shell: powershell
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk -or -not (Test-Path $sdk)) {
            if (Test-Path 'C:\actions-runner\android-sdk') {
              $sdk = 'C:\actions-runner\android-sdk'
            } elseif ($env:ANDROID_HOME -and (Test-Path $env:ANDROID_HOME)) {
              $sdk = $env:ANDROID_HOME
            } else {
              throw 'Android SDK root not found'
            }
          }
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sdkmanager = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
          & $sdkmanager "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile and build debug APK
        shell: powershell
        run: |
          gradle -p android --no-daemon compileDebugJavaWithJavac
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gradle -p android --no-daemon assembleDebug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and verify APK
        shell: powershell
        run: |
          $src = 'android/app/build/outputs/apk/debug/app-debug.apk'
          if (-not (Test-Path $src)) { throw "APK not produced: $src" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $apk = 'dist/Hisse-Portfoyum-Haber-Local-Fallback-FIX.apk'
          Copy-Item $src $apk -Force

          $buildTools = Join-Path $env:ANDROID_HOME 'build-tools\36.0.0'
          & (Join-Path $buildTools 'apksigner.bat') verify --verbose --print-certs $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
          $badging = (& (Join-Path $buildTools 'aapt.exe') dump badging $apk | Out-String)
          if (-not $badging.Contains("package: name='com.innative.halkaarz.graphtest'")) { throw 'Unexpected APK package' }
          if (-not $badging.Contains("application-label:'Hisse Portföyüm Haber Grafik Test'")) { throw 'Unexpected APK label' }
          if (-not $badging.Contains("versionCode='$env:TEST_VERSION_CODE'")) { throw 'Unexpected APK versionCode' }
          $badging | Set-Content -Encoding utf8 'dist/APK-IDENTITY.txt'

          $sha = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Hisse-Portfoyum-Haber-Local-Fallback-FIX.apk" | Set-Content -Encoding ascii 'dist/SHA256SUMS.txt'
          @(
            "package=com.innative.halkaarz.graphtest",
            "versionCode=$env:TEST_VERSION_CODE",
            "pushBackend=$env:PUSH_BACKEND_URL",
            "graphLabels=Sermaye Girişi | Değer Değişimi",
            "marketPushBackend=production-live",
            "newsWorker=isolated local test worker",
            "liveMainChanged=false"
          ) | Set-Content -Encoding utf8 'dist/BUILD-INFO.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: news-notification-polish-test-apk
          path: |
            dist/Hisse-Portfoyum-Haber-Local-Fallback-FIX.apk
            dist/SHA256SUMS.txt
            dist/APK-IDENTITY.txt
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14

