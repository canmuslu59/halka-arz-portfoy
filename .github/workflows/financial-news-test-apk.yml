name: Financial News Test APK

on:
  push:
    branches: [feature/test-financial-news-20260917]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-financial-news-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUSH_BACKEND_URL: https://halka-arz-portfoy-push.grass-airboat.workers.dev
      NEWS_BACKEND_URL: https://halka-arz-portfoy-news-test.grass-airboat.workers.dev
      AOSP_BUILD_COMMIT: 897e2ff8232b9f7a96493855e57f7a01f999109e
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: Verify focused financial news regressions
        run: |
          node --test \
            test/news-sources.test.js \
            test/news-store.test.js \
            test/news-worker.test.js \
            test/financial-news-overlay.test.js \
            test/android-financial-news-notification.test.js \
            test/repeated-purchase-and-add-sheet-regression.test.js \
            test/portfolio-app-navigation-overlay.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Deploy isolated financial news test worker
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'CLOUDFLARE_API_TOKEN=missing'; exit 2; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo 'CLOUDFLARE_ACCOUNT_ID=missing'; exit 2; }
          grep -F '"name": "halka-arz-portfoy-news-test"' wrangler-news-test.jsonc
          grep -F '"main": "cloudflare/news-worker.js"' wrangler-news-test.jsonc
          ! grep -F 'halka-arz-portfoy-push' wrangler-news-test.jsonc
          npx -y wrangler@4.131.1 deploy --config wrangler-news-test.jsonc

      - name: Verify live financial news test worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error "$NEWS_BACKEND_URL/api/health" -o /tmp/news-health.json; then
              break
            fi
            sleep 2
          done
          node - <<'NODE'
          const health = require('/tmp/news-health.json');
          if (!health.ok || health.service !== 'financial-news-test') process.exit(1);
          console.log('News worker health OK');
          NODE
          curl --fail --silent --show-error "$NEWS_BACKEND_URL/v1/news?limit=5" -o /tmp/news-feed.json
          node - <<'NODE'
          const feed = require('/tmp/news-feed.json');
          if (!Array.isArray(feed.items) || feed.items.length < 1) {
            console.error(feed);
            process.exit(1);
          }
          for (const item of feed.items) {
            if (!item.id || !item.title || !item.source || !item.category || !item.url) process.exit(1);
          }
          console.log(`Live news feed OK: ${feed.items.length} items`);
          NODE

      - name: Sync Android assets
        shell: bash
        run: |
          set -euo pipefail
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --exit-code -- android/app/src/main/assets/www
          git diff --check

      - name: Apply isolated test overlays and native news patch
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-test-share-ui.mjs
          node scripts/apply-test-wallet-metrics-nav.mjs
          node scripts/apply-test-portfolio-app-navigation.mjs
          node scripts/apply-test-financial-news-native.mjs
          node --check android/app/src/main/assets/www/app.js

          grep -F '>Haberler</b>' android/app/src/main/assets/www/index.html
          grep -F '<h2>Haberler</h2>' android/app/src/main/assets/www/index.html
          grep -F 'id="newsFilters"' android/app/src/main/assets/www/index.html
          grep -F 'id="newsList"' android/app/src/main/assets/www/index.html
          ! grep -F '>Piyasalar</b>' android/app/src/main/assets/www/index.html
          ! grep -F 'id="marketSummary"' android/app/src/main/assets/www/index.html
          ! grep -F 'id="calendarList"' android/app/src/main/assets/www/index.html
          grep -F 'financial_news_username_v1' android/app/src/main/assets/www/app.js
          grep -F 'financial_news_install_id_v1' android/app/src/main/assets/www/app.js
          grep -F 'Yorum gönderildi.' android/app/src/main/assets/www/app.js
          grep -F "$NEWS_BACKEND_URL" android/app/src/main/assets/www/app.js

          grep -F "buildConfigField 'String', 'NEWS_BACKEND_URL'" android/app/build.gradle
          grep -F 'financial_breaking_seen_v1' android/app/src/main/java/com/innative/halkaarz/BackgroundAlertWorker.java
          grep -F 'financial_breaking_v1' android/app/src/main/java/com/innative/halkaarz/NotificationHelper.java
          grep -F 'boolean newsEnabled = BuildConfig.NEWS_BACKEND_URL' android/app/src/main/java/com/innative/halkaarz/BackgroundAlertScheduler.java

          test -s android/app/src/main/assets/www/launcher-icon.webp
          cmp android/app/src/main/res/drawable-nodpi/ic_launcher.webp android/app/src/main/assets/www/launcher-icon.webp
          grep -F 'id="portfolioHeroCard"' android/app/src/main/assets/www/index.html
          grep -F '>Cüzdan</span>' android/app/src/main/assets/www/index.html
          grep -F 'id="performanceView"' android/app/src/main/assets/www/index.html
          grep -F 'id="comparisonCard"' android/app/src/main/assets/www/index.html
          grep -F 'id="sharePortfolioBtn"' android/app/src/main/assets/www/index.html

      - name: Configure isolated test release identity
        shell: bash
        run: |
          set -euo pipefail
          TEST_VERSION_CODE=$((30000 + GITHUB_RUN_NUMBER))
          echo "TEST_VERSION_CODE=$TEST_VERSION_CODE" >> "$GITHUB_ENV"
          python3 - "$TEST_VERSION_CODE" <<'PY'
          from pathlib import Path
          import re
          import sys

          version_code = sys.argv[1]
          path = Path('android/app/build.gradle')
          text = path.read_text()
          text, n = re.subn(r'versionCode\s+\d+', f'versionCode {version_code}', text, count=1)
          if n != 1:
              raise SystemExit('versionCode replacement failed')
          needle = """        release {\n            minifyEnabled false\n"""
          replacement = """        release {\n            applicationIdSuffix '.test'\n            versionNameSuffix '-test'\n            resValue 'string', 'app_name', 'Halka Arz Portföyüm Test'\n            minifyEnabled false\n"""
          if needle not in text:
              raise SystemExit('release block shape changed')
          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
          grep -F "applicationIdSuffix '.test'" android/app/build.gradle
          grep -F "versionNameSuffix '-test'" android/app/build.gradle
          grep -F "versionCode $TEST_VERSION_CODE" android/app/build.gradle

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Compile and build isolated release APK
        run: |
          gradle -p android --no-daemon compileReleaseJavaWithJavac
          gradle -p android --no-daemon assembleRelease

      - name: Sign with pinned AOSP public test key
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/aosp-mirror/platform_build/${AOSP_BUILD_COMMIT}/target/product/security"
          curl -fsSL "$BASE/testkey.pk8" -o /tmp/aosp-testkey.pk8
          curl -fsSL "$BASE/testkey.x509.pem" -o /tmp/aosp-testkey.x509.pem
          BUILD_TOOLS=/usr/local/lib/android/sdk/build-tools/36.0.0
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=/tmp/financial-news-test-aligned.apk
          SIGNED=/tmp/financial-news-test-signed.apk
          test -s "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --key /tmp/aosp-testkey.pk8 \
            --cert /tmp/aosp-testkey.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$ALIGNED"
          mkdir -p dist
          cp "$SIGNED" dist/halka-arz-portfoyum-test-financial-news.apk

      - name: Verify APK identity, signature and Haberler build
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/halka-arz-portfoyum-test-financial-news.apk
          BUILD_TOOLS=/usr/local/lib/android/sdk/build-tools/36.0.0
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/apk-signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee dist/apk-badging.txt
          grep -F "package: name='com.innative.halkaarz.test' versionCode='${TEST_VERSION_CODE}' versionName='2.4.6-test'" dist/apk-badging.txt
          grep -F "application-label:'Halka Arz Portföyüm Test'" dist/apk-badging.txt
          grep -F 'Signer #1 certificate SHA-256 digest: a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc' dist/apk-signature.txt

          for backend in "$PUSH_BACKEND_URL" "$NEWS_BACKEND_URL"; do
            found=0
            while IFS= read -r dex; do
              if unzip -p "$APK" "$dex" | strings | grep -Fq "$backend"; then
                found=1
                break
              fi
            done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')
            test "$found" -eq 1
          done

          unzip -p "$APK" assets/www/index.html | grep -F '>Haberler</b>'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="newsFilters"'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="newsList"'
          ! unzip -p "$APK" assets/www/index.html | grep -F '>Piyasalar</b>'
          ! unzip -p "$APK" assets/www/index.html | grep -F 'id="marketSummary"'
          unzip -p "$APK" assets/www/app.js | grep -F 'financial_news_username_v1'
          unzip -p "$APK" assets/www/app.js | grep -F 'Yorum gönderildi.'
          unzip -p "$APK" assets/www/app.js | grep -F "$NEWS_BACKEND_URL"
          unzip -p "$APK" assets/www/index.html | grep -F 'id="portfolioHeroCard"'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="comparisonCard"'
          unzip -p "$APK" assets/www/index.html | grep -F 'id="sharePortfolioBtn"'

          sha256sum "$APK" | tee dist/SHA256SUMS.txt
          {
            echo "package=com.innative.halkaarz.test"
            echo "versionName=2.4.6-test"
            echo "versionCode=${TEST_VERSION_CODE}"
            echo "sourceCommit=${GITHUB_SHA}"
            echo "pushBackend=${PUSH_BACKEND_URL}"
            echo "newsBackend=${NEWS_BACKEND_URL}"
            echo "signing=AOSP public testkey pinned at ${AOSP_BUILD_COMMIT}"
            echo "firebase=not configured for separate test package; financial breaking uses WorkManager polling"
            echo "financialNews=enabled"
            echo "sharedComments=enabled"
          } > dist/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: financial-news-test-apk
          path: |
            dist/halka-arz-portfoyum-test-financial-news.apk
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
            dist/apk-signature.txt
            dist/apk-badging.txt
          if-no-files-found: error
          retention-days: 14
