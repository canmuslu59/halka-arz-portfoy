name: Code28 Review Cleanup Once

on:
  push:
    branches: [fix/code28-seven-issues-20260914]
    paths:
      - .github/workflows/code28-review-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Remove obsolete review-access UI and sync Android asset
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/app.js';
          let source = fs.readFileSync(path, 'utf8');

          const cardPattern = /function proAccessCard\(access\) \{[\s\S]*?\n\}\n\nfunction proLockedGate/;
          if (!cardPattern.test(source)) throw new Error('proAccessCard block not found');
          source = source.replace(cardPattern, `function proAccessCard(access) {
            const label = access.status === 'trial'
              ? '7 günlük ücretsiz deneme'
              : access.status === 'not_started'
                ? '7 günlük ücretsiz deneme'
                : 'Deneme sona erdi';
            const detail = access.status === 'trial'
              ? \`Kalan süre: \${durationText(access.remainingMs)}\`
              : access.status === 'not_started'
                ? 'Deneme henüz başlatılmadı.'
                : 'Gelişmiş özellikleri kullanmaya devam etmek için Pro gerekecek.';
            return \`
              <section class="pro-access-card \${access.hasAccess ? 'active' : 'pro-locked'}">
                <div><span class="eyebrow">PRO ERİŞİM</span><strong>\${label}</strong><p>\${detail}</p></div>
                \${access.hasAccess ? '<span class="pro-access-dot">Aktif</span>' : '<span class="pro-access-dot inactive">Kilitli</span>'}
              </section>
            \`;
          }

          function proLockedGate`);

          const gatePattern = /function proLockedGate\(access\) \{[\s\S]*?\n\}\n\nfunction bindProGateControls/;
          if (!gatePattern.test(source)) throw new Error('proLockedGate block not found');
          source = source.replace(gatePattern, `function proLockedGate(access) {
            const trialAction = access.status === 'not_started'
              ? '<button id="proTrialStart" class="primary-btn" type="button">7 günlük denemeyi başlat</button>'
              : '<button class="primary-btn pro-buy-disabled" type="button" disabled>Pro’ya geç</button>';
            return \`
              <section class="pro-locked pro-gate">
                <span class="pro-lock-icon">✦</span><h3>Gelişmiş özellikler kilitli</h3>
                \${trialAction}
              </section>\`;
          }

          function bindProGateControls`);

          const bindPattern = /function bindProGateControls\(\) \{[\s\S]*?\n\}\n\nfunction betaControls/;
          if (!bindPattern.test(source)) throw new Error('bindProGateControls block not found');
          source = source.replace(bindPattern, `function bindProGateControls() {
            $('#proTrialStart')?.addEventListener('click', () => {
              state.proAccess = proAccess.enterAdvanced();
              renderProView();
            });
          }

          function betaControls`);

          for (const forbidden of ['enableReviewAccess', 'reviewAccessForm', 'reviewAccessCode', 'Google Play inceleme erişimi', 'GOOGLE PLAY İNCELEME']) {
            if (source.includes(forbidden)) throw new Error(`review-access remnant remains: ${forbidden}`);
          }
          if (/status\s*===\s*['"]review['"]/.test(source)) throw new Error('review status branch remains');

          fs.writeFileSync(path, source);
          fs.copyFileSync(path, 'android/app/src/main/assets/www/app.js');
          NODE
          git diff --check
          git diff --exit-code -- public/app.js android/app/src/main/assets/www/app.js && { echo 'Expected cleanup diff was empty'; exit 1; } || true
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js android/app/src/main/assets/www/app.js
          git commit -m "fix: remove obsolete review-access UI remnants"
          git push
