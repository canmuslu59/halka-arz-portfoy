name: Temporary v2.3.1 verified build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v231-temp-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout verified v2.3 base payload
        uses: actions/checkout@v4
        with:
          ref: feature/v2.3.0-real-code11
          path: base

      - name: Checkout verified v2.3.1 transform
        uses: actions/checkout@v4
        with:
          ref: feature/v2.3.1-code13
          path: delta

      - name: Reconstruct exact code12 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work exact-source
          for n in 000 001 002 003 004 005 006 007; do test -f "base/.ci/android.part${n}"; done
          cat base/.ci/android.part000 base/.ci/android.part001 base/.ci/android.part002 base/.ci/android.part003 base/.ci/android.part004 base/.ci/android.part005 base/.ci/android.part006 base/.ci/android.part007 > work/android.b64
          base64 --decode work/android.b64 > work/android.tar.xz
          actual="$(sha256sum work/android.tar.xz | awk '{print $1}')"
          echo "Base payload SHA256: $actual"
          test "$actual" = "ac522f12db863f536390c82265be62cb9121ecc611c8af66700d4d0686d21ee8"
          tar -xJf work/android.tar.xz -C exact-source
          python - <<'PY'
          from pathlib import Path
          root = Path('exact-source/android/build.gradle')
          root.write_text(root.read_text().replace("id 'com.android.application' version '8.7.3' apply false", "id 'com.android.application' version '8.10.1' apply false"))
          app = Path('exact-source/android/app/build.gradle')
          s = app.read_text().replace("implementation 'androidx.core:core:1.19.0'", "implementation 'androidx.core:core:1.15.0'")
          s = s.replace("    implementation platform('com.google.firebase:firebase-bom:34.18.0')\n    implementation 'com.google.firebase:firebase-messaging'", "    implementation 'com.google.firebase:firebase-messaging:24.1.1'")
          app.write_text(s)
          main = Path('exact-source/android/app/src/main/java/com/innative/halkaarz/MainActivity.java')
          main.write_text(main.read_text().replace('WindowCompat.enableEdgeToEdge(this);', 'WindowCompat.setDecorFitsSystemWindows(getWindow(), false);'))
          PY
          grep -q "versionCode 12" exact-source/android/app/build.gradle
          grep -q "versionName '2.3.0'" exact-source/android/app/build.gradle

      - name: Transform to tested code13 source
        shell: bash
        run: |
          set -euo pipefail
          python delta/.ci/v231-transform.py exact-source
          printf '%s  %s\n' \
            429d2dc7d81c48cd051c02b3bb3419d749964232d0eb7f64665007d1dd6b4f5a exact-source/android/app/build.gradle \
            22a0b75012ab7555a6674b3a9fff1f2ed6ccb82859afae6dfd2684b92084d91b exact-source/android/app/src/main/java/com/innative/halkaarz/MainActivity.java \
            08a69d375c7bfe5227d1ea10fb0635d93841af594ba3034dee29b8bbd77c618f exact-source/android/app/src/main/assets/www/app.js \
            fe67a7771180450f50eaa49fe0ad6097aab9d29369dd29427b9fae29f5fb4ae0 exact-source/android/app/src/main/assets/www/index.html \
            0fe2b090661c160798181dae0de96d5f3342ae29c53f08a73f4bfee241a03bf6 exact-source/android/app/src/main/assets/www/styles.css \
            > work/TARGET_SHA256SUMS.txt
          sha256sum -c work/TARGET_SHA256SUMS.txt
          grep -q "applicationId 'com.innative.halkaarz'" exact-source/android/app/build.gradle
          grep -q "versionCode 13" exact-source/android/app/build.gradle
          grep -q "versionName '2.3.1'" exact-source/android/app/build.gradle
          grep -q "httpGetAsync" exact-source/android/app/src/main/java/com/innative/halkaarz/MainActivity.java
          ! grep -q "public String httpGet" exact-source/android/app/src/main/java/com/innative/halkaarz/MainActivity.java
          grep -q -- "--android-safe-bottom" exact-source/android/app/src/main/assets/www/styles.css
          grep -q 'id="themeToggle"' exact-source/android/app/src/main/assets/www/index.html
          ! grep -q 'id="themeSetting"' exact-source/android/app/src/main/assets/www/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile APK and AAB
        working-directory: exact-source
        run: gradle -p android --no-daemon clean assembleDebug assembleRelease bundleRelease

      - name: Collect outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output
          cp exact-source/android/app/build/outputs/apk/debug/app-debug.apk ci-output/halka-arz-portfoyum-v2.3.1-code13-debug.apk
          RELEASE_APK="$(find exact-source/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          RELEASE_AAB="$(find exact-source/android/app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$RELEASE_APK"
          test -n "$RELEASE_AAB"
          cp "$RELEASE_APK" ci-output/halka-arz-portfoyum-v2.3.1-code13-unsigned.apk
          cp "$RELEASE_AAB" ci-output/halka-arz-portfoyum-v2.3.1-code13-unsigned.aab
          sha256sum ci-output/* | tee ci-output/SHA256SUMS.txt

      - name: Upload compiled outputs
        uses: actions/upload-artifact@v4
        with:
          name: v231-code13-compiled
          path: ci-output/
          if-no-files-found: error
          retention-days: 14
