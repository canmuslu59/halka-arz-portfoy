name: Test Firebase Secret Probe

on:
  push:
    branches: [feature/test-liked-rollback-20260917]
    paths:
      - '.github/workflows/test-firebase-secret-probe.yml'
      - 'test/test-firebase-push-config.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report configured Firebase secret names only
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ADMIN_JSON: ${{ secrets.FIREBASE_ADMIN_JSON }}
          FIREBASE_ADMIN_SDK_JSON: ${{ secrets.FIREBASE_ADMIN_SDK_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_TEST_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_TEST_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for key in FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_ADMIN_JSON FIREBASE_ADMIN_SDK_JSON GOOGLE_SERVICES_JSON_BASE64 GOOGLE_SERVICES_TEST_JSON_BASE64; do
            if [ -n "${!key:-}" ]; then
              echo "$key=present"
            else
              echo "$key=missing"
            fi
          done
