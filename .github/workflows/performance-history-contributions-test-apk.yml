name: Performance History Contributions Test APK

on:
  push:
    branches:
      - feature/performance-history-contributions-20260921
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-history-contributions-test-apk
  cancel-in-progress: true

env:
  PUSH_BACKEND_URL: https://halka-arz-portfoy-push.grass-airboat.workers.dev

jobs:
  build-test-apk:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        shell: powershell
        run: npm ci

      - name: Run regression suite
        shell: powershell
        run: |
          node --test --test-concurrency=1 test/*.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check public/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sync Android base assets
        shell: powershell
        run: |
          npm run android:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply exact live Code32 experience
        shell: powershell
        run: |
          node scripts/apply-test-share-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-test-wallet-metrics-nav.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/apply-test-portfolio-app-navigation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Guarantee post-purchase portfolio history
        shell: powershell
        run: |
          node scripts/apply-performance-history-data-fix.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check android/app/src/main/assets/www/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check android/app/src/main/assets/www/core/portfolio-service.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep fixed responsive five-item dock
        shell: powershell
        run: |
          node scripts/apply-fixed-bottom-dock-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check android/app/src/main/assets/www/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify chart and navigation output
        shell: powershell
        run: |
          $index = Get-Content -Raw android/app/src/main/assets/www/index.html
          $styles = Get-Content -Raw android/app/src/main/assets/www/styles.css
          $app = Get-Content -Raw android/app/src/main/assets/www/app.js
          $domain = Get-Content -Raw android/app/src/main/assets/www/core/domain.js
          $service = Get-Content -Raw android/app/src/main/assets/www/core/portfolio-service.js

          foreach ($needle in @('id="holdingsTab"','id="performanceTab"','id="walletHomeTab"','id="marketsTab"','id="settingsTab"')) {
            if (-not $index.Contains($needle)) { throw "Five-item navigation missing: $needle" }
          }
          foreach ($needle in @('id="historyTotalValue"','id="historyExternalValue"','id="historyNaturalValue"','history-chart-legend')) {
            if (-not $index.Contains($needle)) { throw "History chart UI missing: $needle" }
          }
          foreach ($needle in @('history-summary','history-chart-wrap','bottom:0!important','grid-template-columns:repeat(5')) {
            if (-not $styles.Contains($needle)) { throw "Required style missing: $needle" }
          }
          foreach ($needle in @('historyFinite','Dışarıdan eklenen','Doğal gelişim','capitalAdded','historyCompactMoney','refreshBackgroundHistory({ force:true })')) {
            if (-not $app.Contains($needle)) { throw "History chart behavior missing: $needle" }
          }
          foreach ($needle in @('downloadedHistory.length ? downloadedHistory : quoteHistory','fetchedLocalDate:downloadedHistory.length ? localDate : null','Tam geçmiş fiyat kaynağı boş döndü')) {
            if (-not $service.Contains($needle)) { throw "History fallback missing: $needle" }
          }
          foreach ($needle in @('capitalAdded','calculatePurchaseLedger','totalPurchaseCost')) {
            if (-not $domain.Contains($needle)) { throw "Contribution history model missing: $needle" }
          }

      - name: Isolate graph test package
        shell: powershell
        run: |
          $path = 'android/app/build.gradle'
          $text = Get-Content -Raw $path
          $text = $text.Replace("applicationIdSuffix '.test'", "applicationIdSuffix '.graphtest'")
          $text = $text.Replace("versionNameSuffix '-test'", "versionNameSuffix '-graph-test'")
          $text = $text.Replace("resValue 'string', 'app_name', 'Hisse Portföyüm Test'", "resValue 'string', 'app_name', 'Hisse Portföyüm Grafik Test'")
          [System.IO.File]::WriteAllText($path, $text, (New-Object System.Text.UTF8Encoding($false)))

      - name: Configure test Firebase client
        shell: powershell
        run: |
          $firebaseJson = '{"project_info":{"project_number":"181104463772","project_id":"halka-arz-portfoyum-d86ff","storage_bucket":"halka-arz-portfoyum-d86ff.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:181104463772:android:0079989b9d3c4ef85fcb9d","android_client_info":{"package_name":"com.innative.halkaarz.graphtest"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyByYlMz5g9cwzXUjfVFlLIM0A564z-fO88"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}'
          [System.IO.File]::WriteAllText('android/app/google-services.json', $firebaseJson, (New-Object System.Text.UTF8Encoding($false)))

      - name: Configure Android SDK 36
        shell: powershell
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk -or -not (Test-Path $sdk)) {
            if (Test-Path 'C:\actions-runner\android-sdk') {
              $sdk = 'C:\actions-runner\android-sdk'
            } elseif ($env:ANDROID_HOME -and (Test-Path $env:ANDROID_HOME)) {
              $sdk = $env:ANDROID_HOME
            } else {
              throw 'Android SDK root not found'
            }
          }
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sdkmanager = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
          & $sdkmanager "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Compile debug Java
        shell: powershell
        run: |
          gradle -p android --no-daemon compileDebugJavaWithJavac
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installable graph test APK
        shell: powershell
        run: |
          gradle -p android --no-daemon assembleDebug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package APK
        shell: powershell
        run: |
          $src = 'android/app/build/outputs/apk/debug/app-debug.apk'
          if (-not (Test-Path $src)) { throw "APK not produced: $src" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $src 'dist/Hisse-Portfoyum-Grafik-Test.apk' -Force
          $sha = (Get-FileHash 'dist/Hisse-Portfoyum-Grafik-Test.apk' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Hisse-Portfoyum-Grafik-Test.apk" | Set-Content -Encoding ascii 'dist/SHA256SUMS.txt'

      - name: Verify APK signature and identity
        shell: powershell
        run: |
          $buildTools = Join-Path $env:ANDROID_HOME 'build-tools\36.0.0'
          & (Join-Path $buildTools 'apksigner.bat') verify --verbose --print-certs 'dist/Hisse-Portfoyum-Grafik-Test.apk'
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
          $badging = (& (Join-Path $buildTools 'aapt.exe') dump badging 'dist/Hisse-Portfoyum-Grafik-Test.apk' | Out-String)
          if (-not $badging.Contains("package: name='com.innative.halkaarz.graphtest'")) { throw 'Unexpected APK package' }
          if (-not $badging.Contains("application-label:'Hisse Portföyüm Grafik Test'")) { throw 'Unexpected APK label' }
          $badging | Set-Content -Encoding utf8 'dist/APK-IDENTITY.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: performance-history-contributions-test-apk
          path: |
            dist/Hisse-Portfoyum-Grafik-Test.apk
            dist/SHA256SUMS.txt
            dist/APK-IDENTITY.txt
          if-no-files-found: error
          retention-days: 14
