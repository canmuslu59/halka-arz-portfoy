name: Code28 Follow-up Fix Once

on:
  push:
    branches: [fix/code28-seven-issues-20260914]
    paths:
      - .github/workflows/code28-followup-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/code28-seven-issues-20260914
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Apply verified fixes
        run: node scripts/code28-followup-four-fixes.mjs
      - name: Sync packaged Android web assets
        run: node scripts/sync-android-assets.mjs
      - name: Commit production fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "canmuslu59"
          git config user.email "301077922+canmuslu59@users.noreply.github.com"
          git add android/app/src/main/java/com/innative/halkaarz/MainActivity.java public/app.js public/core/domain.js public/core/parsers.js android/app/src/main/assets/www
          git diff --cached --quiet && { echo 'No patch changes'; exit 1; }
          git commit -m "fix: resolve four Code28 follow-up regressions"
          git push origin HEAD:fix/code28-seven-issues-20260914
