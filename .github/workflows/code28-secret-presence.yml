name: Code28 Secret Presence
on:
  push:
    branches: [fix/code28-signed-portfolio-alerts-20260914]
    paths:
      - '.github/workflows/code28-secret-presence.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report configured secret names only
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ADMIN_JSON: ${{ secrets.FIREBASE_ADMIN_JSON }}
          FIREBASE_ADMIN_SDK_JSON: ${{ secrets.FIREBASE_ADMIN_SDK_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          for key in FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_ADMIN_JSON FIREBASE_ADMIN_SDK_JSON GOOGLE_SERVICES_JSON_BASE64 PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_KEY_ALIAS PLAY_UPLOAD_KEYSTORE_PASSWORD PLAY_UPLOAD_KEY_PASSWORD; do
            if [ -n "${!key:-}" ]; then
              echo "$key=present"
            else
              echo "$key=missing"
            fi
          done
