name: Diagnose MainActivity Deprecation

on:
  push:
    branches:
      - release/v2.4.0-code22

permissions:
  contents: write

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[diagnose-mainactivity-deprecation]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Compile with javac deprecation lint
        run: |
          cat >/tmp/deprecation.init.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile
          allprojects {
            tasks.withType(JavaCompile).configureEach {
              options.compilerArgs += ['-Xlint:deprecation']
            }
          }
          EOF
          gradle -p android --no-daemon --rerun-tasks --init-script /tmp/deprecation.init.gradle compileReleaseJavaWithJavac 2>&1 | tee /tmp/deprecation.log
          echo '--- MAINACTIVITY DEPRECATION LINES ---'
          grep -n -E 'MainActivity\.java:|\[deprecation\]' /tmp/deprecation.log || true
      - name: Remove one-shot diagnostic files
        if: always()
        run: |
          rm -f .github/workflows/diagnose-mainactivity-deprecation.yml .ci/mainactivity-deprecation-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/diagnose-mainactivity-deprecation.yml .ci/mainactivity-deprecation-trigger
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-shot deprecation diagnostic"
            git push origin HEAD:release/v2.4.0-code22
          fi
