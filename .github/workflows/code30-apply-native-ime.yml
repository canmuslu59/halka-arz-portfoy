name: Retire one-time Code30 source workflow

on:
  push:
    branches: [release/v2.4.7-code30]
    paths:
      - .github/workflows/code30-apply-native-ime.yml

permissions:
  contents: write

jobs:
  retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/code30-apply-native-ime.yml
          git commit -m 'chore: remove one-time Code30 source workflow'
          git push origin HEAD:release/v2.4.7-code30
