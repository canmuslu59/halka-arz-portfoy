name: Build Google Play AAB Bootstrap

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-play-bootstrap.yml'

permissions:
  contents: read

jobs:
  build-play-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify existing app
        run: npm test

      - name: Prepare Google Play v2.1.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.10.1' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.innative.halkaarz'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.innative.halkaarz'
                  minSdk 26
                  targetSdk 36
                  versionCode 8
                  versionName '2.1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              signingConfigs {
                  stableDebug {
                      storeFile file('halkaarz-debug.keystore')
                      storePassword 'android'
                      keyAlias 'halkaarz'
                      keyPassword 'android'
                  }
                  release {
                      def releaseKeystorePath = System.getenv('PLAY_UPLOAD_KEYSTORE_PATH')
                      if (releaseKeystorePath) {
                          storeFile file(releaseKeystorePath)
                          storePassword System.getenv('PLAY_UPLOAD_KEYSTORE_PASSWORD')
                          keyAlias System.getenv('PLAY_UPLOAD_KEY_ALIAS')
                          keyPassword System.getenv('PLAY_UPLOAD_KEY_PASSWORD')
                      }
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.stableDebug
                  }
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          s=s.replace('v2.0.5','v2.1.0')
          if 'legal-footer' not in s:
              s=s.replace('  </main>', '''    <footer class="legal-footer">\n      <p>Yatırım tavsiyesi değildir. Piyasa fiyatları ücretsiz veri kaynaklarından gelir ve gecikmeli olabilir.</p>\n      <a href="./privacy.html">Gizlilik Politikası</a>\n    </footer>\n  </main>''')
          p.write_text(s)

          css=Path('public/styles.css')
          c=css.read_text()
          if '.legal-footer{' not in c:
              c += '''\n\n/* Google Play disclosure */\n.legal-footer{margin:18px 4px 92px;padding:14px 4px 0;border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;color:#69768c;font-size:10px;line-height:1.5}\n.legal-footer p{margin:0;max-width:680px}.legal-footer a{color:#91aef0;text-decoration:none;white-space:nowrap}.legal-footer a:active{opacity:.72}\n@media(max-width:430px){.legal-footer{display:grid;gap:8px;margin-bottom:84px}.legal-footer a{width:max-content}}\n'''
          css.write_text(c)
          PY

          cat > public/privacy.html <<'EOF'
          <!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>Gizlilik Politikası · Halka Arz Portföyüm</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e9eef8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.65}.wrap{width:min(100% - 32px,760px);margin:0 auto;padding:32px 0 56px}a{color:#91aef0}h1{font-size:28px;margin:0 0 6px}h2{font-size:17px;margin-top:28px}.muted{color:#8995a9;font-size:13px}.card{margin-top:20px;padding:18px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:#111a2c}li{margin:7px 0}.back{display:inline-block;margin-bottom:20px;text-decoration:none}</style></head><body><main class="wrap"><a class="back" href="./index.html">← Uygulamaya dön</a><h1>Gizlilik Politikası</h1><p class="muted">Halka Arz Portföyüm · Son güncelleme: 2 Eylül 2026</p><div class="card"><strong>Kısa özet:</strong> Portföyünüz, lot bilgileriniz ve satış kayıtlarınız cihazınızda tutulur. Uygulama reklam veya analitik SDK kullanmaz. Piyasa ve halka arz verilerini getirmek için yalnızca gerekli hisse kodları üçüncü taraf veri sağlayıcılarına HTTPS üzerinden gönderilebilir.</div><h2>1. Uygulamanın işlediği bilgiler</h2><p>Eklediğiniz hisse kodları, lot miktarları, satış kayıtları, manuel düzeltmeler ve uygulamanın oluşturduğu portföy hesapları cihazınızdaki yerel uygulama depolamasında saklanır. Bu portföy verileri geliştiricinin sunucusuna aktarılmaz.</p><h2>2. Üçüncü taraf veri sağlayıcıları</h2><p>Fiyat, şirket, sektör ve halka arz bilgilerinin alınabilmesi için uygulama ilgili hisse kodunu veya veri sorgusunu üçüncü taraf piyasa/veri sayfalarına iletebilir. Mevcut sürüm Yahoo Finance, Ahlatcı Yatırım ve Fintables gibi açık veri kaynaklarına HTTPS bağlantıları kurabilir.</p><h2>3. Reklam, analitik ve hesap</h2><ul><li>Reklam SDK'sı yoktur.</li><li>Analitik/izleme SDK'sı yoktur.</li><li>Kullanıcı hesabı yoktur.</li><li>Konum, rehber, fotoğraf, mikrofon veya kamera izni istenmez.</li></ul><h2>4. Veri saklama ve silme</h2><p>Portföy bilgileri cihazınızda saklanır. Uygulamadaki kayıtları silerek veya uygulamayı kaldırarak yerel verileri silebilirsiniz. Android yedekleme özelliği kapalıdır.</p><h2>5. Güvenlik</h2><p>Dış veri talepleri HTTPS üzerinden yapılır ve açık metin HTTP trafiğine izin verilmez.</p><h2>6. Finansal bilgi ve sorumluluk reddi</h2><p>Uygulama yalnızca kişisel portföy takibi ve bilgilendirme amacı taşır. Emir iletmez, yatırım hesabına bağlanmaz ve yatırım tavsiyesi vermez. Piyasa verileri gecikmeli, eksik veya hatalı olabilir.</p><h2>7. Çocukların gizliliği</h2><p>Uygulama çocuklara yönelik tasarlanmamıştır.</p><h2>8. İletişim</h2><p>Gizlilik talepleri için Google Play mağaza kaydında gösterilen geliştirici destek e-posta adresini kullanabilirsiniz.</p></main></body></html>
          EOF

          npm run android:sync

      - name: Generate Play upload key
        shell: bash
        run: |
          set -euo pipefail
          PASS=$(openssl rand -hex 18)
          echo "PLAY_BOOTSTRAP_PASSWORD=$PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/halkaarz-upload.jks" \
            -storepass "$PASS" -keypass "$PASS" \
            -alias halkaarz-upload \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Halka Arz Portfoyum Upload, OU=Android, O=Halka Arz Portfoyum, C=TR"
          keytool -exportcert -rfc \
            -keystore "$RUNNER_TEMP/halkaarz-upload.jks" \
            -storepass "$PASS" -alias halkaarz-upload \
            -file "$RUNNER_TEMP/upload_certificate.pem"

      - name: Build signed Google Play bundle and release APK
        env:
          PLAY_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/halkaarz-upload.jks
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ env.PLAY_BOOTSTRAP_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: halkaarz-upload
          PLAY_UPLOAD_KEY_PASSWORD: ${{ env.PLAY_BOOTSTRAP_PASSWORD }}
        run: gradle -p android --no-daemon bundleRelease assembleRelease

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/bundle/release/app-release.aab halka-arz-portfoyum-v2.1.0.aab
          cp android/app/build/outputs/apk/release/app-release.apk halka-arz-portfoyum-v2.1.0-release.apk
          mkdir -p play-upload-key-backup
          cp "$RUNNER_TEMP/halkaarz-upload.jks" play-upload-key-backup/halkaarz-upload.jks
          cp "$RUNNER_TEMP/upload_certificate.pem" play-upload-key-backup/upload_certificate.pem
          {
            echo "PLAY_UPLOAD_KEY_ALIAS=halkaarz-upload"
            echo "PLAY_UPLOAD_KEYSTORE_PASSWORD=$PLAY_BOOTSTRAP_PASSWORD"
            echo "PLAY_UPLOAD_KEY_PASSWORD=$PLAY_BOOTSTRAP_PASSWORD"
            echo "Bu dosyayi ve JKS anahtarini guvenli bir yerde saklayin. GitHub'a yuklemeyin."
          } > play-upload-key-backup/UPLOAD_KEY_BILGILERI.txt
          zip -r google-play-upload-key-v2.1.0.zip play-upload-key-backup >/dev/null

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: google-play-aab-v2.1.0
          path: halka-arz-portfoyum-v2.1.0.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload upload-key backup
        uses: actions/upload-artifact@v4
        with:
          name: google-play-upload-key-backup-v2.1.0
          path: google-play-upload-key-v2.1.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK for device test
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-v2.1.0
          path: halka-arz-portfoyum-v2.1.0-release.apk
          if-no-files-found: error
          retention-days: 30
