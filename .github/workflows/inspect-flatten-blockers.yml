name: Export Current Clean Source

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - .github/workflows/inspect-flatten-blockers.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/code22-clean-source-work2
      - name: Export exact checked-in source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          tar --exclude='.git' --exclude='node_modules' -czf /tmp/clean-source.tar.gz .
          sha256sum /tmp/clean-source.tar.gz > /tmp/clean-source.sha256
          cat /tmp/clean-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: clean-code22-source
          path: |
            /tmp/clean-source.tar.gz
            /tmp/clean-source.sha256
          if-no-files-found: error
          retention-days: 7
