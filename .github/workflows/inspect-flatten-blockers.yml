name: Inspect Flatten Blockers

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - .github/workflows/inspect-flatten-blockers.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/code22-clean-source-work2
      - name: Reconstruct final source and inspect backend path
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/code18-delta/part* > /tmp/a.b64; base64 -d /tmp/a.b64 > /tmp/a.tar.gz; tar -xzf /tmp/a.tar.gz -C .
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 -d .ci/code17-launcher.webp.b64 > android/app/src/main/res/drawable-nodpi/ic_launcher.webp
          rm -f android/app/src/main/res/drawable/ic_launcher.xml
          cat .ci/code19-delta/part* > /tmp/b.b64; base64 -d /tmp/b.b64 > /tmp/b.tar.gz; tar -xzf /tmp/b.tar.gz -C .
          python .ci/code20-transform.py
          python .ci/code21-transform.py
          python .ci/code22-transform.py
          python .ci/code22-postfix.py
          cp .ci/code22-regression.test.js test/code22-regression.test.js
          echo '=== BACKEND TREE ==='
          find backend -maxdepth 3 -type f -print 2>/dev/null || true
          echo '=== BACKEND SERVICE TEST ==='
          cat test/backend-service.test.js 2>/dev/null || true
          echo '=== BACKEND ALERT ENGINE TEST ==='
          cat test/backend-alert-engine.test.js 2>/dev/null || true
          echo '=== PUSH BACKEND REFERENCES ==='
          grep -RniE 'backend/service|PUSH_BACKEND_URL|push/register|push/config|registerDevice|alert-engine' --exclude-dir=.git . || true
