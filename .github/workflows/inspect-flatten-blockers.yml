name: Audit Current Clean Source

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - .github/workflows/inspect-flatten-blockers.yml
      - .ci/current-audit/trigger

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install dependencies
        run: npm ci

      - name: Full tests #1
        id: tests1
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/npm-test-1.txt

      - name: Synchronize Android web assets
        id: assets
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run android:sync 2>&1 | tee /tmp/android-sync.txt
          diff -qr public android/app/src/main/assets/www 2>&1 | tee -a /tmp/android-sync.txt
          git diff --exit-code -- public android/app/src/main/assets/www 2>&1 | tee -a /tmp/android-sync.txt

      - name: Full tests #2
        id: tests2
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/npm-test-2.txt

      - name: Compile Android Java
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p android --no-daemon compileDebugJavaWithJavac 2>&1 | tee /tmp/android-compile.txt

      - name: Assemble debug
        id: assemble
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p android --no-daemon assembleDebug 2>&1 | tee /tmp/android-assemble.txt

      - name: Persist audit diagnostic
        if: always()
        shell: bash
        env:
          TESTS1: ${{ steps.tests1.outcome }}
          ASSETS: ${{ steps.assets.outcome }}
          TESTS2: ${{ steps.tests2.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .ci/current-audit
          {
            echo "EVENT_SHA=${GITHUB_SHA}"
            echo "CHECKED_OUT_HEAD=$(git rev-parse HEAD)"
            echo "tests1=$TESTS1"
            echo "assets=$ASSETS"
            echo "tests2=$TESTS2"
            echo "compile=$COMPILE"
            echo "assemble=$ASSEMBLE"
            echo
            echo "=== npm test #1 failures/summary ==="
            grep -E '^(not ok|# fail|# pass|# tests|# suites|# duration_ms)|AssertionError|ERR_ASSERTION|error:' /tmp/npm-test-1.txt 2>/dev/null || true
            echo
            echo "=== npm test #1 tail ==="
            tail -n 120 /tmp/npm-test-1.txt 2>/dev/null || true
            echo
            echo "=== asset sync tail ==="
            tail -n 80 /tmp/android-sync.txt 2>/dev/null || true
            echo
            echo "=== compile tail ==="
            tail -n 80 /tmp/android-compile.txt 2>/dev/null || true
            echo
            echo "=== assemble tail ==="
            tail -n 80 /tmp/android-assemble.txt 2>/dev/null || true
          } > .ci/current-audit/latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/current-audit/latest.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: capture current clean-source audit"
            git push origin HEAD:refactor/code22-clean-source-work2
          fi

      - name: Enforce audit result
        if: always()
        shell: bash
        env:
          TESTS1: ${{ steps.tests1.outcome }}
          ASSETS: ${{ steps.assets.outcome }}
          TESTS2: ${{ steps.tests2.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
        run: |
          set -euo pipefail
          printf 'tests1=%s assets=%s tests2=%s compile=%s assemble=%s\n' "$TESTS1" "$ASSETS" "$TESTS2" "$COMPILE" "$ASSEMBLE"
          test "$TESTS1" = success
          test "$ASSETS" = success
          test "$TESTS2" = success
          test "$COMPILE" = success
          test "$ASSEMBLE" = success
