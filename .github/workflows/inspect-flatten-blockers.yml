name: Audit Current Clean Source

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - .github/workflows/inspect-flatten-blockers.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/code22-clean-source-work2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install dependencies
        run: npm ci

      - name: Full tests #1
        run: npm test

      - name: Synchronize Android web assets
        shell: bash
        run: |
          set -euo pipefail
          npm run android:sync
          diff -qr public android/app/src/main/assets/www
          git diff --exit-code -- public android/app/src/main/assets/www

      - name: Full tests #2
        run: npm test

      - name: Compile Android Java
        run: gradle -p android --no-daemon compileDebugJavaWithJavac

      - name: Assemble debug
        run: gradle -p android --no-daemon assembleDebug

      - name: Source hygiene snapshot
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git status --short
          git diff --check
