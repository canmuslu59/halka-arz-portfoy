name: Apply native IME inset fix once

on:
  push:
    branches:
      - test/code29-separate-apk-20260915
    paths:
      - .github/workflows/apply-ime-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/code29-separate-apk-20260915
          fetch-depth: 0

      - name: Apply isolated native IME patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          java_path = Path('android/app/src/main/java/com/innative/halkaarz/MainActivity.java')
          java = java_path.read_text()

          replacements = [
              (
                  "    private int safeRightCssPx;\n    private long lastBackPressMs;",
                  "    private int safeRightCssPx;\n    private int imeBottomCssPx;\n    private long lastBackPressMs;",
              ),
              (
                  "            Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());\n            float density = Math.max(1f, getResources().getDisplayMetrics().density);",
                  "            Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());\n            Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());\n            float density = Math.max(1f, getResources().getDisplayMetrics().density);",
              ),
              (
                  "            safeRightCssPx = Math.round(bars.right / density);\n            deliverSafeInsets();",
                  "            safeRightCssPx = Math.round(bars.right / density);\n            imeBottomCssPx = Math.round(ime.bottom / density);\n            deliverSafeInsets();",
              ),
              (
                  "                + \"document.documentElement.style.setProperty('--android-safe-right','\" + safeRightCssPx + \"px');\";",
                  "                + \"document.documentElement.style.setProperty('--android-safe-right','\" + safeRightCssPx + \"px');\"\n                + \"document.documentElement.style.setProperty('--android-ime-bottom','\" + imeBottomCssPx + \"px');\";",
              ),
          ]

          for old, new in replacements:
              count = java.count(old)
              if count != 1:
                  raise SystemExit(f'MainActivity patch anchor count was {count}, expected 1: {old[:80]!r}')
              java = java.replace(old, new, 1)
          java_path.write_text(java)

          css_path = Path('public/styles.css')
          css = css_path.read_text()
          old_css = "#addSheet{bottom:var(--keyboard-inset,0px);max-height:calc(92dvh - var(--keyboard-inset,0px))}"
          new_css = "#addSheet{bottom:max(var(--keyboard-inset,0px),var(--android-ime-bottom,0px));max-height:calc(92dvh - max(var(--keyboard-inset,0px),var(--android-ime-bottom,0px)))}"
          count = css.count(old_css)
          if count != 1:
              raise SystemExit(f'CSS patch anchor count was {count}, expected 1')
          css = css.replace(old_css, new_css, 1)
          css_path.write_text(css)
          Path('android/app/src/main/assets/www/styles.css').write_text(css)
          PY

          git diff --check
          git diff -- android/app/src/main/java/com/innative/halkaarz/MainActivity.java public/styles.css android/app/src/main/assets/www/styles.css

      - name: Commit isolated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/innative/halkaarz/MainActivity.java public/styles.css android/app/src/main/assets/www/styles.css
          git commit -m "fix: use native IME inset for add sheet"
          git push origin HEAD:test/code29-separate-apk-20260915
