name: Phase1 TDD Contracts

on:
  push:
    branches:
      - refactor/code22-clean-source-work2
    paths:
      - 'test/android-build-hardening.test.js'
      - 'android/build.gradle'
      - 'android/gradle.properties'
      - 'android/app/build.gradle'
      - '.github/workflows/phase1-tdd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/code22-clean-source-work2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run focused Android build contract
        run: node --test test/android-build-hardening.test.js
