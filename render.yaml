services:
  - type: web
    name: halka-arz-portfoy-push
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: npm ci
    startCommand: node push-server.js
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: PUSH_POLL_INTERVAL_MS
        value: "60000"
      - key: PUSH_DATA_FILE
        value: /var/data/push.json
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
    disk:
      name: push-data
      mountPath: /var/data
      sizeGB: 1
